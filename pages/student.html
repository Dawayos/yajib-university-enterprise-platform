<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#111827">
  <meta http-equiv="Content-Security-Policy"content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' https://*.supabase.co wss://*.supabase.co; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"
>
<meta name="referrer" content="strict-origin-when-cross-origin">
  <title>YAJIB Student Examination Portal</title>

  <style>
    :root {
      --gold: #ffd700;
      --gold-dark: #8a7200;
      --gold-soft: #fff7c2;
      --red: #dc143c;
      --red-dark: #8f102b;
      --silver: #c0c0c0;
      --white: #ffffff;
      --ink: #111827;
      --muted: #5c6575;
      --surface: #ffffff;
      --surface-2: #f5f7fb;
      --surface-glass: rgba(255, 255, 255, 0.9);
      --line: #d8dee9;
      --line-strong: #b8c0ce;
      --success: #087f5b;
      --success-soft: #dff8ef;
      --warning: #9a5b00;
      --warning-soft: #fff2cf;
      --danger: #b42318;
      --danger-soft: #fee4e2;
      --info: #175cd3;
      --info-soft: #e8f1ff;
      --focus: #005fcc;
      --shadow-1: 0 5px 18px rgba(17, 24, 39, 0.08);
      --shadow-2: 0 18px 52px rgba(17, 24, 39, 0.14);
      --shadow-3: 0 28px 90px rgba(3, 8, 20, 0.28);
      --radius-sm: 0.65rem;
      --radius-md: 1rem;
      --radius-lg: 1.4rem;
      --radius-xl: 2rem;
      --sidebar: 17.5rem;
      --header: 4.8rem;
      --max-content: 96rem;
      --transition: 180ms ease;
      --font: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html[data-theme="dark"] {
      --ink: #f7f9fc;
      --muted: #b9c3d4;
      --surface: #111827;
      --surface-2: #0a1120;
      --surface-glass: rgba(17, 24, 39, 0.92);
      --line: #303b50;
      --line-strong: #526078;
      --gold-soft: #3b3304;
      --success-soft: #0e3b31;
      --warning-soft: #432d08;
      --danger-soft: #481b20;
      --info-soft: #142b50;
      --focus: #8ec5ff;
      --shadow-1: 0 7px 20px rgba(0, 0, 0, 0.34);
      --shadow-2: 0 20px 56px rgba(0, 0, 0, 0.42);
      --shadow-3: 0 32px 100px rgba(0, 0, 0, 0.58);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 20rem;
      scroll-behavior: smooth;
      background: var(--surface-2);
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 100% 0, rgba(255, 215, 0, 0.12), transparent 27rem),
        radial-gradient(circle at 0 100%, rgba(220, 20, 60, 0.09), transparent 32rem),
        var(--surface-2);
      font-family: var(--font);
      line-height: 1.5;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button,
    a,
    input,
    select,
    textarea {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      color: inherit;
    }

    a {
      color: var(--info);
      text-underline-offset: 0.2em;
    }

    [hidden] {
      display: none !important;
    }

    :focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .ltr {
      direction: ltr;
      unicode-bidi: isolate;
    }

    .skip-link {
      position: fixed;
      z-index: 10000;
      inset-block-start: 0.75rem;
      inset-inline-start: 0.75rem;
      translate: 0 -220%;
      padding: 0.7rem 1rem;
      border-radius: var(--radius-sm);
      color: #111827;
      background: var(--gold);
      box-shadow: var(--shadow-2);
      font-weight: 900;
      transition: translate var(--transition);
    }

    .skip-link:focus {
      translate: 0;
    }

    .preview-badge,
    .offline-banner {
      position: fixed;
      z-index: 9900;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      max-width: calc(100vw - 1.5rem);
      padding: 0.55rem 0.85rem;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 999px;
      color: #ffffff;
      box-shadow: var(--shadow-2);
      font-size: 0.8rem;
      font-weight: 900;
    }

    .preview-badge {
      inset-block-start: 0.75rem;
      inset-inline-end: 0.75rem;
      background: #5a2ca0;
    }

    .offline-banner {
      inset-block-end: 0.75rem;
      inset-inline-end: 0.75rem;
      background: var(--danger);
    }

    .sidebar-overlay {
      position: fixed;
      z-index: 780;
      inset: 0;
      border: 0;
      background: rgba(3, 8, 20, 0.7);
      backdrop-filter: blur(4px);
    }

    .sidebar {
      position: fixed;
      z-index: 800;
      inset-block: 0;
      inset-inline-start: 0;
      display: flex;
      width: var(--sidebar);
      flex-direction: column;
      overflow: hidden;
      color: #ffffff;
      background:
        radial-gradient(circle at 80% 4%, rgba(255, 215, 0, 0.22), transparent 11rem),
        linear-gradient(180deg, #151d2b, #080d17 72%);
      box-shadow: var(--shadow-3);
    }

    .brand {
      display: flex;
      min-height: var(--header);
      align-items: center;
      gap: 0.8rem;
      padding-inline: 1.2rem;
      color: inherit;
      text-decoration: none;
    }

    .brand-mark {
      display: grid;
      width: 2.7rem;
      aspect-ratio: 1;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 0.9rem;
      color: #111827;
      background: linear-gradient(145deg, #fff9cf, var(--gold) 58%, #a98d00);
      box-shadow: 0 10px 25px rgba(255, 215, 0, 0.22);
      font-weight: 950;
    }

    .brand-copy {
      min-width: 0;
    }

    .brand-name,
    .brand-subtitle {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .brand-name {
      font-weight: 950;
      letter-spacing: 0.025em;
    }

    .brand-subtitle {
      color: #bec9d8;
      font-size: 0.72rem;
    }

    .sidebar-close {
      position: absolute;
      inset-block-start: 1rem;
      inset-inline-end: 0.7rem;
    }

    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 1.2rem 0.8rem;
      overscroll-behavior: contain;
    }

    .nav-heading {
      margin: 0.5rem 0.65rem;
      color: #93a1b5;
      font-size: 0.68rem;
      font-weight: 900;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    .nav-list {
      display: grid;
      gap: 0.28rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .nav-link {
      display: flex;
      width: 100%;
      min-height: 2.9rem;
      align-items: center;
      gap: 0.7rem;
      padding: 0.62rem 0.75rem;
      border: 1px solid transparent;
      border-radius: 0.82rem;
      color: #d9e2ee;
      background: transparent;
      text-align: start;
      cursor: pointer;
      transition:
        color var(--transition),
        background var(--transition),
        border-color var(--transition),
        translate var(--transition);
    }

    .nav-link:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.07);
    }

    .nav-link[aria-current="page"] {
      border-color: rgba(255, 255, 255, 0.34);
      color: #111827;
      background: linear-gradient(135deg, #fff9cd, var(--gold));
      box-shadow: 0 12px 30px rgba(255, 215, 0, 0.18);
      font-weight: 900;
    }

    .nav-icon {
      display: grid;
      width: 1.65rem;
      flex: 0 0 auto;
      place-items: center;
      font-size: 1.04rem;
    }

    .sidebar-footer {
      display: grid;
      gap: 0.55rem;
      padding: 0.9rem 1rem;
      border-block-start: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(0, 0, 0, 0.17);
      color: #b9c5d5;
      font-size: 0.73rem;
    }

    .privacy-line {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
    }

    .page {
      min-height: 100vh;
      margin-inline-start: var(--sidebar);
    }

    .topbar {
      position: sticky;
      z-index: 650;
      inset-block-start: 0;
      display: grid;
      min-height: var(--header);
      grid-template-columns: minmax(12rem, 1fr) minmax(15rem, 28rem) auto;
      align-items: center;
      gap: 1rem;
      padding: 0.7rem clamp(0.8rem, 2vw, 1.5rem);
      border-block-end: 1px solid var(--line);
      background: var(--surface-glass);
      backdrop-filter: blur(18px) saturate(130%);
      box-shadow: 0 1px 4px rgba(17, 24, 39, 0.06);
    }

    .header-title p,
    .header-title h1 {
      margin: 0;
    }

    .eyebrow {
      color: var(--red);
      font-size: 0.7rem;
      font-weight: 950;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    .header-title h1 {
      overflow: hidden;
      font-size: clamp(1rem, 2vw, 1.35rem);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .search-wrap {
      position: relative;
    }

    .search-wrap input {
      width: 100%;
      min-height: 2.75rem;
      padding-inline: 2.55rem 1rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink);
      background: var(--surface);
      box-shadow: 0 1px 2px rgba(17, 24, 39, 0.04);
    }

    .search-symbol {
      position: absolute;
      inset-block-start: 50%;
      inset-inline-start: 0.95rem;
      translate: 0 -50%;
      color: var(--muted);
      pointer-events: none;
    }

    .header-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.4rem;
    }

    .button,
    .icon-button,
    .small-button,
    .view-button {
      display: inline-flex;
      min-height: 2.75rem;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      border: 1px solid var(--line);
      border-radius: 0.78rem;
      color: var(--ink);
      background: var(--surface);
      box-shadow: 0 1px 2px rgba(17, 24, 39, 0.05);
      font-weight: 800;
      cursor: pointer;
      transition:
        translate var(--transition),
        border-color var(--transition),
        box-shadow var(--transition),
        background var(--transition);
    }

    .button:hover,
    .icon-button:hover,
    .small-button:hover,
    .view-button:hover {
      border-color: var(--line-strong);
      box-shadow: var(--shadow-1);
      translate: 0 -1px;
    }

    .button {
      padding: 0.65rem 1rem;
    }

    .small-button {
      min-height: 2.3rem;
      padding: 0.4rem 0.65rem;
      border-radius: 0.62rem;
      font-size: 0.78rem;
    }

    .icon-button {
      width: 2.75rem;
      padding: 0;
    }

    .button-primary {
      border-color: #bd9f00;
      color: #111827;
      background: linear-gradient(135deg, #fff6a0, var(--gold));
    }

    .button-danger {
      border-color: var(--red);
      color: #ffffff;
      background: linear-gradient(135deg, var(--red), var(--red-dark));
    }

    .button-secondary {
      color: #ffffff;
      border-color: var(--red);
      background: linear-gradient(135deg, var(--red), var(--red-dark));
    }

    .button-quiet {
      background: transparent;
      box-shadow: none;
    }

    button[disabled] {
      cursor: not-allowed;
      opacity: 0.58;
      translate: none !important;
      box-shadow: none !important;
    }

    .connection-pill {
      display: inline-flex;
      min-height: 2.75rem;
      align-items: center;
      gap: 0.45rem;
      padding: 0.45rem 0.7rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      font-size: 0.76rem;
      font-weight: 900;
      white-space: nowrap;
    }

    .connection-dot {
      width: 0.62rem;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 4px var(--success-soft);
    }

    .connection-pill[data-state="offline"] .connection-dot,
    .connection-pill[data-state="error"] .connection-dot {
      background: var(--danger);
      box-shadow: 0 0 0 4px var(--danger-soft);
    }

    .connection-pill[data-state="connecting"] .connection-dot {
      background: var(--warning);
      box-shadow: 0 0 0 4px var(--warning-soft);
      animation: pulse 1.2s infinite;
    }

    .language-select {
      min-height: 2.75rem;
      max-width: 8.5rem;
      padding-inline: 0.6rem;
      border: 1px solid var(--line);
      border-radius: 0.78rem;
      color: var(--ink);
      background: var(--surface);
      font-weight: 800;
    }

    .notification-button {
      position: relative;
    }

    .notification-count {
      position: absolute;
      inset-block-start: -0.38rem;
      inset-inline-end: -0.38rem;
      display: grid;
      min-width: 1.25rem;
      height: 1.25rem;
      place-items: center;
      padding-inline: 0.2rem;
      border: 2px solid var(--surface);
      border-radius: 999px;
      color: #ffffff;
      background: var(--red);
      font-size: 0.65rem;
      font-weight: 950;
    }

    .profile-wrap {
      position: relative;
    }

    .profile-trigger {
      width: auto;
      padding-inline: 0.38rem 0.7rem;
    }

    .avatar {
      display: grid;
      width: 2rem;
      aspect-ratio: 1;
      place-items: center;
      border: 2px solid rgba(255, 215, 0, 0.72);
      border-radius: 50%;
      color: #ffffff;
      background: linear-gradient(145deg, var(--red), #5a0a1e);
      font-size: 0.7rem;
      font-weight: 950;
    }

    .profile-name {
      max-width: 8rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .popover {
      position: absolute;
      z-index: 900;
      inset-block-start: calc(100% + 0.55rem);
      inset-inline-end: 0;
      width: min(18rem, calc(100vw - 1.5rem));
      padding: 0.5rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface);
      box-shadow: var(--shadow-3);
    }

    .popover button {
      display: flex;
      width: 100%;
      min-height: 2.65rem;
      align-items: center;
      gap: 0.6rem;
      padding: 0.55rem 0.7rem;
      border: 0;
      border-radius: 0.65rem;
      color: var(--ink);
      background: transparent;
      text-align: start;
      cursor: pointer;
    }

    .popover button:hover {
      background: var(--surface-2);
    }

    .main {
      width: min(100%, var(--max-content));
      margin-inline: auto;
      padding: 1.2rem clamp(0.75rem, 2vw, 1.6rem) 2.5rem;
    }

    .breadcrumbs {
      margin-block-end: 0.9rem;
      overflow-x: auto;
    }

    .breadcrumbs ol {
      display: flex;
      min-width: max-content;
      align-items: center;
      gap: 0.4rem;
      margin: 0;
      padding: 0;
      color: var(--muted);
      list-style: none;
      font-size: 0.78rem;
    }

    .breadcrumb-arrow {
      opacity: 0.55;
    }

    html[dir="rtl"] .breadcrumb-arrow,
    html[dir="rtl"] .directional {
      scale: -1 1;
    }

    .review-strip {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.65rem;
      margin-block-end: 1rem;
      padding: 0.7rem 0.9rem;
      border: 1px solid color-mix(in srgb, var(--gold) 52%, var(--line));
      border-radius: var(--radius-md);
      background:
        linear-gradient(90deg, rgba(255, 215, 0, 0.13), transparent),
        var(--surface);
    }

    .review-status {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      color: var(--warning);
      font-size: 0.8rem;
      font-weight: 950;
    }

    .review-status::before {
      width: 0.62rem;
      aspect-ratio: 1;
      border-radius: 50%;
      content: "";
      background: var(--warning);
      box-shadow: 0 0 0 4px var(--warning-soft);
    }

    .hero {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(18rem, 0.75fr);
      gap: 1rem;
      overflow: hidden;
      margin-block-end: 1rem;
      padding: clamp(1rem, 3vw, 1.7rem);
      border: 1px solid rgba(255, 215, 0, 0.35);
      border-radius: var(--radius-xl);
      color: #ffffff;
      background:
        radial-gradient(circle at 88% 10%, rgba(255, 215, 0, 0.3), transparent 15rem),
        linear-gradient(135deg, #151c29 0%, #6d1026 56%, #bc123b 100%);
      box-shadow: var(--shadow-2);
    }

    .hero::after {
      position: absolute;
      width: 18rem;
      aspect-ratio: 1;
      inset-block-end: -12rem;
      inset-inline-end: -5rem;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 50%;
      content: "";
      box-shadow:
        0 0 0 3rem rgba(255, 255, 255, 0.035),
        0 0 0 6rem rgba(255, 255, 255, 0.022);
    }

    .hero-copy,
    .identity-card {
      position: relative;
      z-index: 1;
    }

    .hero h2 {
      max-width: 48rem;
      margin: 0.25rem 0 0.55rem;
      font-size: clamp(1.55rem, 4vw, 2.55rem);
      line-height: 1.1;
    }

    .hero p {
      max-width: 50rem;
      margin: 0;
      color: #e5eaf1;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-block-start: 1.1rem;
    }

    .hero .button:not(.button-primary) {
      border-color: rgba(255, 255, 255, 0.28);
      color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
    }

    .identity-card {
      display: grid;
      align-content: center;
      gap: 0.8rem;
      padding: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: var(--radius-lg);
      background: rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(12px);
    }

    .identity-top {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .identity-avatar {
      display: grid;
      width: 4rem;
      aspect-ratio: 1;
      place-items: center;
      border: 2px solid rgba(255, 215, 0, 0.72);
      border-radius: 1.15rem;
      background: linear-gradient(145deg, #8a1431, #240711);
      font-weight: 950;
    }

    .identity-card h3,
    .identity-card p {
      margin: 0;
    }

    .identity-card p {
      color: #d6deea;
      font-size: 0.8rem;
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.42rem;
    }

    .badge {
      display: inline-flex;
      min-height: 1.65rem;
      align-items: center;
      gap: 0.3rem;
      max-width: 100%;
      padding: 0.24rem 0.52rem;
      border: 1px solid transparent;
      border-radius: 999px;
      font-size: 0.69rem;
      font-weight: 900;
      line-height: 1.2;
    }

    .badge-success {
      border-color: color-mix(in srgb, var(--success) 30%, transparent);
      color: var(--success);
      background: var(--success-soft);
    }

    .badge-warning {
      border-color: color-mix(in srgb, var(--warning) 30%, transparent);
      color: var(--warning);
      background: var(--warning-soft);
    }

    .badge-danger {
      border-color: color-mix(in srgb, var(--danger) 30%, transparent);
      color: var(--danger);
      background: var(--danger-soft);
    }

    .badge-info {
      border-color: color-mix(in srgb, var(--info) 30%, transparent);
      color: var(--info);
      background: var(--info-soft);
    }

    .badge-neutral {
      border-color: var(--line);
      color: var(--muted);
      background: var(--surface-2);
    }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(9rem, 1fr));
      gap: 0.75rem;
      margin-block-end: 1rem;
    }

    .quick-card {
      position: relative;
      display: grid;
      min-width: 0;
      min-height: 8.6rem;
      align-content: space-between;
      overflow: hidden;
      padding: 0.95rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      color: var(--ink);
      background: var(--surface);
      box-shadow: var(--shadow-1);
      text-align: start;
      cursor: pointer;
    }

    .quick-card::before {
      position: absolute;
      inset-block: 0;
      inset-inline-start: 0;
      width: 0.23rem;
      content: "";
      background: linear-gradient(var(--gold), var(--red));
    }

    .quick-card:hover {
      border-color: color-mix(in srgb, var(--gold) 70%, var(--line));
      box-shadow: var(--shadow-2);
      translate: 0 -2px;
    }

    .quick-icon {
      display: grid;
      width: 2.35rem;
      aspect-ratio: 1;
      place-items: center;
      border-radius: 0.76rem;
      background: var(--gold-soft);
      font-size: 1.1rem;
    }

    .quick-card strong {
      display: block;
      margin-block-start: 0.65rem;
      font-size: 0.88rem;
    }

    .quick-card small {
      display: block;
      margin-block-start: 0.15rem;
      color: var(--muted);
    }

    .section {
      scroll-margin-block-start: calc(var(--header) + 1rem);
      margin-block-start: 1rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: var(--shadow-1);
    }

    .section-header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 1.05rem 1.1rem 0;
    }

    .section-heading h2,
    .section-heading p {
      margin: 0;
    }

    .section-heading h2 {
      font-size: clamp(1.08rem, 2vw, 1.35rem);
    }

    .section-heading p {
      margin-block-start: 0.25rem;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .section-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.42rem;
    }

    .divider {
      height: 1px;
      margin: 0.9rem 1.1rem 0;
      background: linear-gradient(90deg, var(--gold), var(--red), transparent);
      opacity: 0.58;
    }

    .section-body {
      padding: 1.05rem 1.1rem 1.15rem;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(9.5rem, 1fr));
      gap: 0.75rem;
    }

    .kpi-card {
      position: relative;
      min-width: 0;
      overflow: hidden;
      padding: 0.9rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface);
    }

    .kpi-card::before {
      position: absolute;
      inset-block: 0;
      inset-inline-start: 0;
      width: 0.22rem;
      content: "";
      background: linear-gradient(var(--gold), var(--red));
    }

    .kpi-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .kpi-label {
      margin: 0;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 900;
    }

    .kpi-icon {
      display: grid;
      width: 2rem;
      aspect-ratio: 1;
      place-items: center;
      border-radius: 0.65rem;
      background: var(--gold-soft);
    }

    .kpi-value {
      margin: 0.65rem 0 0.15rem;
      font-size: clamp(1.2rem, 3vw, 1.75rem);
      font-weight: 950;
      line-height: 1;
    }

    .kpi-note {
      margin: 0;
      color: var(--muted);
      font-size: 0.68rem;
    }

    .gallery-toolbar {
      display: grid;
      grid-template-columns: minmax(15rem, 1fr) repeat(3, minmax(9rem, auto)) auto;
      gap: 0.55rem;
      margin-block-end: 0.85rem;
    }

    .field {
      display: grid;
      gap: 0.28rem;
    }

    .field label {
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 900;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      min-height: 2.7rem;
      padding: 0.6rem 0.7rem;
      border: 1px solid var(--line);
      border-radius: 0.72rem;
      color: var(--ink);
      background: var(--surface);
    }

    .field textarea {
      min-height: 7rem;
      resize: vertical;
    }

    .gallery-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      margin-block-end: 0.75rem;
    }

    .result-count {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 900;
    }

    .view-switch {
      display: inline-flex;
      padding: 0.22rem;
      border: 1px solid var(--line);
      border-radius: 0.76rem;
      background: var(--surface-2);
    }

    .view-button {
      min-height: 2.15rem;
      padding-inline: 0.62rem;
      border: 0;
      border-radius: 0.58rem;
      background: transparent;
      box-shadow: none;
      font-size: 0.75rem;
    }

    .view-button[aria-pressed="true"] {
      color: #111827;
      background: var(--gold);
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.85rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .exam-card {
      display: flex;
      min-width: 0;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: 0 2px 7px rgba(17, 24, 39, 0.05);
      transition:
        translate var(--transition),
        box-shadow var(--transition),
        border-color var(--transition);
    }

    .exam-card:hover,
    .exam-card:focus-within {
      border-color: color-mix(in srgb, var(--gold) 68%, var(--line));
      box-shadow: var(--shadow-2);
      translate: 0 -2px;
    }

    .exam-media {
      position: relative;
      display: grid;
      aspect-ratio: 16 / 8.3;
      place-items: center;
      overflow: hidden;
      color: #ffffff;
      background:
        radial-gradient(circle at 82% 18%, rgba(255, 215, 0, 0.8), transparent 5rem),
        linear-gradient(145deg, #111827, #79102b 60%, #dc143c);
    }

    .exam-media[data-variant="gold"] {
      color: #111827;
      background:
        radial-gradient(circle at 18% 17%, rgba(255, 255, 255, 0.75), transparent 5rem),
        linear-gradient(145deg, #fff5aa, var(--gold), #b49500);
    }

    .exam-media[data-variant="silver"] {
      color: #111827;
      background:
        radial-gradient(circle at 83% 18%, #ffffff, transparent 5rem),
        linear-gradient(145deg, #f8fafc, var(--silver), #858f9f);
    }

    .exam-symbol {
      font-size: 2.5rem;
      filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.2));
    }

    .exam-status {
      position: absolute;
      inset-block-start: 0.62rem;
      inset-inline-start: 0.62rem;
    }

    .exam-body {
      display: grid;
      flex: 1;
      gap: 0.65rem;
      padding: 0.9rem;
    }

    .exam-body h3,
    .exam-body p {
      margin: 0;
    }

    .exam-body h3 {
      font-size: 1rem;
      line-height: 1.3;
    }

    .exam-body p {
      color: var(--muted);
      font-size: 0.78rem;
    }

    .metadata-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.42rem;
    }

    .metadata {
      min-width: 0;
      padding: 0.48rem;
      border-radius: 0.62rem;
      background: var(--surface-2);
    }

    .metadata span {
      display: block;
      overflow-wrap: anywhere;
    }

    .metadata-label {
      color: var(--muted);
      font-size: 0.64rem;
      font-weight: 900;
    }

    .metadata-value {
      margin-block-start: 0.1rem;
      font-size: 0.74rem;
      font-weight: 850;
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.42rem;
      margin-block-start: auto;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
    }

    th,
    td {
      padding: 0.72rem;
      border-block-end: 1px solid var(--line);
      text-align: start;
      vertical-align: top;
    }

    th {
      color: var(--muted);
      background: var(--surface-2);
      font-size: 0.7rem;
      font-weight: 950;
      letter-spacing: 0.02em;
    }

    tbody tr:last-child td {
      border-block-end: 0;
    }

    tbody tr:hover {
      background: color-mix(in srgb, var(--gold) 5%, var(--surface));
    }

    .pagination {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      margin-block-start: 0.9rem;
    }

    .pagination-status {
      min-width: 8rem;
      color: var(--muted);
      text-align: center;
      font-size: 0.76rem;
      font-weight: 900;
    }

    .readiness-grid,
    .project-grid,
    .receipt-grid,
    .enquiry-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.75rem;
    }

    .info-card {
      display: grid;
      min-width: 0;
      gap: 0.55rem;
      padding: 0.85rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface-2);
    }

    .info-card h3,
    .info-card p {
      margin: 0;
    }

    .info-card p {
      color: var(--muted);
      font-size: 0.78rem;
    }

    .progress {
      height: 0.58rem;
      overflow: hidden;
      border-radius: 999px;
      background: var(--line);
    }

    .progress-bar {
      width: var(--progress, 0%);
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--red), var(--gold));
    }

    .tracking-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-block-end: 0.9rem;
    }

    .batch-button {
      min-height: 2.45rem;
      padding: 0.45rem 0.75rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink);
      background: var(--surface);
      font-weight: 850;
      cursor: pointer;
    }

    .batch-button[aria-pressed="true"] {
      border-color: var(--red);
      color: #ffffff;
      background: linear-gradient(135deg, var(--red), var(--red-dark));
    }

    .timeline {
      display: grid;
      gap: 0;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .timeline-step {
      position: relative;
      display: grid;
      grid-template-columns: 2.4rem minmax(0, 1fr) auto;
      gap: 0.7rem;
      min-height: 4.2rem;
      padding-block-end: 0.8rem;
    }

    .timeline-step:not(:last-child)::after {
      position: absolute;
      inset-block-start: 2.15rem;
      inset-block-end: 0;
      inset-inline-start: 1.16rem;
      width: 2px;
      content: "";
      background: var(--line);
    }

    .timeline-step[data-state="complete"]:not(:last-child)::after {
      background: var(--success);
    }

    .timeline-marker {
      position: relative;
      z-index: 1;
      display: grid;
      width: 2.35rem;
      aspect-ratio: 1;
      place-items: center;
      border: 2px solid var(--line-strong);
      border-radius: 50%;
      color: var(--muted);
      background: var(--surface);
      font-size: 0.72rem;
      font-weight: 950;
    }

    .timeline-step[data-state="complete"] .timeline-marker {
      border-color: var(--success);
      color: #ffffff;
      background: var(--success);
    }

    .timeline-step[data-state="current"] .timeline-marker {
      border-color: var(--gold-dark);
      color: #111827;
      background: var(--gold);
      box-shadow: 0 0 0 5px var(--gold-soft);
    }

    .timeline-copy h3,
    .timeline-copy p {
      margin: 0;
    }

    .timeline-copy h3 {
      font-size: 0.86rem;
    }

    .timeline-copy p {
      margin-block-start: 0.16rem;
      color: var(--muted);
      font-size: 0.73rem;
    }

    .result-summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.7rem;
      margin-block-end: 0.85rem;
    }

    .summary-card {
      padding: 0.8rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface-2);
    }

    .summary-card dt,
    .summary-card dd {
      margin: 0;
    }

    .summary-card dt {
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 900;
    }

    .summary-card dd {
      margin-block-start: 0.2rem;
      font-size: 1.05rem;
      font-weight: 950;
    }

    .project-timeline {
      display: grid;
      gap: 0.55rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .project-step {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: start;
      gap: 0.65rem;
      padding: 0.7rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface-2);
    }

    .step-icon {
      display: grid;
      width: 2.15rem;
      aspect-ratio: 1;
      place-items: center;
      border-radius: 0.7rem;
      background: var(--gold-soft);
    }

    .project-step h3,
    .project-step p {
      margin: 0;
    }

    .project-step p {
      margin-block-start: 0.15rem;
      color: var(--muted);
      font-size: 0.75rem;
    }

    .state-panel {
      display: grid;
      min-height: 17rem;
      place-items: center;
      padding: 1.2rem;
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius-lg);
      background: var(--surface-2);
      text-align: center;
    }

    .state-content {
      display: grid;
      max-width: 36rem;
      justify-items: center;
      gap: 0.6rem;
    }

    .state-icon {
      display: grid;
      width: 4rem;
      aspect-ratio: 1;
      place-items: center;
      border-radius: 1.15rem;
      background: var(--gold-soft);
      font-size: 1.6rem;
    }

    .state-content h2,
    .state-content p {
      margin: 0;
    }

    .state-content p {
      color: var(--muted);
    }

    .contract-list {
      width: 100%;
      max-height: 15rem;
      overflow: auto;
      margin: 0.25rem 0 0;
      padding: 0.7rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface);
      text-align: start;
      list-style-position: inside;
    }

    .contract-list code {
      direction: ltr;
      unicode-bidi: isolate;
      font-size: 0.75rem;
    }

    .skeleton {
      position: relative;
      overflow: hidden;
      background: var(--line);
    }

    .skeleton::after {
      position: absolute;
      inset: 0;
      content: "";
      translate: -100% 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent);
      animation: shimmer 1.4s infinite;
    }

    .skeleton-card {
      min-height: 12rem;
      border-radius: var(--radius-lg);
    }

    .drawer {
      position: fixed;
      z-index: 1200;
      inset-block: 0;
      inset-inline-end: 0;
      display: flex;
      width: min(28rem, 100vw);
      flex-direction: column;
      border-inline-start: 1px solid var(--line);
      background: var(--surface);
      box-shadow: var(--shadow-3);
    }

    .drawer-header,
    .dialog-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.7rem;
      padding: 1rem;
      border-block-end: 1px solid var(--line);
    }

    .drawer-header h2,
    .drawer-header p,
    .dialog-header h2,
    .dialog-header p {
      margin: 0;
    }

    .drawer-header p,
    .dialog-header p {
      margin-block-start: 0.2rem;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
    }

    .drawer-footer,
    .dialog-footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 0.5rem;
      padding: 1rem;
      border-block-start: 1px solid var(--line);
      background: var(--surface-2);
    }

    .notification-list {
      display: grid;
      gap: 0.6rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .notification-item {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 0.65rem;
      padding: 0.75rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface-2);
    }

    .notification-item h3,
    .notification-item p {
      margin: 0;
    }

    .notification-item p {
      margin-block-start: 0.16rem;
      color: var(--muted);
      font-size: 0.74rem;
    }

    .dialog {
      width: min(44rem, calc(100vw - 1.5rem));
      max-height: min(90vh, 55rem);
      overflow: hidden;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      color: var(--ink);
      background: var(--surface);
      box-shadow: var(--shadow-3);
    }

    .dialog::backdrop {
      background: rgba(3, 8, 20, 0.72);
      backdrop-filter: blur(5px);
    }

    .dialog-body {
      max-height: calc(90vh - 9rem);
      overflow-y: auto;
      padding: 1rem;
    }

    .readiness-list {
      display: grid;
      gap: 0.55rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .readiness-item {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 0.65rem;
      padding: 0.72rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface-2);
    }

    .readiness-item h3,
    .readiness-item p {
      margin: 0;
    }

    .readiness-item p {
      margin-block-start: 0.14rem;
      color: var(--muted);
      font-size: 0.72rem;
    }

    .security-notice {
      margin-block-start: 0.85rem;
      padding: 0.8rem;
      border: 1px solid var(--line);
      border-inline-start: 0.28rem solid var(--warning);
      border-radius: var(--radius-md);
      background: var(--warning-soft);
      color: var(--warning);
      font-size: 0.77rem;
    }

    .toast-stack {
      position: fixed;
      z-index: 2000;
      inset-block-end: 1rem;
      inset-inline-end: 1rem;
      display: grid;
      width: min(24rem, calc(100vw - 2rem));
      gap: 0.55rem;
      pointer-events: none;
    }

    .toast {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: start;
      gap: 0.6rem;
      padding: 0.8rem;
      border: 1px solid var(--line);
      border-inline-start: 0.28rem solid var(--info);
      border-radius: var(--radius-md);
      background: var(--surface);
      box-shadow: var(--shadow-3);
      pointer-events: auto;
    }

    .toast[data-kind="success"] {
      border-inline-start-color: var(--success);
    }

    .toast[data-kind="warning"] {
      border-inline-start-color: var(--warning);
    }

    .toast[data-kind="error"] {
      border-inline-start-color: var(--danger);
    }

    .toast p {
      margin: 0;
      font-size: 0.8rem;
    }

    .toast button {
      width: 2rem;
      min-height: 2rem;
      border: 0;
      border-radius: 0.45rem;
      background: transparent;
      cursor: pointer;
    }

    .footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-block-start: 1.4rem;
      padding: 1rem 0;
      border-block-start: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.75rem;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .mobile-only {
      display: none;
    }

    @keyframes shimmer {
      to {
        translate: 100% 0;
      }
    }

    @keyframes pulse {
      50% {
        opacity: 0.42;
      }
    }

    @media (max-width: 80rem) {
      .quick-grid,
      .kpi-grid {
        grid-template-columns: repeat(4, minmax(9rem, 1fr));
      }

      .gallery-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 64rem) {
      .sidebar {
        translate: -105% 0;
        transition: translate var(--transition);
      }

      html[dir="rtl"] .sidebar {
        translate: 105% 0;
      }

      .sidebar[data-open="true"] {
        translate: 0;
      }

      .page {
        margin-inline-start: 0;
      }

      .mobile-only {
        display: inline-flex;
      }

      .topbar {
        grid-template-columns: auto minmax(0, 1fr) auto;
      }

      .search-wrap {
        grid-column: 1 / -1;
        grid-row: 2;
      }

      .connection-pill span:last-child,
      .profile-name {
        display: none;
      }

      .hero {
        grid-template-columns: 1fr;
      }

      .quick-grid,
      .kpi-grid {
        grid-template-columns: repeat(3, minmax(9rem, 1fr));
      }

      .gallery-toolbar {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .gallery-toolbar .field:first-child {
        grid-column: 1 / -1;
      }

      .readiness-grid,
      .project-grid,
      .receipt-grid,
      .enquiry-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 47rem) {
      .main {
        padding-inline: 0.7rem;
      }

      .topbar {
        gap: 0.45rem;
        padding-inline: 0.7rem;
      }

      .language-select {
        width: 3.5rem;
        padding-inline: 0.2rem;
      }

      .connection-pill {
        width: 2.75rem;
        justify-content: center;
        padding: 0;
      }

      .quick-grid,
      .kpi-grid,
      .result-summary {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .gallery-grid,
      .gallery-toolbar,
      .readiness-grid,
      .project-grid,
      .receipt-grid,
      .enquiry-grid {
        grid-template-columns: 1fr;
      }

      .gallery-toolbar .field:first-child {
        grid-column: auto;
      }

      .section-header,
      .section-body {
        padding-inline: 0.8rem;
      }

      .divider {
        margin-inline: 0.8rem;
      }

      .timeline-step {
        grid-template-columns: 2.4rem minmax(0, 1fr);
      }

      .timeline-step > :last-child {
        grid-column: 2;
      }
    }

    @media (max-width: 29rem) {
      .quick-grid,
      .kpi-grid,
      .result-summary {
        grid-template-columns: 1fr;
      }

      .hero-actions,
      .card-actions,
      .section-actions,
      .dialog-footer,
      .drawer-footer {
        display: grid;
        grid-template-columns: 1fr;
      }

      .hero-actions .button,
      .card-actions .button,
      .section-actions .button,
      .dialog-footer .button,
      .drawer-footer .button {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 1ms !important;
      }
    }

    @media print {
      @page {
        size: A4;
        margin: 13mm;
      }

      html,
      body {
        color: #000000 !important;
        background: #ffffff !important;
      }

      .sidebar,
      .topbar,
      .sidebar-overlay,
      .skip-link,
      .preview-badge,
      .offline-banner,
      .quick-grid,
      .gallery-toolbar,
      .gallery-meta .view-switch,
      .pagination,
      .section-actions,
      .card-actions,
      .drawer,
      .dialog,
      .toast-stack,
      .hero-actions,
      button {
        display: none !important;
      }

      .page {
        margin: 0;
      }

      .main {
        width: 100%;
        max-width: none;
        padding: 0;
      }

      .hero {
        color: #000000;
        background: #ffffff;
        border: 2px solid #000000;
        box-shadow: none;
      }

      .hero p,
      .identity-card p {
        color: #333333;
      }

      .identity-card {
        color: #000000;
        background: #ffffff;
        border-color: #777777;
      }

      .section,
      .exam-card,
      .kpi-card,
      .info-card {
        break-inside: avoid;
        box-shadow: none;
      }

      .gallery-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .exam-media {
        color: #000000;
        background: #eeeeee !important;
        border-block-end: 1px solid #777777;
      }

      th {
        color: #000000;
        background: #eeeeee;
      }

      .print-heading {
        display: block !important;
        margin-block-end: 6mm;
        padding-block-end: 4mm;
        border-block-end: 2px solid #000000;
      }
    }
  </style>
</head>

    function isDevelopment() {
      return ["localhost", "127.0.0.1"].includes(location.hostname) ||
        location.search.includes("debug=1");
    }

    function verifyDictionaryParity() {
      const en = Object.keys(dictionaries.en).sort();
      const ar = Object.keys(dictionaries.ar).sort();
      const fr = Object.keys(dictionaries.fr).sort();

      const matches =
        JSON.stringify(en) === JSON.stringify(ar) &&
        JSON.stringify(en) === JSON.stringify(fr);

      if (!matches && isDevelopment()) {
        console.warn("YAJIB dictionary parity check failed.");
      }

      return matches;
    }

    function t(key, replacements = {}) {
      let value = dictionaries[state.language]?.[key] ?? dictionaries.en[key];

      if (value === undefined) {
        value = dictionaries.en.unavailable;

        if (isDevelopment()) {
          console.warn(`Missing translation key: ${key}`);
        }
      }

      for (const [name, replacement] of Object.entries(replacements)) {
        value = value.replaceAll(`{${name}}`, String(replacement));
      }

      return value;
    }

    function locale() {
      return localeMap[state.language] || localeMap.en;
    }

      const numeric = Number(value);
      if (!Number.isFinite(numeric)) return t("unavailable");
      return new Intl.NumberFormat(locale(), options).format(numeric);
    }

    function formatPercent(value, digits = 0) {
      const numeric = Number(value);
      if (!Number.isFinite(numeric)) return t("unavailable");

      return new Intl.NumberFormat(locale(), {
        style: "percent",
        maximumFractionDigits: digits
      }).format(numeric / 100);
    }

    function formatDate(value, options = { dateStyle: "medium" }) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return t("unavailable");
      return new Intl.DateTimeFormat(locale(), options).format(date);
    }

    function formatRelative(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return t("unavailable");

      const seconds = Math.round((date.getTime() - Date.now()) / 1000);
      const absolute = Math.abs(seconds);

      if (absolute < 60) {
        return new Intl.RelativeTimeFormat(locale(), { numeric: "auto" })
          .format(seconds, "second");
      }

      if (absolute < 3600) {
        return new Intl.RelativeTimeFormat(locale(), { numeric: "auto" })
          .format(Math.round(seconds / 60), "minute");
      }

      if (absolute < 86400) {
        return new Intl.RelativeTimeFormat(locale(), { numeric: "auto" })
          .format(Math.round(seconds / 3600), "hour");
      }

      return new Intl.RelativeTimeFormat(locale(), { numeric: "auto" })
        .format(Math.round(seconds / 86400), "day");
    }

    function localized(record, field = "title") {
      if (!record) return t("unavailable");

      return record[`${field}_${state.language}`] ||
        record[`${field}_en`] ||
        record[field] ||
        t("unavailable");
    }

    function createElement(tag, options = {}) {
      const node = document.createElement(tag);

      if (options.className) node.className = options.className;
      if (options.text !== undefined) node.textContent = options.text;

      if (options.attributes) {
        for (const [name, value] of Object.entries(options.attributes)) {
          if (value !== null && value !== undefined) {
            node.setAttribute(name, String(value));
          }
        }
      }

      return node;
    }

    function normalizeSearch(value) {
      return String(value || "")
        .normalize("NFKC")
        .toLocaleLowerCase(locale())
        .trim();
    }

    function initials(name) {
      const value = String(name || "").trim();

      if (!value) return state.language === "ar" ? "ط" : "ST";

      return value
        .split(/\s+/u)
        .slice(0, 2)
        .map((part) => Array.from(part)[0] || "")
        .join("")
        .toLocaleUpperCase(locale());
    }

      elements.workspace.hidden = true;

      const headingKey = {
        setup: "backendSetupRequired",
        expired: "sessionExpired",

      }[type] || "serviceUnavailable";

      const descriptionKey = {

        unavailable: "serviceUnavailableDescription",
        rate: "rateLimitedDescription"
      }[type] || "serviceUnavailableDescription";

      content.append(
        createElement("div", {
          className: "state-icon",
          text: type === "expired" ? "⌛" : type === "forbidden" ? "⛔" : "⚙",
          attributes: { "aria-hidden": "true" }
        }),
        createElement("h2", { text: t(headingKey) }),
        createElement("p", { text: t(descriptionKey) })
      );

      if (missingContracts.length) {
        content.append(createElement("h3", { text: t("missingContracts") }));

        const list = createElement("ul", { className: "contract-list" });

        for (const contract of missingContracts) {
          const item = createElement("li");
          item.append(createElement("code", { text: contract }));
          list.append(item);
        }

        content.append(list);
      }

      const retryButton = createElement("button", {
        className: "button button-primary",
        text: t("retry"),
        attributes: { type: "button" }
      });

      retryButton.addEventListener("click", initializeApplication);
      content.append(retryButton);
      elements.pageState.append(content);
    }

    function initSupabase() {
      const config = window.YAJIB_CONFIG || {};
      const url = config.supabaseUrl;
      const publishableKey =
        config.supabasePublishableKey ||
        config.supabaseAnonKey;

      if (!url || !publishableKey) return null;

      return createClient(url, publishableKey, {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        },
        global: {
          headers: {
            "X-YAJIB-Client": "student-examination-page"
          }
        }
      });
    }

    async function getRequiredSession() {
      const {
        data: { session },
        error
      } = await state.supabase.auth.getSession();

      if (error) throw error;

      if (!session?.user?.id) {
        const sessionError = new Error("SESSION_REQUIRED");
        sessionError.code = "SESSION_REQUIRED";
        throw sessionError;
      }

      return session;
    }

    async function loadAuthorizedRoleAssignments() {
      const { data, error } = await state.supabase
        .from("my_role_assignments")
        .select("id,role_code,institution_id,is_active,valid_from,valid_until")
        .eq("role_code", "student")
        .eq("is_active", true)
        .limit(5);

      if (error) throw error;

      const now = Date.now();

      const assignment = (data || []).find((record) => {
        const starts = record.valid_from
          ? new Date(record.valid_from).getTime()
          : Number.NEGATIVE_INFINITY;

        const ends = record.valid_until
          ? new Date(record.valid_until).getTime()
          : Number.POSITIVE_INFINITY;

        return starts <= now && ends >= now;
      });

      if (!assignment) {
        const roleError = new Error("ROLE_FORBIDDEN");
        roleError.code = "ROLE_FORBIDDEN";
        throw roleError;
      }

      return assignment;
    }

    function guardCurrentRole(assignment) {
      if (
        !assignment ||
        assignment.role_code !== "student" ||
        assignment.is_active !== true
      ) {
        const error = new Error("ROLE_FORBIDDEN");
        error.code = "ROLE_FORBIDDEN";
        throw error;
      }
    }

    async function loadActiveInstitutionContext() {
      const { data, error } = await state.supabase
        .from("my_active_institution_context")
        .select("assignment_id,institution_id,institution_name,faculty_name,department_name,programme_name,level_name,session_name,semester_name,timezone")
        .eq("assignment_id", state.roleAssignment.id)
        .eq("institution_id", state.roleAssignment.institution_id)
        .single();

      if (error) throw error;

      if (!data?.institution_id) {
        const contextError = new Error("ROLE_FORBIDDEN");
        contextError.code = "ROLE_FORBIDDEN";
        throw contextError;
      }

      return data;
    }

    async function loadExamGallery() {
      if (state.examAbortController) {
        state.examAbortController.abort();
      }

      state.examAbortController = new AbortController();
      renderExamLoading();

      if (state.preview) {
        let items = [...state.exams];
        const search = normalizeSearch(state.examSearch);

        if (search) {
          items = items.filter((exam) => {
            const searchable = normalizeSearch([
              exam.course_code,
              localized(exam),
              exam.exam_type_code,
              modeLabel(exam.exam_mode)
            ].join(" "));

            return searchable.includes(search);
          });
        }

        if (state.examStatus !== "all") {
          items = items.filter((exam) => exam.status === state.examStatus);
        }

        if (state.examMode !== "all") {
          items = items.filter((exam) => exam.exam_mode === state.examMode);
        }

        items.sort((a, b) => {
          if (state.examSort === "latest") {
            return new Date(b.scheduled_start_at) - new Date(a.scheduled_start_at);
          }

          if (state.examSort === "course") {
            return String(a.course_code).localeCompare(String(b.course_code), locale(), {
              sensitivity: "base"
            });
          }

          return new Date(a.scheduled_start_at) - new Date(b.scheduled_start_at);
        });

        state.examTotal = items.length;

        const start = (state.examPage - 1) * state.examPageSize;
        state.exams = items.slice(start, start + state.examPageSize);
        return;
      }

      const from = (state.examPage - 1) * state.examPageSize;
      const to = from + state.examPageSize - 1;

      let query = state.supabase
        .from("my_exam_eligibility")
        .select(
          "id,course_code,title_en,title_ar,title_fr,exam_type_code,exam_mode,scheduled_start_at,scheduled_end_at,venue_display_name,timezone,eligibility_status,attempt_status,status_code,duration_minutes",
          { count: "exact" }
        )
        .range(from, to);

      if (state.examSearch) {
        const sanitized = state.examSearch
          .normalize("NFKC")
          .replaceAll(/[,%()]/gu, " ")
          .trim()
          .slice(0, 100);

        if (sanitized) {
          query = query.or(
            `course_code.ilike.%${sanitized}%,title_en.ilike.%${sanitized}%,title_ar.ilike.%${sanitized}%,title_fr.ilike.%${sanitized}%`
          );
        }
      }

      if (state.examStatus !== "all") {
        query = query.eq("status_code", state.examStatus);
      }

      if (state.examMode !== "all") {
        query = query.eq("exam_mode", state.examMode);
      }

      query = query.order(
        state.examSort === "course" ? "course_code" : "scheduled_start_at",
        { ascending: state.examSort !== "latest" }
      );

      const { data, error, count } = await query;

      if (error) throw error;

      state.exams = (data || []).map((exam) => ({
        ...exam,
        status: exam.status_code || "upcoming",
        mediaVariant: exam.exam_mode === "cbt" ? "gold" : "silver"
      }));

      state.examTotal = count || 0;
    }

        option.selected = value === selectedValue;

    function renderExamCard(exam) {
      const listItem = document.createElement("li");
      const card = createElement("article", { className: "exam-card" });

      const media = createElement("div", {
        className: "exam-media",
        attributes: {
          "data-variant": exam.mediaVariant || "silver",
          role: "img",
          "aria-label": `${exam.course_code} ${localized(exam)}`
        }
      });

      media.append(
        createElement("span", {
          className: "exam-symbol",
          text: exam.exam_mode === "cbt" ? "⌨" :
            exam.exam_mode === "oral" ? "◇" :
              exam.exam_mode === "practical" ? "⚙" : "✎",
          attributes: { "aria-hidden": "true" }
        }),
        createElement("span", {
          className: `exam-status ${statusClass(exam.status)}`,
          text: t(statusKey(exam.status))
        })
      );

      const body = createElement("div", { className: "exam-body" });

      body.append(
        createElement("h3", {
          text: `${exam.course_code} · ${localized(exam)}`
        }),
        createElement("p", {
          text: [
            modeLabel(exam.exam_mode),
            formatDate(exam.scheduled_start_at, {
              dateStyle: "medium",
              timeStyle: "short"
            })
          ].join(" · ")
        })
      );

      const metadata = createElement("div", { className: "metadata-grid" });

      metadata.append(
        metadataItem("venue", exam.venue_display_name || t("unavailable")),
        metadataItem(
          "duration",
          t("minutes", {
            count: formatNumber(exam.duration_minutes)
          })
        ),
        metadataItem(
          "eligibility",
          t(statusKey(exam.eligibility_status))
        ),
        metadataItem(
          "attemptStatus",
          exam.attempt_status === "submitted"
            ? t("statusSubmitted")
            : t("statusPending")
        )
      );

      const actions = createElement("div", { className: "card-actions" });

      const detailButton = createElement("button", {
        className: "button",
        text: t("viewDetails"),
        attributes: {
          type: "button",
          "aria-label": `${t("viewDetails")}: ${exam.course_code} ${localized(exam)}`
        }
      });

      detailButton.addEventListener("click", () => openExamDialog(exam.id));

      const primaryButton = createElement("button", {
        className: "button button-primary",
        text: exam.attempt_status === "submitted"
          ? t("viewReceipt")
          : t("startExam"),
        attributes: {
          type: "button",
          "aria-label": `${exam.attempt_status === "submitted" ? t("viewReceipt") : t("startExam")}: ${exam.course_code} ${localized(exam)}`
        }
      });

      if (exam.attempt_status === "submitted") {
        primaryButton.addEventListener("click", () => {
          const receipt = state.receipts.find(
            (item) => item.course_code === exam.course_code
          );

          if (receipt) {
            navigateTo("receipts");
          } else {
            toast("downloadUnavailable", "warning");
          }
        });
      } else {
        primaryButton.disabled =
          exam.eligibility_status !== "eligible" ||
          exam.status === "completed";

        primaryButton.addEventListener("click", () => startExam(exam));
      }

      actions.append(detailButton, primaryButton);
      body.append(metadata, actions);
      card.append(media, body);
      listItem.append(card);

      return listItem;
    }

      const item = createElement("div", { className: "metadata" });

      state.currentExamId = examId;

      elements.readinessDialogSubtitle.textContent =

      try {

        const { data, error } = await state.supabase.rpc(
          "check_student_exam_readiness",

    function openDialog(dialog) {
      state.lastFocusedElement = document.activeElement;
      dialog.showModal();

      queueMicrotask(() => {
        getFocusable(dialog)[0]?.focus();
      });
    }

    function closeDialog(dialog) {
      if (dialog.open) dialog.close();
      state.lastFocusedElement?.focus?.();
    }

    function getFocusable(container) {
      return Array.from(container.querySelectorAll(
        'button:not([disabled]),a[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])'
      )).filter((node) => !node.hidden);
    }

    function trapFocus(event, container) {
      if (event.key !== "Tab") return;

      const focusable = getFocusable(container);
      if (!focusable.length) return;

      const first = focusable[0];
      const last = focusable[focusable.length - 1];

      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    }

    async function startExam(exam) {
      await executeProtectedMutation(`start-exam:${exam.id}`, async () => {
        if (state.preview) {
          toast("setupRequiredAction", "warning");
          return;
        }

        requireOnline();

        const { data, error } = await state.supabase.rpc(
          "initialize_student_exam_attempt",
          {
            p_exam_eligibility_id: exam.id,
            p_idempotency_key: crypto.randomUUID()
          }
        );

        if (error) throw error;

        if (
          !data?.eligible ||
          !data?.server_start_authorized ||
          !data?.attempt_reference
        ) {
          const authorizationError = new Error("EXAM_NOT_AUTHORIZED");
          authorizationError.code = "EXAM_NOT_AUTHORIZED";
          throw authorizationError;
        }

        const examUrl = new URL("exam-session.html", location.href);
        examUrl.searchParams.set("attempt", data.attempt_reference);
        location.assign(examUrl);
      });
    }

    async function requestReceipt(receipt) {
      await executeProtectedMutation(`receipt:${receipt.id}`, async () => {
        if (state.preview) {
          toast("setupRequiredAction", "warning");
          return;
        }

        requireOnline();

        const { data, error } = await state.supabase.rpc(
          "request_exam_receipt_access",
          {
            p_receipt_id: receipt.id
          }
        );

        if (error) throw error;

        if (!data?.authorized || !data?.signed_url || !data?.expires_at) {
          throw new Error("RECEIPT_NOT_CONFIRMED");
        }

        if (new Date(data.expires_at).getTime() <= Date.now()) {
          throw new Error("RECEIPT_EXPIRED");
        }

        location.assign(data.signed_url);
      });
    }

    async function requestResultsExport() {
      await executeProtectedMutation("result-export", async () => {
        if (state.preview) {
          toast("setupRequiredAction", "warning");
          return;
        }

        requireOnline();

        const { data, error } = await state.supabase.rpc(
          "request_my_results_export",
          {

            p_semester_name: state.resultSummary?.semester_name || null,
