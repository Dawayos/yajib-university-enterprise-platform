    async function submitResultEnquiry(event) {
      event.preventDefault();

      const courseId = elements.enquiryCourse.value;
      const enquiryType = elements.enquiryType.value;
      const message = elements.enquiryMessage.value.normalize("NFKC").trim();

      if (!courseId || !enquiryType || message.length < 10) {
        elements.enquiryError.textContent = t("enquiryRequired");
        elements.enquiryError.hidden = false;
        return;
      }

      elements.enquiryError.hidden = true;

      await executeProtectedMutation(
        `result-enquiry:${courseId}:${enquiryType}`,
        async () => {
          if (state.preview) {
            toast("setupRequiredAction", "warning");
            return;
          }

          requireOnline();
          elements.submitEnquiry.disabled = true;

          try {
            const { data, error } = await state.supabase.rpc(
              "create_student_result_enquiry",
              {
                p_published_result_id: courseId,
                p_enquiry_type: enquiryType,
                p_message: message,
                p_idempotency_key: crypto.randomUUID()
              }
            );

            if (error) throw error;

            if (!data?.accepted || !data?.enquiry_reference) {
              throw new Error("ENQUIRY_NOT_CONFIRMED");
            }

            closeDialog(elements.enquiryDialog);
            toast("requestAccepted", "success");
          } finally {
            elements.submitEnquiry.disabled = false;
          }
        }
      );
    }

    async function executeProtectedMutation(key, operation) {
      if (state.pendingMutations.has(key)) {
        toast("duplicatePrevented", "warning");
        return;
      }

      state.pendingMutations.add(key);

      try {
        await operation();
      } catch (error) {
        handleOperationError(error);
      } finally {
        state.pendingMutations.delete(key);
      }
    }

    function requireOnline() {
      if (!navigator.onLine) {
        const error = new Error("OFFLINE");
        error.code = "OFFLINE";
        throw error;
      }
    }

    function handleOperationError(error) {
      if (error?.code === "OFFLINE" || error?.message === "OFFLINE") {
        toast("actionUnavailableOffline", "error");
        return;
      }

      if (
        error?.code === "EXAM_NOT_AUTHORIZED" ||
        error?.message === "EXAM_NOT_AUTHORIZED"
      ) {
        toast("examNotAuthorized", "error");
        return;
      }

      toast("requestFailed", "error");
    }

    function toast(messageKey, kind = "info", duration = 5500) {
      const id = crypto.randomUUID();

      state.activeToasts.set(id, {
        messageKey,
        kind
      });

      renderToast(id);

      setTimeout(() => {
        dismissToast(id);
      }, duration);
    }

    function renderToast(id) {
      const record = state.activeToasts.get(id);
      if (!record) return;

      document.getElementById(`toast-${id}`)?.remove();

      const node = createElement("div", {
        className: "toast",
        attributes: {
          id: `toast-${id}`,
          "data-kind": record.kind,
          role: record.kind === "error" ? "alert" : "status"
        }
      });

      node.append(
        createElement("span", {
          text: record.kind === "success"
            ? "✓"
            : record.kind === "warning"
              ? "⚠"
              : record.kind === "error"
                ? "!"
                : "i",
          attributes: { "aria-hidden": "true" }
        }),
        createElement("p", {
          text: t(record.messageKey)
        })
      );

      const closeButton = createElement("button", {
        text: "×",
        attributes: {
          type: "button",
          "aria-label": t("dismissMessage")
        }
      });

      closeButton.addEventListener("click", () => dismissToast(id));
      node.append(closeButton);
      elements.toastStack.append(node);
    }

    function renderActiveToasts() {
      for (const id of state.activeToasts.keys()) {
        renderToast(id);
      }
    }

    function dismissToast(id) {
      state.activeToasts.delete(id);
      document.getElementById(`toast-${id}`)?.remove();
    }

    function navigateTo(targetId) {
      const target = document.getElementById(targetId);
      if (!target) return;

      document.querySelectorAll(".nav-link").forEach((button) => {
        if (button.dataset.target === targetId) {
          button.setAttribute("aria-current", "page");
          document.getElementById("breadcrumb-current").textContent =
            button.textContent.trim();
        } else {
          button.removeAttribute("aria-current");
        }
      });

      target.scrollIntoView({
        block: "start",
        behavior: matchMedia("(prefers-reduced-motion: reduce)").matches
          ? "auto"
          : "smooth"
      });

      closeSidebar(false);
    }

    function openSidebar() {
      elements.sidebar.dataset.open = "true";
      elements.sidebarOverlay.hidden = false;
      elements.sidebarClose.focus();
    }

    function closeSidebar(restoreFocus = true) {
      elements.sidebar.dataset.open = "false";
      elements.sidebarOverlay.hidden = true;

      if (restoreFocus) {
        elements.menuToggle.focus();
      }
    }

    function openNotifications() {
      state.lastFocusedElement = document.activeElement;
      elements.notificationDrawer.hidden = false;
      document.getElementById("close-notifications").focus();
    }

    function closeNotifications() {
      elements.notificationDrawer.hidden = true;
      state.lastFocusedElement?.focus?.();
    }

    async function markAllNotificationsRead() {
      if (state.preview) {
        state.notifications = state.notifications.map((item) => ({
          ...item,
          status_code: "read"
        }));

        renderNotifications();
        toast("requestAccepted", "success");
        return;
      }

      await executeProtectedMutation("notifications-read", async () => {
        requireOnline();

        const { data, error } = await state.supabase.rpc(
          "mark_my_notifications_read",
          {
            p_idempotency_key: crypto.randomUUID()
          }
        );

        if (error) throw error;
        if (!data?.accepted) throw new Error("NOT_CONFIRMED");

        await refreshNotifications();
        toast("requestAccepted", "success");
      });
    }

    async function refreshNotifications() {
      if (!state.supabase || state.preview) return;

      const { data, error } = await state.supabase
        .from("my_notifications")
        .select("id,title_en,title_ar,title_fr,message_en,message_ar,message_fr,status_code,created_at")
        .order("created_at", { ascending: false })
        .limit(30);

      if (error) return;

      state.notifications = data || [];
      renderNotifications();
    }

    function subscribeRealtime() {
      if (!state.supabase || state.preview || !state.session?.user?.id) return;

      unsubscribeRealtime();

      const channel = state.supabase
        .channel(`student-exam-notifications:${state.session.user.id}`)
        .on(
          "postgres_changes",
          {
            event: "*",
            schema: "public",
            table: "student_notification_events",
            filter: `recipient_user_id=eq.${state.session.user.id}`
          },
          refreshNotifications
        )
        .subscribe();

      state.realtimeChannels.push(channel);
    }

    function unsubscribeRealtime() {
      if (!state.supabase) return;

      for (const channel of state.realtimeChannels) {
        state.supabase.removeChannel(channel);
      }

      state.realtimeChannels = [];
    }

    function debounce(callback, delay = 280) {
      let timeout;

      return (...argumentsList) => {
        clearTimeout(timeout);
        timeout = setTimeout(() => callback(...argumentsList), delay);
      };
    }

    async function safeReloadExams() {
      try {
        await loadExamGallery();
        renderExamGallery();
        renderKpis();
      } catch {
        elements.examState.replaceChildren();

        const panel = createElement("div", { className: "state-panel" });
        const content = createElement("div", { className: "state-content" });

        const retryButton = createElement("button", {
          className: "button button-primary",
          text: t("retry"),
          attributes: { type: "button" }
        });

        retryButton.addEventListener("click", safeReloadExams);

        content.append(
          createElement("div", {
            className: "state-icon",
            text: "!",
            attributes: { "aria-hidden": "true" }
          }),
          createElement("h2", { text: t("examLoadError") }),
          retryButton
        );

        panel.append(content);
        elements.examState.append(panel);
      }
    }

    async function signOut() {
      if (!state.supabase) {
        toast("setupRequiredAction", "warning");
        return;
      }

      const { error } = await state.supabase.auth.signOut({ scope: "local" });

      if (error) {
        handleOperationError(error);
        return;
      }

      location.reload();
    }

    function handleConnectivity() {
      elements.offlineBanner.hidden = navigator.onLine;
      setConnection(navigator.onLine ? "online" : "offline");
    }

    function normalizeInitializationError(error) {
      const message = String(error?.message || "");
      const code = String(error?.code || "");

      if (
        code === "SESSION_REQUIRED" ||
        message.includes("SESSION_REQUIRED") ||
        message.includes("JWT")
      ) {
        return "expired";
      }

      if (
        code === "ROLE_FORBIDDEN" ||
        message.includes("ROLE_FORBIDDEN") ||
        message.includes("permission denied")
      ) {
        return "forbidden";
      }

      if (
        error?.status === 429 ||
        code === "429"
      ) {
        return "rate";
      }

      if (
        code === "42P01" ||
        code === "PGRST205" ||
        message.includes("does not exist") ||
        message.includes("schema cache")
      ) {
        return "setup";
      }

      return "unavailable";
    }

    async function initializeApplication() {
      showLoading();
      setConnection("connecting");

      try {
        if (state.preview) {
          elements.previewBadge.hidden = false;
          loadPreviewData();
          showWorkspace();
          renderAll();
          setConnection(navigator.onLine ? "online" : "offline");
          return;
        }

        state.supabase = initSupabase();

        if (!state.supabase) {
          showError("setup", [
            "window.YAJIB_CONFIG.supabaseUrl",
            "window.YAJIB_CONFIG.supabasePublishableKey"
          ]);
          setConnection("error");
          return;
        }

        state.session = await getRequiredSession();
        state.roleAssignment = await loadAuthorizedRoleAssignments();
        guardCurrentRole(state.roleAssignment);
        state.institutionContext = await loadActiveInstitutionContext();

        await loadProductionData();
        subscribeRealtime();

        showWorkspace();
        renderAll();
        setConnection(navigator.onLine ? "online" : "offline");
      } catch (error) {
        if (isDevelopment()) {
          console.error(error);
        } else {
          console.error("YAJIB student examination workspace initialization failed.");
        }

        const type = normalizeInitializationError(error);
        showError(type, type === "setup" ? requiredContracts : []);
        setConnection("error");
      }
    }

    function attachEvents() {
      elements.menuToggle.addEventListener("click", openSidebar);
      elements.sidebarClose.addEventListener("click", () => closeSidebar());
      elements.sidebarOverlay.addEventListener("click", () => closeSidebar());

      document.querySelectorAll(".nav-link[data-target]").forEach((button) => {
        button.addEventListener("click", () => navigateTo(button.dataset.target));
      });

      elements.languageSelect.addEventListener("change", (event) => {
        setLanguage(event.target.value);
      });

      elements.themeToggle.addEventListener("click", () => {
        setTheme(state.theme === "dark" ? "light" : "dark");
      });

      elements.profileButton.addEventListener("click", () => {
        const opening = elements.profileMenu.hidden;
        elements.profileMenu.hidden = !opening;
        elements.profileButton.setAttribute(
          "aria-expanded",
          opening ? "true" : "false"
        );
      });

      document.addEventListener("click", (event) => {
        if (
          !elements.profileMenu.hidden &&
          !elements.profileMenu.contains(event.target) &&
          !elements.profileButton.contains(event.target)
        ) {
          elements.profileMenu.hidden = true;
          elements.profileButton.setAttribute("aria-expanded", "false");
        }
      });

      document.getElementById("view-profile").addEventListener("click", () => {
        renderProfileDialog();
        openDialog(elements.profileDialog);
      });

      document.getElementById("print-dashboard").addEventListener("click", () => {
        window.print();
      });

      document.getElementById("sign-out").addEventListener("click", signOut);

      document.getElementById("hero-take-exam").addEventListener("click", () => {
        navigateTo("examinations");
      });

      document.getElementById("hero-readiness").addEventListener("click", () => {
        navigateTo("readiness");
      });

      document.getElementById("hero-results").addEventListener("click", () => {
        navigateTo("results");
      });

      document.getElementById("refresh-exams").addEventListener("click", safeReloadExams);

      elements.examGridButton.addEventListener("click", () => {
        state.examView = "grid";
        localStorage.setItem("yajib.student.examView", "grid");
        renderExamFilters();
        renderExamGallery();
      });

      elements.examListButton.addEventListener("click", () => {
        state.examView = "list";
        localStorage.setItem("yajib.student.examView", "list");
        renderExamFilters();
        renderExamGallery();
      });

      elements.examStatusFilter.addEventListener("change", async (event) => {
        state.examStatus = event.target.value;
        state.examPage = 1;
        await safeReloadExams();
      });

      elements.examModeFilter.addEventListener("change", async (event) => {
        state.examMode = event.target.value;
        state.examPage = 1;
        await safeReloadExams();
      });

      elements.examSort.addEventListener("change", async (event) => {
        state.examSort = event.target.value;
        state.examPage = 1;
        await safeReloadExams();
      });

      elements.examSearch.addEventListener("input", debounce(async (event) => {
        state.examSearch = event.target.value.slice(0, 100);
        state.examPage = 1;
        await safeReloadExams();
      }));

      document.getElementById("clear-exam-filters").addEventListener("click", async () => {
        state.examSearch = "";
        state.examStatus = "all";
        state.examMode = "all";
        state.examSort = "soonest";
        state.examPage = 1;
        elements.examSearch.value = "";
        renderExamFilters();
        await safeReloadExams();
      });

      elements.examPrevious.addEventListener("click", async () => {
        if (state.examPage > 1) {
          state.examPage -= 1;
          await safeReloadExams();
        }
      });

      elements.examNext.addEventListener("click", async () => {
        const pages = Math.max(1, Math.ceil(state.examTotal / state.examPageSize));

        if (state.examPage < pages) {
          state.examPage += 1;
          await safeReloadExams();
        }
      });

      document.getElementById("global-search").addEventListener(
        "input",
        debounce((event) => {
          elements.examSearch.value = event.target.value.slice(0, 100);
          elements.examSearch.dispatchEvent(new Event("input"));
          navigateTo("examinations");
        }, 320)
      );

      elements.notificationButton.addEventListener("click", openNotifications);
      document.getElementById("open-notification-section-drawer")
        .addEventListener("click", openNotifications);

      document.getElementById("close-notifications")
        .addEventListener("click", closeNotifications);

      document.getElementById("mark-all-read")
        .addEventListener("click", markAllNotificationsRead);

      elements.notificationDrawer.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closeNotifications();
        } else {
          trapFocus(event, elements.notificationDrawer);
        }
      });

      elements.dialogReadiness.addEventListener("click", () => {
        if (state.currentExamId) {
          closeDialog(elements.examDialog);
          openReadinessDialog(state.currentExamId);
        }
      });

      elements.dialogStartExam.addEventListener("click", () => {
        const exam = state.exams.find((item) => item.id === state.currentExamId);
        if (exam) startExam(exam);
      });

      elements.readinessStartExam.addEventListener("click", () => {
        const exam = state.exams.find((item) => item.id === state.currentExamId);
        if (exam) startExam(exam);
      });

      document.getElementById("print-timetable").addEventListener("click", () => {
        window.print();
      });

      document.getElementById("print-results").addEventListener("click", () => {
        window.print();
      });

      document.getElementById("request-results-csv")
        .addEventListener("click", requestResultsExport);

      document.getElementById("profile-print").addEventListener("click", () => {
        window.print();
      });

      document.getElementById("new-enquiry")
        .addEventListener("click", prepareEnquiryDialog);

      elements.enquiryForm.addEventListener("submit", submitResultEnquiry);

      document.querySelectorAll("[data-close-dialog]").forEach((button) => {
        button.addEventListener("click", () => {
          closeDialog(document.getElementById(button.dataset.closeDialog));
        });
      });

      [
        elements.examDialog,
        elements.readinessDialog,
        elements.profileDialog,
        elements.enquiryDialog
      ].forEach((dialog) => {
        dialog.addEventListener("keydown", (event) => trapFocus(event, dialog));

        dialog.addEventListener("click", (event) => {
          const rectangle = dialog.getBoundingClientRect();

          const outside =
            event.clientX < rectangle.left ||
            event.clientX > rectangle.right ||
            event.clientY < rectangle.top ||
            event.clientY > rectangle.bottom;

          if (outside) closeDialog(dialog);
        });
      });

      window.addEventListener("online", handleConnectivity);
      window.addEventListener("offline", handleConnectivity);
      window.addEventListener("beforeunload", unsubscribeRealtime);

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") {
          unsubscribeRealtime();
        } else if (!state.preview && state.session) {
          subscribeRealtime();
        }
      });
    }

    function bootstrap() {
      verifyDictionaryParity();
      setTheme(state.theme);
      setLanguage(state.language);
      attachEvents();
      handleConnectivity();
      initializeApplication();
    }

    bootstrap();
  </script>
</body>
</html>
