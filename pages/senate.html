    function canDecideResult(batch) {
      return (
        batch.departmentDecision === "department_approved" &&
        batch.facultyDecision === "faculty_approved" &&
        batch.committeeRecommendation === "committee_recommended" &&
        ["committee_recommended", "senate_pending"].includes(batch.status)
      );
    }

    function openResultDecision(batch, decision) {
      if (!canDecideResult(batch)) {
        showToast(
          t("validationFailed"),
          t("resultNotReady"),
          "danger"
        );
        return;
      }

      openModal({
        title: () =>
          decision === "senate_approved"
            ? t("approveFinalResult")
            : decision === "senate_rejected"
              ? t("rejectFinalResult")
              : t("returnFinalResult"),

        submitLabel: () =>
          decision === "senate_approved"
            ? t("approveFinalResult")
            : decision === "senate_rejected"
              ? t("rejectFinalResult")
              : t("returnFinalResult"),

        build: () => {
          const course = courseById(batch.courseId);
          const committee = examCommitteeById(batch.committeeId);

          return createElement("div", {
            className: "form-grid",
            children: [
              createElement("section", {
                className: "decision-panel full",
                children: [
                  createElement("strong", {
                    text:
                      `${batch.reference} · ` +
                      `${course?.code || "—"} · ` +
                      `${localized(course?.title)}`
                  }),
                  createElement("p", {
                    text:
                      `${t("committee")}: ` +
                      `${localized(committee?.title)}`
                  }),
                  createElement("p", {
                    text:
                      `${t("candidateCount")}: ${batch.candidateCount} · ` +
                      `${t("passed")}: ${batch.passed} · ` +
                      `${t("failed")}: ${batch.failed} · ` +
                      `${t("withheld")}: ${batch.withheld}`
                  })
                ]
              }),

              makeField(
                "minuteReference",
                inputControl(
                  "decision-minutes",
                  "text",
                  "",
                  {
                    required: true,
                    maxlength: 100
                  }
                ),
                true
              ),

              makeField(
                "decisionReason",
                textareaControl("decision-reason", ""),
                true
              )
            ]
          });
        },

        submit: () => {
          const minuteReference = valueOf("decision-minutes");
          const reason = valueOf("decision-reason");

          if (minuteReference.length < 5) {
            showModalError(t("minuteReferenceRequired"));
            return false;
          }

          if (reason.length < 10) {
            showModalError(t("decisionReasonMinimum"));
            return false;
          }

          batch.status = decision;
          batch.senateDecision = decision;
          batch.minuteReference = minuteReference;
          batch.decisionReason = reason;
          batch.decisionHistory ||= [];

          batch.decisionHistory.unshift({
            decision,
            reason,
            minuteReference,
            actor: state.data.context.name,
            createdAt: new Date().toISOString()
          });

          addAudit(
            decision,
            "final_result_batch",
            batch.id,
            `${minuteReference}: ${reason}`
          );
          addActivity(`${batch.reference} Senate result decision recorded`);
          addNotification(
            batch.reference,
            `${statusLabel(decision)} · ${minuteReference}`
          );

          persistData();
          renderNotifications();
          renderFinalResults();

          showToast(
            t("finalResults"),
            t("resultDecisionSaved"),
            "success"
          );

          return true;
        }
      });
    }

    function openVoteEditor(motion) {
      const existingVote = voteForMotion(motion.id);

      openModal({
        title: () =>
          existingVote
            ? `${t("reviseVote")} · ${motion.reference}`
            : `${t("castVote")} · ${motion.reference}`,

        submitLabel: () =>
          existingVote ? t("reviseVote") : t("castVote"),

        build: () => {
          const options = createElement("div", {
            className: "vote-options full"
          });

          [
            ["for", t("voteFor")],
            ["against", t("voteAgainst")],
            ["abstain", t("voteAbstain")]
          ].forEach(([value, label]) => {
            const input = createElement("input", {
              attrs: {
                id: `vote-${value}`,
                name: "senate-vote",
                type: "radio",
                value
              }
            });

            input.checked = existingVote?.choice === value;

            options.append(
              createElement("label", {
                className: "vote-option",
                attrs: {
                  for: input.id
                },
                children: [
                  input,
                  createElement("strong", {
                    text: label
                  })
                ]
              })
            );
          });

          return createElement("div", {
            className: "form-grid",
            children: [
              createElement("div", {
                className: "decision-panel full",
                children: [
                  createElement("strong", {
                    text:
                      `${motion.reference} · ` +
                      `${localized(motion.title)}`
                  })
                ]
              }),
              options,
              makeField(
                "voteReason",
                textareaControl(
                  "vote-reason",
                  existingVote?.reason || ""
                ),
                true
              )
            ]
          });
        },

        submit: () => {
          const selected =
            $('input[name="senate-vote"]:checked', $("#modal-body"))
              ?.value || "";

          const reason = valueOf("vote-reason");

          if (!["for", "against", "abstain"].includes(selected)) {
            showModalError(t("voteRequired"));
            return false;
          }

          const record = {
            id: existingVote?.id || uid("vote"),
            motionId: motion.id,
            memberId: state.data.context.id,
            choice: selected,
            reason,
            castAt: new Date().toISOString()
          };

          upsertRecord("votes", record);
          addAudit(
            existingVote ? "revise_vote" : "cast_vote",
            "senate_motion",
            motion.id,
            `${selected}: ${reason}`
          );
          addActivity(`${motion.reference} Senate vote recorded`);
          persistData();

          showToast(t("voting"), t("voteSaved"), "success");

          if (state.route === "motions") {
            renderMotions();
          } else {
            renderVoting();
          }

          return true;
        }
      });
    }

          ? state.modal.title()
          : state.modal.title;

      $("#modal-submit").textContent =
        typeof state.modal.submitLabel === "function"
          ? state.modal.submitLabel()
          : state.modal.submitLabel || t("save");

    function renderNotifications() {
      const container = $("#notification-list");

      const unread = state.data.notifications.filter(
        notification => !notification.readAt
      ).length;

      container.replaceChildren();

      $("#notification-count").textContent = formatNumber(unread);
      $("#notification-count").hidden = unread === 0;

      $("#notification-toggle").setAttribute(
        "aria-label",
        `${t("notifications")}: ${formatNumber(unread)}`
      );

      if (!state.data.notifications.length) {
        container.append(
          emptyState(t("noNotifications"), t("noData"), "♢")
        );
        return;
      }

      container.append(
        makeButton(
          t("markAllRead"),
          () => {
            const timestamp = new Date().toISOString();

            state.data.notifications.forEach(notification => {
              notification.readAt ||= timestamp;
            });

            persistData();
            renderNotifications();
          },
          "btn secondary"
        )
      );

      const list = createElement("ul", {
        className: "list",
        attrs: {
          style: "margin-top:.75rem"
        }
      });

      state.data.notifications.forEach(notification => {
        const actions = createElement("div", {
          className: "inline",
          attrs: {
            style: "margin-top:.55rem"
          }
        });

        if (!notification.readAt) {
          actions.append(
            makeButton(
              t("markRead"),
              () => {
                notification.readAt = new Date().toISOString();
                persistData();
                renderNotifications();
              },
              "btn secondary small"
            )
          );
        }

        actions.append(
          makeButton(
            t("remove"),
            () => {
              state.data.notifications =
                state.data.notifications.filter(
                  item => item.id !== notification.id
                );

              persistData();
              renderNotifications();

              showToast(
                t("notifications"),
                t("sampleDeleted"),
                "success"
              );
            },
            "btn danger small"
          )
        );

        list.append(
          createElement("li", {
            className: "list-item",
            children: [
              createElement("strong", {
                text: localized(notification.title)
              }),
              createElement("span", {
                text: localized(notification.body)
              }),
              createElement("time", {
                text: formatDateTime(notification.createdAt),
                attrs: {
                  datetime: notification.createdAt
                }
              }),
              actions
            ]
          })
        );
      });

      container.append(list);
    }

    function performGlobalSearch(query) {
      const search =
        normalize(query).toLocaleLowerCase(LOCALES[state.language]);

      const container = $("#search-results");

      if (search.length < 2) {
        closeSearch();
        return;
      }

      const results = [];

      function addResult(route, title, subtitle = "", courseId = "") {
        results.push({
          route,
          title,
          subtitle,
          courseId
        });
      }

      state.data.faculties.forEach(faculty => {
        if (
          [faculty.code, faculty.name, faculty.dean]
            .join(" ")
            .toLocaleLowerCase(LOCALES[state.language])
            .includes(search)
        ) {
          addResult(
            "faculties",
            `${faculty.code} · ${faculty.name}`,
            faculty.dean
          );
        }
      });

      state.data.departments.forEach(department => {
        if (
          [
            department.code,
            department.name,
            department.head,
            facultyById(department.facultyId)?.name
          ]
            .join(" ")
            .toLocaleLowerCase(LOCALES[state.language])
            .includes(search)
        ) {
          addResult(
            "departments",
            `${department.code} · ${department.name}`,
            facultyById(department.facultyId)?.name || ""
          );
        }
      });

      state.data.courses.forEach(course => {
        if (
          [
            course.code,
            localized(course.title),
            course.programme,
            course.level
          ]
            .join(" ")
            .toLocaleLowerCase(LOCALES[state.language])
            .includes(search)
        ) {
          addResult(
            "catalogue",
            `${course.code} · ${localized(course.title)}`,
            `${course.programme} · ${course.level}`,
            course.id
          );
        }
      });

      state.data.examinations.forEach(examination => {
        const course = courseById(examination.courseId);

        if (
          [
            course?.code,
            localized(course?.title),
            examination.type,
            examination.venue,
            localized(examCommitteeById(examination.committeeId)?.title)
          ]
            .join(" ")
            .toLocaleLowerCase(LOCALES[state.language])
            .includes(search)
        ) {
          addResult(
            "examinations",
            `${course?.code || "—"} · ${examination.type}`,
            formatDateTime(examination.dateTime),
            examination.courseId
          );
        }
      });

      state.data.resultBatches.forEach(batch => {
        const course = courseById(batch.courseId);

        if (
          [
            batch.reference,
            course?.code,
            localized(course?.title),
            localized(examCommitteeById(batch.committeeId)?.title),
            batch.status
          ]
            .join(" ")
            .toLocaleLowerCase(LOCALES[state.language])
            .includes(search)
        ) {
          addResult(
            "results",
            `${batch.reference} · ${course?.code || "—"}`,
            statusLabel(batch.status),
            batch.courseId
          );
        }
      });

      state.data.meetings.forEach(meeting => {
        if (
          [
            meeting.reference,
            localized(meeting.title),
            meeting.venue
          ]
            .join(" ")
            .toLocaleLowerCase(LOCALES[state.language])
            .includes(search)
        ) {
          addResult(
            "meetings",
            `${meeting.reference} · ${localized(meeting.title)}`,
            formatDateTime(meeting.dateTime)
          );
        }
      });

      state.data.examCommittees.forEach(committee => {
        if (
          [
            committee.code,
            localized(committee.title),
            committee.chair
          ]
            .join(" ")
            .toLocaleLowerCase(LOCALES[state.language])
            .includes(search)
        ) {
          addResult(
            "examCommittees",
            `${committee.code} · ${localized(committee.title)}`,
            committee.chair
          );
        }
      });

      state.data.motions.forEach(motion => {
        if (
          [
            motion.reference,
            localized(motion.title),
            motion.proposer
          ]
            .join(" ")
            .toLocaleLowerCase(LOCALES[state.language])
            .includes(search)
        ) {
          const proposal = proposalById(motion.proposalId);

          addResult(
            "motions",
            `${motion.reference} · ${localized(motion.title)}`,
            motion.proposer,
            proposal?.courseId || ""
          );
        }
      });

      container.replaceChildren();

      results.slice(0, 16).forEach(result => {
        container.append(
          createElement("button", {
            attrs: {
              type: "button"
            },
            children: [
              createElement("strong", {
                text: result.title
              }),
              createElement("small", {
                text: result.subtitle
              })
            ],
            events: {
              click: () => {
                if (
                  result.courseId &&
                  state.data.courses.some(
                    course => course.id === result.courseId
                  )
                ) {
                  state.courseScopeId = result.courseId;
                  persistCourseScope();
                  renderCourseScope();
                }

                closeSearch();
                $("#global-search-input").value = "";
                navigate(result.route);
              }
            }
          })
        );
      });

      if (!results.length) {
        container.append(
          createElement("div", {
            className: "list-item",
            text: t("noMatches")
          })
        );
      }

      container.hidden = false;
    }

    function resetSampleData() {
      if (!confirm(t("resetConfirm"))) {
        return;
      }

      state.data = createInitialData();
      state.courseScopeId = "";

      for (const [route, filter] of Object.entries(state.filters)) {
        state.filters[route] = createFilter(filter.pageSize);
      }

      persistData();
      persistFilters();
      persistCourseScope();

      renderIdentity();
      renderCourseScope();
      renderNotifications();
      renderRoute();

      showToast(t("resetSample"), t("resetComplete"), "success");
    }

    function bindEvents() {
      $("#sidebar-toggle").addEventListener("click", () => {
        if ($("#sidebar").dataset.open === "true") {
          closeSidebar();
        } else {
          openSidebar();
        }
      });

      $("#sidebar-backdrop").addEventListener("click", closeSidebar);

      $("#notification-toggle").addEventListener(
        "click",
        openNotifications
      );

      $("#notification-close").addEventListener(
        "click",
        closeNotifications
      );

      $("#notification-backdrop").addEventListener(
        "click",
        closeNotifications
      );

      $("#profile-toggle").addEventListener("click", event => {
        event.stopPropagation();
        closeNotifications();

        const menu = $("#profile-menu");
        menu.hidden = !menu.hidden;

        $("#profile-toggle").setAttribute(
          "aria-expanded",
          String(!menu.hidden)
        );
      });

      document.addEventListener("click", event => {
        if (
          !$("#profile-menu").hidden &&
          !$("#profile-menu").contains(event.target) &&
          !$("#profile-toggle").contains(event.target)
        ) {
          closeProfileMenu();
        }

        if (
          !$("#search-results").contains(event.target) &&
          !$(".global-search").contains(event.target)
        ) {
          closeSearch();
        }
      });

      $("#course-scope").addEventListener("change", event => {
        state.courseScopeId = event.target.value;

        for (const filter of Object.values(state.filters)) {
          filter.page = 1;
        }

        persistCourseScope();
        persistFilters();

        renderBreadcrumbs();
        navigate(state.route);
      });

      $$("[data-language]", $("#language-switcher")).forEach(button => {
        button.addEventListener("click", () => {
          applyLanguage(button.dataset.language);
        });
      });

      $("#theme-toggle").addEventListener("click", () => {
        applyTheme(
          state.theme === "dark"
            ? "light"
            : "dark"
        );
      });

      $("#global-search-input").addEventListener(
        "input",
        debounce(event => {
          performGlobalSearch(event.target.value);
        })
      );

      $("#modal-close").addEventListener("click", closeModal);
      $("#modal-cancel").addEventListener("click", closeModal);

      $("#modal-form").addEventListener("submit", async event => {
        event.preventDefault();

        if (!state.modal?.submit) {
          closeModal();
          return;
        }

        try {
          const shouldClose = await state.modal.submit();

          if (shouldClose !== false) {
            closeModal();
          }
        } catch (error) {
          showModalError(
            error?.message ||
            t("correctErrors")
          );
        }
      });

      $$("[data-profile-action]").forEach(button => {
        button.addEventListener("click", () => {
          closeProfileMenu();

          switch (button.dataset.profileAction) {
            case "print":
              print();
              break;

            case "help":
              navigate("help");
              break;

            case "reset":
              resetSampleData();
              break;

            case "signout":
              showToast(
                t("signOut"),
                t("signOutSample"),
                "info"
              );
              break;
          }
        });
      });

      document.addEventListener("keydown", event => {
        const target = event.target;

        const editable =
          target instanceof HTMLInputElement ||
          target instanceof HTMLTextAreaElement ||
          target instanceof HTMLSelectElement ||
          target?.isContentEditable;

        if (event.key === "/" && !editable) {
          event.preventDefault();
          $("#global-search-input").focus();
        }

        if (event.key === "Escape") {
          closeSidebar();
          closeNotifications();
          closeProfileMenu();
          closeSearch();

          if ($("#modal").open) {
            closeModal();
          }
        }
      });

      window.addEventListener("resize", () => {
        if (innerWidth > 1152) {
          closeSidebar();
        }
      });
    }

    function runSelfChecks() {
      const tests = [];

      function test(name, callback) {
        try {
          callback();

          tests.push({
            test: name,
            status: "PASS"
          });
        } catch (error) {
          tests.push({
            test: name,
            status: "FAIL",
            message: error.message
          });
        }
      }

      test("Every route has metadata", () => {
        ROUTES.forEach(([route]) => {
          if (!ROUTE_META[route]) {
            throw new Error(`Missing route metadata: ${route}`);
          }
        });
      });

      test("Every department belongs to a faculty", () => {
        state.data.departments.forEach(department => {
          if (!facultyById(department.facultyId)) {
            throw new Error(`Invalid department ${department.id}`);
          }
        });
      });

      test("Every course has valid academic parents", () => {
        state.data.courses.forEach(course => {
          const department = departmentById(course.departmentId);

          if (
            !facultyById(course.facultyId) ||
            !department ||
            department.facultyId !== course.facultyId
          ) {
            throw new Error(`Invalid course ${course.id}`);
          }
        });
      });

      test("Every examination has valid dependencies", () => {
        state.data.examinations.forEach(examination => {
          if (
            !courseById(examination.courseId) ||
            !examCommitteeById(examination.committeeId)
          ) {
            throw new Error(`Invalid examination ${examination.id}`);
          }
        });
      });

      test("Every result batch has valid totals", () => {
        state.data.resultBatches.forEach(batch => {
          if (
            batch.passed +
            batch.failed +
            batch.withheld !==
            batch.candidateCount
          ) {
            throw new Error(`Invalid result totals ${batch.reference}`);
          }
        });
      });

      test("Role remains University Senate Member", () => {
        if (state.data.context.role !== "University Senate Member") {
          throw new Error("Unexpected role scope.");
        }
      });

      console.table(tests);
    }

    function initialize() {
      state.data = migrateData(loadData());

      loadFilters();
      loadPreferences();
      parseHash();
      bindEvents();

      renderNavigation();
      renderIdentity();
      renderCourseScope();
      renderBreadcrumbs();
      renderPageMeta();
      renderNotifications();
      renderRoute();

      persistData();
      runSelfChecks();
    }

    initialize();
  </script>
</body>
</html>
