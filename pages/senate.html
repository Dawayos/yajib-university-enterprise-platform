<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#071426">
   <meta name="theme-color" content="#111827">

>
<meta name="referrer" content="strict-origin-when-cross-origin">

  <title>University Senate Member Dashboard | YAJIB University</title>

  <!--
    YAJIB UNIVERSITY SENATE MEMBER DASHBOARD
    ========================================

    This demonstration stores sample changes in localStorage.

    Production requirements:
    - Verify Senate membership and the active Senate term on the server.
    - Scope every request by institution_id.
    - Validate faculty, department, committee, examination, and result access.
    - Record result decisions and votes through audited database transactions.
    - Enforce Row Level Security.
    - Never expose service-role keys in this page.
    - Never trust browser-side result totals, quorum, voting eligibility,
      committee recommendations, or Senate decision permissions.
  -->

  <style>
    :root {
      --navy-950: #040a14;
      --navy-900: #071426;
      --navy-850: #10213b;
      --navy-800: #193352;
      --navy-700: #294d78;

      --gold: #d8b748;
      --gold-light: #f4e6a7;
      --gold-dark: #8f711f;

      --crimson: #981735;
      --crimson-light: #c3294d;
      --crimson-dark: #650d23;

      --silver: #aeb8c6;

      --bg: #f1f4f8;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --surface-strong: #e8edf4;
      --glass: rgb(255 255 255 / 90%);

      --text: #101827;
      --text-soft: #556277;
      --text-muted: #78859a;
      --border: #d8e0ea;

      --success: #087443;
      --warning: #985c00;
      --danger: #b31538;
      --info: #0869ae;
      --focus: #0769c8;

      --sidebar-width: 19rem;
      --content-width: 112rem;

      --radius-sm: .58rem;
      --radius-md: .88rem;
      --radius-lg: 1.18rem;
      --radius-xl: 1.65rem;

      --shadow-xs: 0 2px 7px rgb(15 23 42 / 7%);
      --shadow-sm: 0 9px 26px rgb(15 23 42 / 9%);
      --shadow-md: 0 20px 54px rgb(15 23 42 / 16%);
      --shadow-lg: 0 30px 90px rgb(0 0 0 / 38%);

      --transition: 180ms cubic-bezier(.2, .8, .2, 1);
    }

    html[data-theme="dark"] {
      --bg: #070b12;
      --surface: #111923;
      --surface-soft: #18222f;
      --surface-strong: #263344;
      --glass: rgb(17 25 35 / 91%);

      --text: #f6f8fb;
      --text-soft: #c1cad7;
      --text-muted: #929daf;
      --border: #303d4f;

      --success: #61dda5;
      --warning: #ffd07d;
      --danger: #ff809d;
      --info: #80c8ff;
      --focus: #8bc7ff;

      --shadow-xs: 0 2px 7px rgb(0 0 0 / 34%);
      --shadow-sm: 0 9px 26px rgb(0 0 0 / 40%);
      --shadow-md: 0 20px 54px rgb(0 0 0 / 54%);
      --shadow-lg: 0 30px 90px rgb(0 0 0 / 72%);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-width: 20rem;
      min-height: 100%;
      scroll-behavior: smooth;
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 100% 0, rgb(216 183 72 / 14%), transparent 29rem),
        radial-gradient(circle at 0 100%, rgb(152 23 53 / 8%), transparent 25rem),
        var(--bg);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        "Noto Sans Arabic",
        sans-serif;
      line-height: 1.5;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    body[data-scroll-lock="true"] {
      overflow: hidden;
    }

    button,
    input,
    select,
    textarea {
      color: inherit;
      font: inherit;
    }

    button,
    select,
    input[type="checkbox"],
    input[type="radio"] {
      cursor: pointer;
    }

    button:disabled,
    input:disabled,
    select:disabled,
    textarea:disabled {
      cursor: not-allowed;
      opacity: .55;
    }

    [hidden] {
      display: none !important;
    }

    :focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    ::selection {
      color: #171200;
      background: var(--gold-light);
    }

    .sr-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    .skip-link {
      position: fixed;
      z-index: 5000;
      inset-block-start: .7rem;
      inset-inline-start: .7rem;
      padding: .7rem 1rem;
      color: #171200;
      background: var(--gold-light);
      border: 2px solid #171200;
      border-radius: var(--radius-sm);
      font-weight: 900;
      transform: translateY(-160%);
      transition: transform var(--transition);
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    .sidebar {
      position: fixed;
      z-index: 900;
      inset-block: 0;
      inset-inline-start: 0;
      width: var(--sidebar-width);
      display: flex;
      flex-direction: column;
      overflow: auto;
      color: #fff;
      background:
        radial-gradient(circle at 15% 0, rgb(216 183 72 / 16%), transparent 17rem),
        linear-gradient(180deg, var(--navy-950), var(--navy-900) 57%, #111b2d);
      border-inline-end: 1px solid rgb(255 255 255 / 9%);
      box-shadow: 18px 0 48px rgb(3 7 18 / 14%);
      transition: transform var(--transition);
    }

    .brand {
      display: flex;
      min-height: 5rem;
      align-items: center;
      gap: .85rem;
      padding: .9rem 1rem;
      border-block-end: 1px solid rgb(255 255 255 / 10%);
    }

    .brand-mark {
      position: relative;
      display: grid;
      width: 3rem;
      height: 3rem;
      place-items: center;
      flex: 0 0 auto;
      color: #171200;
      background: linear-gradient(145deg, var(--gold-light), var(--gold));
      border-radius: .9rem;
      box-shadow:
        inset 0 -4px 0 rgb(0 0 0 / 13%),
        0 11px 30px rgb(216 183 72 / 24%);
      font-size: 1.18rem;
      font-weight: 950;
    }

    .brand-mark::after {
      position: absolute;
      width: .62rem;
      height: .62rem;
      inset-block-start: -.14rem;
      inset-inline-end: -.14rem;
      content: "";
      background: var(--crimson-light);
      border: 2px solid var(--navy-950);
      border-radius: 50%;
    }

    .brand-copy strong,
    .brand-copy span,
    .sidebar-footer strong,
    .sidebar-footer span {
      display: block;
    }

    .brand-copy strong {
      font-size: 1.06rem;
      letter-spacing: -.025em;
    }

    .brand-copy span {
      color: #bec8d8;
      font-size: .74rem;
    }

    .sidebar-label {
      padding: 1rem 1.05rem .35rem;
      color: #8491a7;
      font-size: .67rem;
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .sidebar-nav {
      display: grid;
      gap: .18rem;
      padding: .2rem .7rem .9rem;
    }

    .sidebar-nav button {
      position: relative;
      display: flex;
      width: 100%;
      min-height: 2.75rem;
      align-items: center;
      gap: .72rem;
      padding: .6rem .75rem;
      overflow: hidden;
      color: #b9c3d3;
      text-align: start;
      background: transparent;
      border: 1px solid transparent;
      border-radius: .72rem;
      transition: var(--transition);
    }

    .sidebar-nav button::before {
      position: absolute;
      width: 3px;
      inset-block: .55rem;
      inset-inline-start: 0;
      content: "";
      background: var(--gold);
      border-radius: 999px;
      opacity: 0;
      transform: scaleY(.2);
      transition: var(--transition);
    }

    .sidebar-nav button:hover {
      color: #fff;
      background: rgb(255 255 255 / 7%);
      transform: translateX(2px);
    }

    [dir="rtl"] .sidebar-nav button:hover {
      transform: translateX(-2px);
    }

    .sidebar-nav button[aria-current="page"] {
      color: #fff;
      background:
        linear-gradient(
          90deg,
          rgb(216 183 72 / 17%),
          rgb(255 255 255 / 5%)
        );
      border-color: rgb(216 183 72 / 20%);
    }

    .sidebar-nav button[aria-current="page"]::before {
      opacity: 1;
      transform: scaleY(1);
    }

    .nav-icon {
      display: grid;
      width: 1.7rem;
      height: 1.7rem;
      place-items: center;
      flex: 0 0 auto;
      color: var(--gold-light);
      background: rgb(255 255 255 / 6%);
      border-radius: .46rem;
      font-size: .9rem;
    }

    .sidebar-footer {
      margin-block-start: auto;
      padding: 1rem;
      color: #9ca8ba;
      border-block-start: 1px solid rgb(255 255 255 / 9%);
      font-size: .74rem;
    }

    .sidebar-footer strong {
      color: #e9edf4;
    }

    .workspace {
      min-height: 100vh;
      margin-inline-start: var(--sidebar-width);
    }

    .sample-banner {
      display: flex;
      min-height: 2.7rem;
      align-items: center;
      justify-content: center;
      gap: .65rem;
      padding: .55rem 1rem;
      color: #211900;
      background:
        repeating-linear-gradient(
          -45deg,
          var(--gold),
          var(--gold) 11px,
          var(--gold-light) 11px,
          var(--gold-light) 22px
        );
      border-block-end: 2px solid var(--gold-dark);
      font-size: .8rem;
      font-weight: 950;
      text-align: center;
    }

    .topbar {
      position: sticky;
      z-index: 700;
      inset-block-start: 0;
      display: grid;
      grid-template-columns: minmax(10rem, 1fr) minmax(16rem, 31rem) auto;
      align-items: center;
      gap: .8rem;
      min-height: 5rem;
      padding: .65rem clamp(.75rem, 2vw, 1.4rem);
      background: var(--glass);
      border-block-end: 1px solid var(--border);
      box-shadow: var(--shadow-xs);
      backdrop-filter: blur(18px) saturate(150%);
    }

    .topbar-start,
    .topbar-actions,
    .breadcrumbs,
    .inline,
    .status-line,
    .workflow-line {
      display: flex;
      align-items: center;
      gap: .55rem;
    }

    .topbar-start {
      min-width: 0;
    }

    .breadcrumbs {
      min-width: 0;
      flex-wrap: wrap;
      color: var(--text-soft);
      font-size: .8rem;
    }

    .breadcrumbs button {
      max-width: 15rem;
      padding: .15rem;
      overflow: hidden;
      color: inherit;
      text-overflow: ellipsis;
      white-space: nowrap;
      background: transparent;
      border: 0;
    }

    .breadcrumbs button:hover {
      color: var(--text);
      text-decoration: underline;
    }

    .global-search {
      position: relative;
      display: flex;
      align-items: center;
    }

    .global-search-symbol {
      position: absolute;
      inset-inline-start: .86rem;
      color: var(--text-muted);
      pointer-events: none;
    }

    .global-search input {
      width: 100%;
      min-height: 2.78rem;
      padding: .62rem 3rem .62rem 2.45rem;
      color: var(--text);
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 999px;
    }

    [dir="rtl"] .global-search input {
      padding: .62rem 2.45rem .62rem 3rem;
    }

    .global-search kbd {
      position: absolute;
      inset-inline-end: .75rem;
      padding: .1rem .36rem;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: .34rem;
      font-size: .66rem;
    }

    .search-results {
      position: absolute;
      z-index: 1300;
      inset-block-start: calc(100% + .45rem);
      inset-inline: 0;
      max-height: 27rem;
      overflow: auto;
      padding: .45rem;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: .82rem;
      box-shadow: var(--shadow-md);
    }

    .search-results button {
      display: grid;
      width: 100%;
      gap: .1rem;
      padding: .66rem;
      color: var(--text);
      text-align: start;
      background: transparent;
      border: 0;
      border-radius: .55rem;
    }

    .search-results button:hover {
      background: var(--surface-soft);
    }

    .search-results small {
      color: var(--text-muted);
    }

    .topbar-actions {
      justify-content: flex-end;
      min-width: 0;
    }

    .icon-button,
    .profile-button {
      display: inline-grid;
      min-width: 2.75rem;
      min-height: 2.75rem;
      place-items: center;
      padding: .46rem;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: .72rem;
      box-shadow: var(--shadow-xs);
      transition: var(--transition);
    }

    .icon-button:hover,
    .profile-button:hover {
      background: var(--surface-strong);
      border-color: var(--gold-dark);
      transform: translateY(-1px);
    }

    .profile-button {
      grid-auto-flow: column;
      gap: .45rem;
      padding-inline: .42rem .72rem;
    }

    .avatar {
      display: grid;
      width: 2.12rem;
      height: 2.12rem;
      place-items: center;
      flex: 0 0 auto;
      color: #171200;
      background: linear-gradient(145deg, var(--gold-light), var(--gold));
      border-radius: 50%;
      box-shadow: inset 0 -2px 0 rgb(0 0 0 / 12%);
      font-size: .7rem;
      font-weight: 950;
    }

    .notification-button {
      position: relative;
    }

    .notification-count {
      position: absolute;
      display: grid;
      min-width: 1.18rem;
      height: 1.18rem;
      place-items: center;
      inset-block-start: -.27rem;
      inset-inline-end: -.27rem;
      padding-inline: .2rem;
      color: #fff;
      background: var(--crimson);
      border: 2px solid var(--surface);
      border-radius: 999px;
      font-size: .58rem;
      font-weight: 950;
    }

    .compact-select {
      min-height: 2.75rem;
      width: min(18rem, 24vw);
      padding: .5rem .7rem;
      overflow: hidden;
      color: var(--text);
      text-overflow: ellipsis;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: .72rem;
      box-shadow: var(--shadow-xs);
    }

    .language-switcher {
      display: flex;
      flex: 0 0 auto;
      padding: .2rem;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: .72rem;
      box-shadow: var(--shadow-xs);
    }

    .language-switcher button {
      min-width: 2.35rem;
      min-height: 2.25rem;
      padding: .3rem .42rem;
      color: var(--text-soft);
      background: transparent;
      border: 0;
      border-radius: .5rem;
      font-size: .72rem;
      font-weight: 900;
    }

    .language-switcher button:hover {
      color: var(--text);
      background: var(--surface-strong);
    }

    .language-switcher button[aria-pressed="true"] {
      color: #171200;
      background: var(--gold);
      box-shadow: inset 0 -2px 0 rgb(0 0 0 / 10%);
    }

    .content {
      width: min(100%, var(--content-width));
      margin-inline: auto;
      padding: clamp(1rem, 2vw, 1.75rem);
    }

    .page-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-block-end: 1rem;
    }

    .page-heading h1,
    .page-heading p {
      margin: 0;
    }

    .page-heading h1 {
      font-size: clamp(1.65rem, 3vw, 2.4rem);
      line-height: 1.15;
      letter-spacing: -.04em;
    }

    .page-heading p {
      max-width: 65rem;
      margin-block-start: .4rem;
      color: var(--text-soft);
    }

    .eyebrow {
      display: block;
      margin-block-end: .25rem;
      color: var(--crimson);
      font-size: .72rem;
      font-weight: 950;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .page-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: .55rem;
    }

    .hero {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(14rem, .55fr);
      gap: 1rem;
      overflow: hidden;
      padding: clamp(1.35rem, 3vw, 2.15rem);
      color: #fff;
      background:
        linear-gradient(120deg, rgb(152 23 53 / 72%), transparent 48%),
        radial-gradient(circle at 90% 8%, rgb(216 183 72 / 23%), transparent 17rem),
        linear-gradient(145deg, #060d18, #1b3152);
      border: 1px solid rgb(255 255 255 / 8%);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-md);
    }

    .hero h2,
    .hero p {
      position: relative;
      z-index: 1;
      margin: 0;
    }

    .hero h2 {
      font-size: clamp(1.5rem, 3vw, 2.35rem);
      line-height: 1.17;
    }

    .hero p {
      max-width: 54rem;
      margin-block-start: .55rem;
      color: #e5eaf2;
    }

    .hero-card {
      position: relative;
      z-index: 1;
      align-self: center;
      padding: 1rem;
      color: #171200;
      background: linear-gradient(145deg, var(--gold-light), var(--gold));
      border-radius: var(--radius-md);
      box-shadow:
        inset 0 -4px 0 rgb(0 0 0 / 12%),
        0 14px 32px rgb(0 0 0 / 20%);
    }

    .hero-card strong,
    .hero-card span {
      display: block;
    }

    .hero-card span {
      margin-block-start: .2rem;
      font-size: .78rem;
    }

    .grid {
      display: grid;
      gap: 1rem;
    }

    .grid.two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .grid.three {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .grid.four {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1rem;
      margin-block: 1rem;
    }

    .panel,
    .card,
    .kpi,
    .empty-state {
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
    }

    .panel,
    .card {
      padding: 1rem;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .8rem;
      margin-block-end: .85rem;
    }

    .panel-header h2,
    .panel-header h3 {
      margin: 0;
      font-size: 1.08rem;
    }

    .kpi {
      position: relative;
      min-height: 8.3rem;
      overflow: hidden;
      padding: 1rem;
      transition: var(--transition);
    }

    .kpi:hover {
      border-color: var(--gold-dark);
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }

    .kpi::before {
      position: absolute;
      height: 3px;
      inset-block-start: 0;
      inset-inline: 0;
      content: "";
      background: linear-gradient(90deg, var(--gold), var(--crimson));
    }

    .kpi::after {
      position: absolute;
      width: 5.5rem;
      height: 5.5rem;
      inset-inline-end: -2.2rem;
      inset-block-end: -2.9rem;
      content: "";
      background: var(--gold);
      border-radius: 50%;
      opacity: .14;
    }

    .kpi[data-tone="danger"]::after {
      background: var(--crimson);
    }

    .kpi[data-tone="silver"]::after {
      background: var(--silver);
    }

    .kpi-label,
    .kpi-value,
    .kpi-note {
      position: relative;
      z-index: 1;
      display: block;
    }

    .kpi-label {
      min-height: 2.5rem;
      color: var(--text-soft);
      font-size: .8rem;
      font-weight: 850;
    }

    .kpi-value {
      margin-block-start: .35rem;
      font-size: clamp(1.55rem, 3vw, 2.2rem);
      font-variant-numeric: tabular-nums;
      font-weight: 950;
      line-height: 1;
    }

    .kpi-note {
      margin-block-start: .5rem;
      color: var(--text-muted);
      font-size: .72rem;
    }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: .75rem;
    }

    .quick-action,
    .entity-card {
      position: relative;
      padding: .9rem;
      overflow: hidden;
      color: var(--text);
      text-align: start;
      background: linear-gradient(145deg, var(--surface-soft), var(--surface));
      border: 1px solid var(--border);
      border-radius: .8rem;
      transition: var(--transition);
    }

    .quick-action {
      min-height: 6.6rem;
    }

    .quick-action::after,
    .entity-card::after {
      position: absolute;
      width: 3.5rem;
      height: 3.5rem;
      inset-block-end: -2rem;
      inset-inline-end: -1.2rem;
      content: "";
      background: var(--gold);
      border-radius: 50%;
      opacity: .12;
    }

    .quick-action:hover,
    .entity-card:hover {
      border-color: var(--gold-dark);
      box-shadow: var(--shadow-sm);
      transform: translateY(-2px);
    }

    .quick-action strong,
    .quick-action span,
    .entity-card strong,
    .entity-card span {
      display: block;
    }

    .quick-action span,
    .entity-card span {
      margin-block-start: .32rem;
      color: var(--text-soft);
      font-size: .78rem;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      gap: .65rem;
      margin-block-end: 1rem;
      padding: .85rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
    }

    .toolbar-grid {
      display: grid;
      grid-template-columns:
        minmax(14rem, 1.5fr)
        repeat(5, minmax(9rem, 1fr));
      flex: 1 1 100%;
      gap: .65rem;
    }

    .field {
      display: grid;
      gap: .34rem;
      min-width: 0;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field label {
      color: var(--text-soft);
      font-size: .76rem;
      font-weight: 850;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      min-height: 2.72rem;
      padding: .62rem .72rem;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: .6rem;
    }

    .field textarea {
      min-height: 7.5rem;
      resize: vertical;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: var(--focus);
      box-shadow: 0 0 0 3px rgb(7 105 200 / 16%);
      outline: none;
    }

    .field input[aria-invalid="true"],
    .field select[aria-invalid="true"],
    .field textarea[aria-invalid="true"] {
      border-color: var(--danger);
    }

    .field-help {
      color: var(--text-muted);
      font-size: .72rem;
    }

    .btn {
      display: inline-flex;
      min-height: 2.65rem;
      align-items: center;
      justify-content: center;
      gap: .42rem;
      padding: .58rem .88rem;
      color: #171200;
      background: linear-gradient(145deg, var(--gold-light), var(--gold));
      border: 1px solid var(--gold-dark);
      border-radius: .64rem;
      box-shadow:
        inset 0 -2px 0 rgb(0 0 0 / 10%),
        0 3px 9px rgb(216 183 72 / 14%);
      font-weight: 880;
      text-decoration: none;
      transition: var(--transition);
    }

    .btn:hover {
      box-shadow:
        inset 0 -2px 0 rgb(0 0 0 / 12%),
        0 7px 18px rgb(216 183 72 / 21%);
      transform: translateY(-1px);
    }

    .btn.secondary {
      color: var(--text);
      background: var(--surface);
      border-color: var(--border);
      box-shadow: var(--shadow-xs);
    }

    .btn.secondary:hover {
      background: var(--surface-strong);
      border-color: var(--gold-dark);
    }

    .btn.danger {
      color: #fff;
      background: linear-gradient(145deg, var(--crimson-light), var(--crimson));
      border-color: var(--crimson-dark);
    }

    .btn.success {
      color: #fff;
      background: #087443;
      border-color: #075e37;
    }

    .btn.warning {
      color: #201500;
      background: #f3bd55;
      border-color: #a36400;
    }

    .btn.small {
      min-height: 2.15rem;
      padding: .37rem .58rem;
      font-size: .77rem;
    }

    .badge {
      display: inline-flex;
      min-height: 1.65rem;
      align-items: center;
      justify-content: center;
      padding: .18rem .5rem;
      color: var(--text);
      background: var(--surface-strong);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: .68rem;
      font-weight: 880;
      line-height: 1.15;
    }

    .badge.success {
      color: var(--success);
      background: rgb(8 116 67 / 9%);
      border-color: rgb(8 116 67 / 34%);
    }

    .badge.warning {
      color: var(--warning);
      background: rgb(152 92 0 / 9%);
      border-color: rgb(152 92 0 / 34%);
    }

    .badge.danger {
      color: var(--danger);
      background: rgb(179 21 56 / 9%);
      border-color: rgb(179 21 56 / 34%);
    }

    .badge.info {
      color: var(--info);
      background: rgb(8 105 174 / 9%);
      border-color: rgb(8 105 174 / 34%);
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: .42rem;
      margin-block-start: .65rem;
      color: var(--text-soft);
      font-size: .76rem;
    }

    .meta-row span {
      padding: .23rem .42rem;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: .36rem;
    }

    progress {
      width: 100%;
      height: .68rem;
      margin-block-start: .7rem;
      accent-color: var(--gold-dark);
    }

    .table-wrap {
      width: 100%;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: .78rem;
      box-shadow: var(--shadow-xs);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      font-size: .83rem;
    }

    caption {
      padding: .78rem;
      color: var(--text-soft);
      text-align: start;
      font-weight: 780;
    }

    th,
    td {
      padding: .7rem;
      text-align: start;
      vertical-align: middle;
      border-block-end: 1px solid var(--border);
    }

    th {
      color: var(--text);
      background: var(--surface-soft);
      font-size: .7rem;
      letter-spacing: .045em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    tbody tr:hover {
      background: rgb(216 183 72 / 7%);
    }

    tbody tr:last-child td {
      border-block-end: 0;
    }

    .list {
      display: grid;
      gap: .65rem;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .list-item {
      padding: .78rem;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: .66rem;
    }

    .list-item strong,
    .list-item span,
    .list-item p,
    .list-item time {
      display: block;
    }

    .list-item span,
    .list-item p,
    .list-item time {
      margin: .22rem 0 0;
      color: var(--text-soft);
      font-size: .77rem;
    }

    .pagination {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
      margin-block-start: 1rem;
      padding: .75rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
    }

    .pagination-summary {
      color: var(--text-soft);
      font-size: .8rem;
    }

    .pagination-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: .35rem;
      flex-wrap: wrap;
    }

    .pagination-button {
      min-width: 2.35rem;
      min-height: 2.35rem;
      padding: .35rem .55rem;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-weight: 750;
    }

    .pagination-button:hover:not(:disabled) {
      color: #171200;
      background: var(--gold-light);
      border-color: var(--gold-dark);
    }

    .pagination-button[aria-current="page"] {
      color: #171200;
      background: var(--gold);
      border-color: var(--gold-dark);
    }

    .pagination-size {
      min-height: 2.35rem;
      padding: .35rem .55rem;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }

    .result-summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(7rem, 1fr));
      gap: .55rem;
      margin-block: .8rem;
    }

    .result-summary > div {
      padding: .65rem;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: .58rem;
    }

    .result-summary strong,
    .result-summary span {
      display: block;
    }

    .result-summary strong {
      font-size: 1.15rem;
      font-variant-numeric: tabular-nums;
    }

    .result-summary span {
      color: var(--text-soft);
      font-size: .7rem;
    }

    .workflow-line {
      flex-wrap: wrap;
      margin-block-start: .75rem;
    }

    .workflow-arrow {
      color: var(--text-muted);
    }

    .decision-panel {
      padding: .85rem;
      background: rgb(216 183 72 / 8%);
      border: 1px solid rgb(216 183 72 / 38%);
      border-radius: .72rem;
    }

    .decision-history {
      display: grid;
      gap: .5rem;
      padding: 0;
      margin: .75rem 0 0;
      list-style: none;
    }

    .decision-history li {
      padding: .65rem;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: .55rem;
    }

    .decision-history strong,
    .decision-history span {
      display: block;
    }

    .decision-history span {
      margin-block-start: .2rem;
      color: var(--text-soft);
      font-size: .75rem;
    }

    .vote-options {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: .65rem;
    }

    .vote-option {
      min-height: 5rem;
      padding: .8rem;
      text-align: center;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: .7rem;
    }

    .vote-option:has(input:checked) {
      border-color: var(--gold-dark);
      box-shadow: 0 0 0 3px rgb(216 183 72 / 18%);
    }

    .vote-option input {
      display: block;
      margin: 0 auto .4rem;
    }

    .chart {
      display: grid;
      gap: .65rem;
    }

    .chart-row {
      display: grid;
      grid-template-columns: minmax(7rem, .9fr) minmax(8rem, 3fr) auto;
      align-items: center;
      gap: .62rem;
    }

    .chart-track {
      height: 1.08rem;
      overflow: hidden;
      background: var(--surface-strong);
      border-radius: 999px;
    }

    .chart-bar {
      height: 100%;
      min-width: 2px;
      background: linear-gradient(90deg, var(--crimson), var(--gold));
      border-radius: 999px;
    }

    .chart-label,
    .chart-value {
      font-size: .76rem;
    }

    .chart-value {
      font-variant-numeric: tabular-nums;
      font-weight: 880;
    }

    .empty-state {
      display: grid;
      min-height: 13rem;
      place-items: center;
      padding: 2rem;
      text-align: center;
    }

    .empty-state > div {
      max-width: 40rem;
    }

    .empty-state h2,
    .empty-state p {
      margin: .42rem 0 0;
    }

    .empty-state p {
      color: var(--text-soft);
    }

    .state-icon {
      font-size: 2.15rem;
    }

    .validation-summary {
      padding: .75rem;
      margin: 0 1rem;
      color: var(--danger);
      background: rgb(179 21 56 / 8%);
      border: 1px solid rgb(179 21 56 / 35%);
      border-radius: .66rem;
      font-size: .82rem;
      font-weight: 780;
    }

    .backdrop {
      position: fixed;
      z-index: 1080;
      inset: 0;
      background: rgb(2 6 15 / 68%);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition);
      backdrop-filter: blur(3px);
    }

    .backdrop[data-open="true"] {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer {
      position: fixed;
      z-index: 1100;
      inset-block: 0;
      inset-inline-end: 0;
      width: min(94vw, 30rem);
      display: flex;
      flex-direction: column;
      padding: 1rem;
      color: var(--text);
      background: var(--surface);
      border-inline-start: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      transform: translateX(105%);
      transition: transform var(--transition);
    }

    [dir="rtl"] .drawer {
      transform: translateX(-105%);
    }

    .drawer[data-open="true"] {
      transform: translateX(0);
    }

    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .8rem;
      padding-block-end: .8rem;
      border-block-end: 1px solid var(--border);
    }

    .drawer-header h2 {
      margin: 0;
      font-size: 1.18rem;
    }

    .drawer-body {
      overflow: auto;
      padding-block: .85rem;
    }

    .profile-menu {
      position: fixed;
      z-index: 1050;
      inset-block-start: 7.9rem;
      inset-inline-end: 1rem;
      width: min(92vw, 21rem);
      padding: .55rem;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: .82rem;
      box-shadow: var(--shadow-md);
    }

    .profile-summary {
      padding: .7rem;
      border-block-end: 1px solid var(--border);
    }

    .profile-summary strong,
    .profile-summary span {
      display: block;
    }

    .profile-summary span {
      color: var(--text-soft);
      font-size: .76rem;
    }

    .profile-menu button {
      width: 100%;
      min-height: 2.5rem;
      padding: .52rem .65rem;
      color: var(--text);
      text-align: start;
      background: transparent;
      border: 0;
      border-radius: .52rem;
    }

    .profile-menu button:hover {
      background: var(--surface-soft);
    }

    dialog {
      width: min(calc(100% - 1.5rem), 56rem);
      max-height: min(93vh, 64rem);
      padding: 0;
      overflow: hidden;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
    }

    dialog::backdrop {
      background: rgb(2 6 15 / 70%);
      backdrop-filter: blur(5px);
    }

    .dialog-shell {
      display: flex;
      max-height: min(93vh, 64rem);
      flex-direction: column;
    }

    .dialog-header,
    .dialog-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .8rem;
      padding: 1rem;
    }

    .dialog-header {
      color: #fff;
      background:
        linear-gradient(120deg, rgb(152 23 53 / 69%), transparent 55%),
        linear-gradient(145deg, #080e19, #1a2f50);
      border-block-end: 1px solid var(--border);
    }

    .dialog-header h2 {
      margin: 0;
      font-size: 1.17rem;
    }

    .dialog-header .icon-button {
      color: #fff;
      background: rgb(255 255 255 / 8%);
      border-color: rgb(255 255 255 / 17%);
    }

    .dialog-body {
      overflow: auto;
      padding: 1rem;
    }

    .dialog-footer {
      justify-content: flex-end;
      background: var(--surface-soft);
      border-block-start: 1px solid var(--border);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: .85rem;
    }

    .form-grid .full {
      grid-column: 1 / -1;
    }

    .toast-region {
      position: fixed;
      z-index: 2500;
      inset-block-end: max(1rem, env(safe-area-inset-bottom));
      inset-inline-end: max(1rem, env(safe-area-inset-right));
      display: grid;
      width: min(calc(100% - 2rem), 25rem);
      gap: .62rem;
      pointer-events: none;
    }

    .toast {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: start;
      gap: .65rem;
      padding: .82rem;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-inline-start: .36rem solid var(--info);
      border-radius: .75rem;
      box-shadow: var(--shadow-md);
      pointer-events: auto;
    }

    .toast[data-tone="success"] {
      border-inline-start-color: var(--success);
    }

    .toast[data-tone="warning"] {
      border-inline-start-color: var(--warning);
    }

    .toast[data-tone="danger"] {
      border-inline-start-color: var(--danger);
    }

    .toast strong,
    .toast span {
      display: block;
    }

    .toast span {
      margin-block-start: .1rem;
      color: var(--text-soft);
      font-size: .76rem;
    }

    .toast button {
      padding: .1rem;
      color: var(--text-soft);
      background: transparent;
      border: 0;
    }

    details {
      padding: .8rem;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: .65rem;
    }

    details + details {
      margin-block-start: .65rem;
    }

    summary {
      cursor: pointer;
      font-weight: 850;
    }

    .mobile-only {
      display: none;
    }

    @media (max-width: 94rem) {
      .toolbar-grid {
        grid-template-columns: repeat(3, minmax(10rem, 1fr));
      }

      .profile-name {
        display: none;
      }
    }

    @media (max-width: 88rem) {
      .kpi-grid,
      .grid.four {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .grid.three {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 72rem) {
      .sidebar {
        transform: translateX(-105%);
        box-shadow: var(--shadow-lg);
      }

      [dir="rtl"] .sidebar {
        transform: translateX(105%);
      }

      .sidebar[data-open="true"] {
        transform: translateX(0);
      }

      .workspace {
        margin-inline-start: 0;
      }

      .topbar {
        grid-template-columns: minmax(10rem, 1fr) auto;
      }

      .global-search {
        grid-column: 1 / -1;
        grid-row: 2;
      }

      .mobile-only {
        display: inline-grid;
      }

      .grid.two {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 55rem) {
      .content {
        padding: .85rem;
      }

      .page-heading {
        align-items: stretch;
        flex-direction: column;
      }

      .page-actions {
        justify-content: flex-start;
      }

      .hero,
      .kpi-grid,
      .grid.two,
      .grid.three,
      .grid.four,
      .quick-grid,
      .form-grid,
      .vote-options,
      .result-summary,
      .toolbar-grid {
        grid-template-columns: 1fr;
      }

      .topbar {
        grid-template-columns: 1fr;
      }

      .topbar-start,
      .topbar-actions,
      .global-search {
        grid-column: 1;
      }

      .topbar-actions {
        width: 100%;
        flex-wrap: wrap;
        justify-content: flex-start;
      }

      #course-scope {
        display: block !important;
        order: 20;
        width: 100%;
        max-width: none;
        flex: 1 1 100%;
      }

      .language-switcher {
        display: flex !important;
        width: 100%;
        visibility: visible !important;
      }

      .language-switcher button {
        flex: 1;
      }

      .toolbar > .btn {
        flex: 1 1 10rem;
      }

      .pagination {
        align-items: stretch;
        flex-direction: column;
      }

      .pagination-actions {
        justify-content: flex-start;
      }

      .pagination-size {
        width: 100%;
      }
    }

    @media (max-width: 31rem) {
      .pagination-button {
        flex: 1 0 2.6rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
      }
    }

    @media print {
      @page {
        margin: 1.2cm;
      }

      :root {
        color-scheme: light;
        --bg: #fff;
        --surface: #fff;
        --surface-soft: #fff;
        --surface-strong: #eee;
        --text: #000;
        --text-soft: #333;
        --text-muted: #444;
        --border: #999;
      }

      body {
        background: #fff;
        font-size: 10pt;
      }

      .sidebar,
      .topbar,
      .sample-banner,
      .backdrop,
      .drawer,
      .profile-menu,
      .toast-region,
      .page-actions,
      .toolbar,
      .pagination,
      .btn,
      .icon-button,
      .profile-button {
        display: none !important;
      }

      .workspace {
        margin: 0;
      }

      .content {
        width: 100%;
        max-width: none;
        padding: 0;
      }

      .panel,
      .card,
      .kpi,
      .table-wrap {
        break-inside: avoid;
        box-shadow: none;
      }

      .hero {
        color: #000;
        background: #fff;
        border: 2px solid #000;
      }

      .hero p {
        color: #222;
      }
    }
  </style>
</head>

<body>
  <a class="skip-link" href="#main-content" data-i18n="skip">
    Skip to main content
  </a>

  <div id="sidebar-backdrop" class="backdrop" data-open="false" aria-hidden="true"></div>

  <aside id="sidebar" class="sidebar" data-open="false" aria-label="Primary navigation">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">S</div>

      <div class="brand-copy">
        <strong>YAJIB University</strong>
        <span data-i18n="portalName">University Senate Portal</span>
      </div>
    </div>

    <div class="sidebar-label" data-i18n="workspace">Senate workspace</div>
    <nav id="sidebar-nav" class="sidebar-nav"></nav>

    <div class="sidebar-footer">
      <strong data-i18n="secureWorkspace">Secure Senate workspace</strong>
      <span id="sidebar-scope"></span>
    </div>
  </aside>

  <div class="workspace">
    <div class="sample-banner" role="status">
      <span aria-hidden="true">⚠</span>
      <span data-i18n="sampleNotice">
        SAMPLE WORKSPACE — Changes are stored only in this browser.
      </span>
    </div>

    <header class="topbar">
      <div class="topbar-start">
        <button
          id="sidebar-toggle"
          class="icon-button mobile-only"
          type="button"
          aria-controls="sidebar"
          aria-expanded="false"
          aria-label="Open navigation"
        >
          ☰
        </button>

        <nav id="breadcrumbs" class="breadcrumbs" aria-label="Breadcrumb"></nav>
      </div>

    function t(key) {
      return TEXT[state.language]?.[key] ?? EN[key] ?? key;
    }

    function normalize(value) {
      return String(value ?? "").trim();
    }

    function localized(value) {
      if (value && typeof value === "object" && !Array.isArray(value)) {
        return value[state.language] ?? value.en ?? Object.values(value)[0] ?? "";
      }

      return value == null ? "" : String(value);
    }

    function makeLocalized(value) {
      return {
        en: value,
        fr: value,
        ar: value
      };
    }

    function uid(prefix = "record") {
      const id =
        globalThis.crypto?.randomUUID?.() ??
        `${Date.now()}-${Math.random().toString(16).slice(2)}`;

      return `${prefix}-${id}`;
    }

    function initials(name = "") {
      return normalize(name)
        .split(/\s+/)
        .slice(0, 2)
        .map(part => part[0]?.toUpperCase() || "")
        .join("") || "SM";
    }

    function formatNumber(value, options = {}) {
      const numeric = Number(value);

      return Number.isFinite(numeric)
        ? new Intl.NumberFormat(LOCALES[state.language], options).format(numeric)
        : "—";
    }

    function formatDate(value) {
      const date = new Date(value);

      return Number.isNaN(date.getTime())
        ? "—"
        : new Intl.DateTimeFormat(LOCALES[state.language], {
            dateStyle: "medium"
          }).format(date);
    }

    function formatDateTime(value) {
      const date = new Date(value);

      return Number.isNaN(date.getTime())
        ? "—"
        : new Intl.DateTimeFormat(LOCALES[state.language], {
            dateStyle: "medium",
            timeStyle: "short"
          }).format(date);
    }

    function canonicalStatus(value) {
      return normalize(value)
        .toLowerCase()
        .replace(/[–—-]+/g, "_")
        .replace(/\s+/g, "_");
    }

    function statusLabel(value) {
      const key = `status_${canonicalStatus(value)}`;
      const translated = t(key);

      return translated === key
        ? normalize(value)
            .replaceAll("_", " ")
            .replace(/\b\w/g, character => character.toUpperCase())
        : translated;
    }

    function statusTone(value) {
      const status = canonicalStatus(value);

      if (
        [
          "active",
          "completed",
          "carried",
          "adopted",
          "implemented",
          "approved",
          "senate_approved",
          "department_approved",
          "faculty_approved",
          "committee_recommended",
          "for"
        ].includes(status)
      ) {
        return "success";
      }

      if (
        [
          "inactive",
          "cancelled",
          "defeated",
          "withdrawn",
          "rejected",
          "senate_rejected",
          "against"
        ].includes(status)
      ) {
        return "danger";
      }

      if (
        [
          "draft",
          "submitted",
          "under_review",
          "scheduled",
          "open",
          "seconded",
          "in_progress",
          "pending",
          "senate_pending",
          "returned",
          "abstain"
        ].includes(status)
      ) {
        return "warning";
      }

      return "info";
    }

    function createElement(tag, options = {}) {
      const node = document.createElement(tag);

      if (options.className) {
        node.className = options.className;
      }

      if (options.text != null) {
        node.textContent = String(options.text);
      }

      for (const [name, value] of Object.entries(options.attrs || {})) {
        if (value == null || value === false) {
          continue;
        }

        node.setAttribute(name, value === true ? "" : String(value));
      }

      for (const [name, value] of Object.entries(options.dataset || {})) {
        node.dataset[name] = String(value);
      }

      for (const [name, handler] of Object.entries(options.events || {})) {
        node.addEventListener(name, handler);
      }

      node.append(...(options.children || []).filter(Boolean));

      return node;
    }

      return createElement("button", {

        events: {
          click: handler
        }
      });

    function debounce(callback, delay = 220) {
      let timeout;

      return (...args) => {
        clearTimeout(timeout);
        timeout = setTimeout(() => callback(...args), delay);
      };

    function showToast(title, message, tone = "info", duration = 4400) {
      const toast = createElement("div", {
        className: "toast",
        dataset: {
          tone
        },
        attrs: {
          role: tone === "danger" ? "alert" : "status"
        }
      });

      toast.append(
        createElement("span", {
          text:
            tone === "success"
              ? "✓"
              : tone === "danger"
                ? "!"
                : tone === "warning"
                  ? "⚠"
                  : "ⓘ",
          attrs: {
            "aria-hidden": "true"
          }
        }),

        createElement("div", {
          children: [
            createElement("strong", {
              text: title
            }),
            createElement("span", {
              text: message
            })
          ]
        }),

        makeButton("×", () => toast.remove(), "", {
          "aria-label": t("close")
        })
      );

      $("#toast-region").append(toast);
      setTimeout(() => toast.remove(), duration);
    }

    function csvCell(value) {
      return `"${String(value ?? "").replaceAll('"', '""')}"`;
    }

    function downloadCsv(filename, rows) {
      const source = rows
        .map(row => row.map(csvCell).join(","))
        .join("\r\n");

      const blob = new Blob([source], {
        type: "text/csv;charset=utf-8"
      });

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download = filename;

      document.body.append(link);
      link.click();
      link.remove();

      URL.revokeObjectURL(url);
    }

    function loadData() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);

        if (saved) {
          return JSON.parse(saved);
        }
      } catch (error) {
        console.warn("Unable to load sample data.", error);
      }

      return createInitialData();
    }

    function migrateData(data) {
      const seed = createInitialData();

      for (const [key, value] of Object.entries(seed)) {
        if (data[key] == null) {
          data[key] = value;
        }
      }

      return data;
    }

    function persistData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
      } catch (error) {
        console.warn("Unable to save sample data.", error);
      }
    }

    function loadFilters() {
      try {
        const saved = JSON.parse(localStorage.getItem(FILTER_KEY) || "{}");

        for (const [route, values] of Object.entries(saved)) {
          if (!state.filters[route] || !values) {
            continue;
          }

          Object.assign(state.filters[route], values);

          if (![5, 8, 10, 12, 20, 50].includes(Number(state.filters[route].pageSize))) {
            state.filters[route].pageSize = 10;
          }

          if (!Number.isInteger(state.filters[route].page) || state.filters[route].page < 1) {
            state.filters[route].page = 1;
          }
        }
      } catch (error) {
        console.warn("Unable to restore filters.", error);
      }
    }

    function persistFilters() {
      try {
        localStorage.setItem(FILTER_KEY, JSON.stringify(state.filters));
      } catch (error) {
        console.warn("Unable to save filters.", error);
      }
    }

    function facultyById(id) {
      return state.data.faculties.find(item => item.id === id) || null;
    }

    function departmentById(id) {
      return state.data.departments.find(item => item.id === id) || null;
    }

    function courseById(id) {
      return state.data.courses.find(item => item.id === id) || null;
    }

    function examCommitteeById(id) {
      return state.data.examCommittees.find(item => item.id === id) || null;
    }

    function proposalById(id) {
      return state.data.courseProposals.find(item => item.id === id) || null;
    }

    function motionById(id) {
      return state.data.motions.find(item => item.id === id) || null;
    }

    function voteForMotion(motionId) {
      return state.data.votes.find(
        vote =>
          vote.motionId === motionId &&
          vote.memberId === state.data.context.id
      ) || null;
    }

      state.data.activity.unshift({
        title: makeLocalized(message),
        createdAt: new Date().toISOString()
      });

      state.data.activity = state.data.activity.slice(0, 40);
    }

    function addNotification(title, body) {
      state.data.notifications.unshift({
        id: uid("notification"),
        title: makeLocalized(title),
        body: makeLocalized(body),
        createdAt: new Date().toISOString(),
        readAt: null
      });
    }

    function addAudit(action, entity, entityId, details = "") {
      state.data.audit.unshift({
        id: uid("audit"),
        actor: state.data.context.name,
        action,
        entity,
        entityId,
        details,
        createdAt: new Date().toISOString()
      });

      state.data.audit = state.data.audit.slice(0, 200);

    function detectLanguage() {
      try {
        const stored = localStorage.getItem(LANGUAGE_KEY);

        if (TEXT[stored]) {
          return stored;
        }
      } catch {
        // Storage may be unavailable.
      }

      const browserLanguage =
        navigator.languages?.[0] ||
        navigator.language ||
        "en";

      if (browserLanguage.toLowerCase().startsWith("ar")) {
        return "ar";
      }

      if (browserLanguage.toLowerCase().startsWith("fr")) {
        return "fr";
      }

      return "en";
    }

    function translateStaticUi() {
      $$("[data-i18n]").forEach(node => {
        node.textContent = t(node.dataset.i18n);
      });

      $$("[data-i18n-placeholder]").forEach(node => {
        node.placeholder = t(node.dataset.i18nPlaceholder);
      });

      $$("[data-i18n-aria-label]").forEach(node => {
        node.setAttribute("aria-label", t(node.dataset.i18nAriaLabel));
      });
    }

    function captureModalValues() {
      if (!$("#modal").open) {
        return null;
      }

      const values = {};

      $$("input,select,textarea", $("#modal-body")).forEach(control => {
        if (!control.id) {
          return;
        }

        values[control.id] = {
          type: control.type,
          value:
            control.type === "checkbox" || control.type === "radio"
              ? control.checked
              : control.value
        };
      });

      return {
        values,
        activeId: document.activeElement?.id || "",
        scrollTop: $("#modal-body").scrollTop
      };
    }

    function restoreModalValues(snapshot) {
      if (!snapshot) {
        return;
      }

      for (const [id, field] of Object.entries(snapshot.values)) {
        const control = document.getElementById(id);

        if (!control) {
          continue;
        }

        if (field.type === "checkbox" || field.type === "radio") {
          control.checked = Boolean(field.value);
        } else {
          control.value = field.value;
        }
      }

      $("#modal-body").scrollTop = snapshot.scrollTop;

      if (snapshot.activeId) {
        document.getElementById(snapshot.activeId)?.focus({
          preventScroll: true
        });
      }
    }

    function applyLanguage(language, rerender = true) {
      const modalSnapshot = captureModalValues();

      state.language = TEXT[language] ? language : "en";

      try {
        localStorage.setItem(LANGUAGE_KEY, state.language);
      } catch {
        // Storage may be unavailable.
      }

      document.documentElement.lang = state.language;
      document.documentElement.dir = state.language === "ar" ? "rtl" : "ltr";

      $$("[data-language]", $("#language-switcher")).forEach(button => {
        button.setAttribute(
          "aria-pressed",
          String(button.dataset.language === state.language)
        );
      });

      translateStaticUi();
      renderNavigation();
      renderIdentity();
      renderCourseScope();
      renderBreadcrumbs();
      renderPageMeta();
      renderNotifications();

      if (rerender) {
        renderRoute();
      }

      if ($("#modal").open && state.modal) {
        renderModal();
        restoreModalValues(modalSnapshot);
      }
    }

    function applyTheme(theme) {
      state.theme = theme === "dark" ? "dark" : "light";

      try {
        localStorage.setItem(THEME_KEY, state.theme);
      } catch {
        // Storage may be unavailable.
      }

      document.documentElement.dataset.theme = state.theme;
      $("#theme-icon").textContent = state.theme === "dark" ? "☀" : "◐";
    }

    function loadPreferences() {
      let theme = "";

      try {
        theme = localStorage.getItem(THEME_KEY) || "";
        state.courseScopeId = localStorage.getItem(COURSE_SCOPE_KEY) || "";
      } catch {
        theme = "";
      }

      if (theme !== "light" && theme !== "dark") {
        theme = matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
      }

      applyTheme(theme);
      applyLanguage(detectLanguage(), false);
    }

            attrs: {
              type: "button",
              "aria-current": state.route === route ? "page" : "false"
            },
            children: [

                className: "nav-icon",

                attrs: {
                  "aria-hidden": "true"

              }),
              createElement("span", {
                text: t(labelKey)
              })

    function renderIdentity() {
      const context = state.data.context;

      $("#header-name").textContent = context.name;
      $("#header-avatar").textContent = initials(context.name);
      $("#profile-name").textContent = context.name;

    function renderCourseScope() {

    function renderBreadcrumbs() {

      container.replaceChildren();

          text: t("dashboard"),

            type: "button"

    function renderPageMeta() {

      $("#page-eyebrow").textContent = t("senateMember");

    function navigate(route) {
      if (!ROUTE_META[route]) {
        return;
      }

      state.route = route;

      closeSidebar();
      closeNotifications();
      closeProfileMenu();
      closeSearch();

      renderNavigation();
      renderBreadcrumbs();
      renderPageMeta();
      renderRoute();

      const hash = new URLSearchParams({
        view: route
      });

      if (state.courseScopeId) {
        hash.set("course", state.courseScopeId);
      }

      history.replaceState(null, "", `#${hash.toString()}`);

      $("#main-content").focus({
        preventScroll: true
      });

      scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    function parseHash() {
      const params = new URLSearchParams(location.hash.replace(/^#/, ""));

      if (ROUTE_META[params.get("view")]) {
        state.route = params.get("view");
      }

      const courseId = params.get("course");

      if (state.data.courses.some(course => course.id === courseId)) {
        state.courseScopeId = courseId;
      }
    }

    function persistCourseScope() {
      try {
        localStorage.setItem(COURSE_SCOPE_KEY, state.courseScopeId);
      } catch {
        // Storage may be unavailable.
      }
    }

    function recordContext(record) {
      const course = record.courseId ? courseById(record.courseId) : null;

      return {
        facultyId: record.facultyId || course?.facultyId || "",
        departmentId: record.departmentId || course?.departmentId || "",
        level: record.level || course?.level || "",
        courseId: record.courseId || record.id && state.data.courses.some(
          courseItem => courseItem.id === record.id
        )
          ? record.courseId || record.id
          : ""
      };
    }

    function passesAcademicFilters(route, record) {
      const filter = state.filters[route];
      const context = recordContext(record);

      return (
        (!filter.facultyId || context.facultyId === filter.facultyId) &&
        (!filter.departmentId || context.departmentId === filter.departmentId) &&
        (!filter.level || context.level === filter.level) &&
        (!filter.courseId || context.courseId === filter.courseId)
      );
    }

    function courseInHeaderScope(courseId) {
      return !state.courseScopeId || courseId === state.courseScopeId;
    }

    function scopedCourses() {
      return state.data.courses.filter(course =>
        courseInHeaderScope(course.id)
      );
    }

    function scopedExaminations() {
      return state.data.examinations.filter(examination =>
        courseInHeaderScope(examination.courseId)
      );
    }

    function scopedResultBatches() {
      return state.data.resultBatches.filter(batch =>
        courseInHeaderScope(batch.courseId)
      );
    }

    function scopedProposals() {
      return state.data.courseProposals.filter(proposal =>
        courseInHeaderScope(proposal.courseId)
      );
    }

    function scopedPapers() {
      if (!state.courseScopeId) {
        return state.data.papers;
      }

      const proposalIds = new Set(
        scopedProposals().map(proposal => proposal.id)
      );

      return state.data.papers.filter(paper =>
        proposalIds.has(paper.proposalId)
      );
    }

    function scopedMotions() {
      if (!state.courseScopeId) {
        return state.data.motions;
      }

      const proposalIds = new Set(
        scopedProposals().map(proposal => proposal.id)
      );

      return state.data.motions.filter(motion =>
        proposalIds.has(motion.proposalId)
      );
    }

    function scopedResolutions() {
      if (!state.courseScopeId) {
        return state.data.resolutions;
      }

      const motionIds = new Set(
        scopedMotions().map(motion => motion.id)
      );

      return state.data.resolutions.filter(resolution =>
        motionIds.has(resolution.motionId)
      );
    }

    function paginate(route, records) {
      const filter = state.filters[route];
      const totalRecords = records.length;
      const totalPages = Math.max(
        1,
        Math.ceil(totalRecords / filter.pageSize)
      );

      filter.page = Math.min(
        Math.max(1, filter.page),
        totalPages
      );

      const startIndex = (filter.page - 1) * filter.pageSize;
      const endIndex = Math.min(
        startIndex + filter.pageSize,
        totalRecords
      );

      persistFilters();

      return {
        records: records.slice(startIndex, endIndex),
        page: filter.page,
        pageSize: filter.pageSize,
        totalPages,
        totalRecords,
        start: totalRecords ? startIndex + 1 : 0,
        end: endIndex
      };
    }

    function visiblePageNumbers(currentPage, totalPages) {
      if (totalPages <= 7) {
        return Array.from(
          { length: totalPages },
          (_, index) => index + 1
        );
      }

      const pages = new Set([
        1,
        totalPages,
        currentPage - 1,
        currentPage,
        currentPage + 1
      ]);

      const normalized = [...pages]
        .filter(page => page >= 1 && page <= totalPages)
        .sort((a, b) => a - b);

      const result = [];

      normalized.forEach((page, index) => {
        if (index && page - normalized[index - 1] > 1) {
          result.push("ellipsis");
        }

        result.push(page);
      });

      return result;
    }

    function renderPagination(route, pageData, rerender) {
      const navigation = createElement("nav", {
        className: "pagination",
        attrs: {
          "aria-label": t("paginationPage")
        }
      });

      navigation.append(
        createElement("span", {
          className: "pagination-summary",
          text:
            `${t("paginationShowing")} ${pageData.start} ` +
            `${t("paginationTo")} ${pageData.end} ` +
            `${t("paginationOf")} ${pageData.totalRecords} ` +
            `${t("paginationRecords")}`
        })
      );

      const actions = createElement("div", {
        className: "pagination-actions"
      });

      actions.append(
        makeButton(
          t("paginationPrevious"),
          () => {
            state.filters[route].page -= 1;
            persistFilters();
            rerender();
          },
          "pagination-button",
          {
            disabled: pageData.page === 1
          }
        )
      );

      visiblePageNumbers(pageData.page, pageData.totalPages)
        .forEach(pageNumber => {
          if (pageNumber === "ellipsis") {
            actions.append(
              createElement("span", {
                text: "…",
                attrs: {
                  "aria-hidden": "true"
                }
              })
            );
            return;
          }

          const button = makeButton(
            String(pageNumber),
            () => {
              state.filters[route].page = pageNumber;
              persistFilters();
              rerender();
            },
            "pagination-button",
            {
              "aria-label": `${t("paginationPage")} ${pageNumber}`
            }
          );

          if (pageNumber === pageData.page) {
            button.setAttribute("aria-current", "page");
          }

          actions.append(button);
        });

      actions.append(
        makeButton(
          t("paginationNext"),
          () => {
            state.filters[route].page += 1;
            persistFilters();
            rerender();
          },
          "pagination-button",
          {
            disabled: pageData.page === pageData.totalPages
          }
        )
      );

      const pageSize = simpleSelect(
        `${route}-page-size`,
        [5, 8, 10, 12, 20, 50].map(size => ({
          value: String(size),
          label: `${size} · ${t("paginationPerPage")}`
        })),
        String(state.filters[route].pageSize)
      );

      pageSize.className = "pagination-size";

      pageSize.addEventListener("change", event => {
        state.filters[route].pageSize = Number(event.target.value);
        state.filters[route].page = 1;
        persistFilters();
        rerender();
      });

      actions.append(pageSize);
      navigation.append(actions);

      return navigation;
    }

    function filterMatches(route, searchableParts, status) {
      const filter = state.filters[route];
      const query = filter.query.toLocaleLowerCase(LOCALES[state.language]);
      const searchable = searchableParts
        .join(" ")
        .toLocaleLowerCase(LOCALES[state.language]);

      return (
        (!query || searchable.includes(query)) &&
        (!filter.status || status === filter.status)
      );
    }

    function renderAnalytics() {
      $("#page-actions").append(
        makeButton(t("print"), () => print(), "btn secondary")
      );

      const resultStatuses = [
        "senate_pending",
        "senate_approved",
        "senate_rejected",
        "returned"
      ].map(status => ({
        label: statusLabel(status),
        count: scopedResultBatches().filter(
          batch => batch.status === status
        ).length
      }));

      const examinationStatuses = [
        "scheduled",
        "completed",
        "cancelled"
      ].map(status => ({
        label: statusLabel(status),
        count: scopedExaminations().filter(
          examination => examination.status === status
        ).length
      }));

      const coursesByFaculty = state.data.faculties.map(faculty => ({
        label: faculty.code,
        count: scopedCourses().filter(
          course => course.facultyId === faculty.id
        ).length
      }));

      const resolutionProgress = scopedResolutions().map(resolution => ({
        label: resolution.reference,
        count: resolution.progress
      }));

      const eligible = scopedMotions().filter(motion =>
        ["open", "seconded", "carried", "defeated"].includes(motion.status)
      );

      const participation = eligible.length
        ? eligible.filter(motion => voteForMotion(motion.id)).length /
          eligible.length *
          100
        : 0;

      $("#view").replaceChildren(
        createElement("div", {
          className: "grid two",
          children: [
            chartPanel(t("resultsByStatus"), resultStatuses),
            chartPanel(t("examinationsByStatus"), examinationStatuses),
            chartPanel(t("coursesByFaculty"), coursesByFaculty),
            chartPanel(
              t("resolutionsByProgress"),
              resolutionProgress,
              "%"
            ),
            chartPanel(
              t("votingParticipation"),
              [
                {
                  label: t("votingParticipation"),
                  count: participation
                }
              ],
              "%"
            )
          ]
        })
      );
    }

    function chartPanel(title, items, suffix = "") {
      const maximum = Math.max(
        1,
        ...items.map(item => Number(item.count || 0))
      );

      const chart = createElement("div", {
        className: "chart",
        attrs: {
          role: "img",
          "aria-label": title
        }
      });

      items.forEach(item => {
        const width = Math.max(
          0,
          Math.min(100, Number(item.count || 0) / maximum * 100)
        );

        chart.append(
          createElement("div", {
            className: "chart-row",
            children: [
              createElement("span", {
                className: "chart-label",
                text: item.label
              }),
              createElement("div", {
                className: "chart-track",
                children: [
                  createElement("div", {
                    className: "chart-bar",
                    attrs: {
                      style: `width:${width}%`
                    }
                  })
                ]
              }),
              createElement("strong", {
                className: "chart-value",
                text:
                  `${formatNumber(item.count, {
                    maximumFractionDigits: 1
                  })}${suffix}`
              })
            ]
          })
        );
      });

      return createElement("section", {
        className: "panel",
        children: [
          createElement("div", {
            className: "panel-header",
            children: [
              createElement("h2", {
                text: title
              })
            ]
          }),
          chart
        ]
      });
    }

    function makeTable(caption, headerKeys, rows) {
      const body = createElement("tbody");

      rows.forEach(row => {
        const tableRow = createElement("tr");

        row.forEach(value => {
          const cell = createElement("td");

          if (value instanceof Node) {
            cell.append(value);
          } else {
            cell.textContent = value == null ? "—" : String(value);
          }

          tableRow.append(cell);
        });

        body.append(tableRow);
      });

      return createElement("div", {
        className: "table-wrap",
        children: [
          createElement("table", {
            children: [
              createElement("caption", {
                text: caption
              }),
              createElement("thead", {
                children: [
                  createElement("tr", {
                    children: headerKeys.map(key =>
                      createElement("th", {
                        text: t(key),
                        attrs: {
                          scope: "col"
                        }
                      })
                    )
                  })
                ]
              }),
              body
            ]
          })
        ]
      });
    }

    function simpleSelect(id, options, selected = "") {
      const select = createElement("select", {
        attrs: {

      options.forEach(option => {
        select.append(
          createElement("option", {
            text: option.label,

      });

      select.value = selected;

    function collectionSelect(
      id,
      records,
      selected,
      label,
      emptyLabel = ""
    ) {
      const options = [];

      if (emptyLabel) {
        options.push({
          value: "",
          label: emptyLabel
        });
      }

      records.forEach(record => {
        options.push({
          value: record.id,
          label: label(record)
        });
      });

      const select = simpleSelect(id, options, selected);

      if (
        selected &&
        ![...select.options].some(option => option.value === selected)
      ) {
        select.value = emptyLabel ? "" : select.options[0]?.value || "";
      }

      if (!selected && !emptyLabel) {
        select.value = select.options[0]?.value || "";
      }

      return select;
    }

          const session = valueOf("result-session");
          const semester = valueOf("result-semester");
          const candidateCount = Number(valueOf("result-candidates"));
          const passed = Number(valueOf("result-passed"));
          const failed = Number(valueOf("result-failed"));
          const withheld = Number(valueOf("result-withheld"));
          const averageScore = Number(valueOf("result-average"));
          const status = valueOf("result-status");

          if (
            !reference ||
            !courseById(courseId) ||
            !examCommitteeById(committeeId) ||
            !session ||
            !semester ||
            ![
              candidateCount,
              passed,
              failed,
              withheld,
              averageScore
            ].every(Number.isFinite)
          ) {
            showModalError(t("correctErrors"));
            return false;
          }

          if (passed + failed + withheld !== candidateCount) {
            showModalError(t("resultTotalsInvalid"));
            return false;
          }

          const record = {
            id: existing?.id || uid("result-batch"),
            reference,
            courseId,
            committeeId,
            session,
            semester,
            candidateCount,
            passed,
            failed,
            withheld,
            averageScore,
            departmentDecision:
              existing?.departmentDecision ||
              (
                [
                  "faculty_approved",
                  "committee_recommended",
                  "senate_pending"
                ].includes(status)
                  ? "department_approved"
                  : status
              ),
            facultyDecision:
              existing?.facultyDecision ||
              (
                ["committee_recommended", "senate_pending"].includes(status)
                  ? "faculty_approved"
                  : ""
              ),
            committeeRecommendation:
              existing?.committeeRecommendation ||
              (
                ["committee_recommended", "senate_pending"].includes(status)
                  ? "committee_recommended"
                  : ""
              ),
            senateDecision:
              existing?.senateDecision ||
              (
                status === "senate_pending"
                  ? "senate_pending"
                  : ""
              ),
            status,
            minuteReference: existing?.minuteReference || "",
            decisionReason: existing?.decisionReason || "",
            submittedAt:
              existing?.submittedAt ||
