        ]
          .join(" ")
          .toLocaleLowerCase(LOCALES[state.language]);

        return (
          (!search || searchable.includes(search)) &&
          (!state.filters.status || project.status === state.filters.status)
        );
      });

      container.replaceChildren();

      if (!projects.length) {
        container.append(emptyState(t("noMatches"), t("noMatchesBody"), "◆"));
        return;
      }

      const grid = createElement("div", {
        className: "grid three"
      });

      projects.forEach(project => {
        grid.append(
          createElement("article", {
            className: "entity-card",
            children: [
              createElement("strong", {
                text: localized(project.title)
              }),
              createElement("span", {
                text: lecturerById(project.leadId)?.name || "—"
              }),
              createElement("div", {
                className: "meta-row",
                children: [
                  createElement("span", {
                    text: `${t("milestones")}: ${formatNumber(project.milestones)}`
                  }),
                  createElement("span", {
                    text: formatDate(project.submittedAt)
                  })
                ]
              }),
              createElement("progress", {
                attrs: {
                  max: "100",
                  value: project.progress,
                  "aria-label": `${t("progress")}: ${project.progress}%`
                }
              }),
              createElement("div", {
                className: "status-line",
                attrs: {
                  style: "margin-top:.75rem;"
                },
                children: [
                  makeBadge(project.status),
                  createElement("span", {
                    text: `${formatNumber(project.progress)}%`
                  }),
                  makeButton(t("edit"), () => openResearchEditor(project), "btn secondary small"),
                  makeButton(
                    t("delete"),
                    () => deleteRecord("research", project.id, renderResearch),
                    "btn danger small"
                  )
                ]
              })
            ]
          })
        );
      });

      container.append(grid);
    }

    function openResearchEditor(existing = null) {
      const titleInput = createElement("input", {
        attrs: {
          id: "research-title",
          type: "text",
          maxlength: "240",
          required: true,
          value: localized(existing?.title)
        }
      });

      const leadSelect = createLecturerSelect(
        "research-lead",
        existing?.leadId
      );

      const milestonesInput = createElement("input", {
        attrs: {
          id: "research-milestones",
          type: "number",
          min: "0",
          max: "100",
          value: existing?.milestones ?? "0"
        }
      });

      const progressInput = createElement("input", {
        attrs: {
          id: "research-progress",
          type: "number",
          min: "0",
          max: "100",
          value: existing?.progress ?? "0"
        }
      });

      const statusSelect = createStatusSelect(
        "research-status",
        existing?.status || "draft",
        ["draft", "in_progress", "completed"]
      );

      openModal({
        title: existing ? `${t("edit")} · ${t("research")}` : t("addResearch"),
        content: createElement("div", {
          className: "form-grid",
          children: [
            makeField("title", titleInput, "", true),
            makeField("lead", leadSelect, "", true),
            makeField("milestones", milestonesInput),
            makeField("progress", progressInput),
            makeField("status", statusSelect)
          ]
        }),
        submitLabel: existing ? t("update") : t("create"),
        onSubmit: () => {
          const milestones = Number(milestonesInput.value);
          const progress = Number(progressInput.value);

          if (
            !normalize(titleInput.value) ||
            !leadSelect.value ||
            !Number.isFinite(milestones) ||
            milestones < 0 ||
            !Number.isFinite(progress) ||
            progress < 0 ||
            progress > 100
          ) {
            showModalError(t("correctErrors"));
            return false;
          }

          const record = {
            id: existing?.id || `research-${crypto.randomUUID()}`,
            title: makeLocalized(normalize(titleInput.value)),
            leadId: leadSelect.value,
            milestones,
            progress,
            status: statusSelect.value,
            submittedAt: existing?.submittedAt || new Date().toISOString()
          };

          if (existing) {
            const index = state.data.research.findIndex(item => item.id === existing.id);
            state.data.research[index] = record;
          } else {
            state.data.research.push(record);
          }

          persistData();
          addActivity(`${localized(record.title)} research project updated`);
          showToast(t("research"), t("sampleSaved"), "success");
          renderResearch();

          return true;
        }
      });
    }

    function renderAnalytics() {
      $("#page-actions").append(
        makeButton(t("print"), () => print(), "btn secondary")
      );

      const programmeDistribution = scopedProgrammes().map(programme => ({
        label: programme.code,
        count: state.data.students.filter(student => student.programmeId === programme.id).length
      }));

      const studentStanding = ["good", "at_risk", "probation"].map(status => ({
        label: formatStatus(status),
        count: scopedStudents().filter(student => student.status === status).length
      }));

      const lecturerWorkload = ["full", "part_time"].map(workload => ({
        label: formatStatus(workload),
        count: state.data.lecturers.filter(lecturer => lecturer.workload === workload).length
      }));

      const approvalStatus = ["pending", "approved", "returned", "rejected"].map(status => ({
        label: formatStatus(status),
        count: scopedApprovals().filter(approval => approval.status === status).length
      }));

      $("#view").replaceChildren(
        createElement("div", {
          className: "grid two",
          children: [
            chartPanel(t("distributionByProgramme"), programmeDistribution),
            chartPanel(t("studentStanding"), studentStanding),
            chartPanel(t("lecturerWorkload"), lecturerWorkload),
            chartPanel(t("approvalStatus"), approvalStatus)
          ]
        })
      );
    }

    function chartPanel(title, items) {
      const maximum = Math.max(
        1,
        ...items.map(item => Number(item.count || 0))
      );

      const chart = createElement("div", {
        className: "chart",
        attrs: {
          role: "img",
          "aria-label": title
        }
      });

      items.forEach(item => {
        const width = Math.max(
          0,
          Math.min(100, Number(item.count || 0) / maximum * 100)
        );

        chart.append(
          createElement("div", {
            className: "chart-row",
            children: [
              createElement("span", {
                className: "chart-label",
                text: item.label
              }),
              createElement("div", {
                className: "chart-track",
                children: [
                  createElement("div", {
                    className: "chart-bar",
                    attrs: {
                      style: `width:${width}%`
                    }
                  })
                ]
              }),
              createElement("strong", {
                className: "chart-value",
                text: formatNumber(item.count)
              })
            ]
          })
        );
      });

      return createElement("section", {
        className: "panel",
        children: [
          createElement("div", {
            className: "panel-header",
            children: [
              createElement("h2", {
                text: title
              })
            ]
          }),
          chart
        ]
      });
    }

    function renderHelp() {
      const panel = createElement("section", {
        className: "panel"
      });

      [
        ["helpSecurity", "helpSecurityBody"],
        ["helpApprovals", "helpApprovalsBody"],
        ["helpLanguage", "helpLanguageBody"],
        ["helpSample", "helpSampleBody"]
      ].forEach(([titleKey, bodyKey]) => {
        panel.append(
          createElement("details", {
            children: [
              createElement("summary", {
                text: t(titleKey)
              }),
              createElement("p", {
                text: t(bodyKey)
              })
            ]
          })
        );
      });

      $("#view").replaceChildren(panel);
    }

    function tableHeader(key) {
      return createElement("th", {
        text: t(key),
        attrs: {
          scope: "col"
        }
      });
    }

    function makeTable(caption, headers, body) {
      return createElement("div", {
        className: "table-wrap",
        children: [
          createElement("table", {
            children: [
              createElement("caption", {
                text: caption
              }),
              createElement("thead", {
                children: [
                  createElement("tr", {
                    children: headers.map(tableHeader)
                  })
                ]
              }),
              body
            ]
          })
        ]
      });
    }

    function createStatusSelect(id, value, statuses) {
      const select = createElement("select", {
        attrs: {
          id
        }
      });

      statuses.forEach(status => {
        select.append(
          createElement("option", {
            text: formatStatus(status),
            attrs: {
              value: status
            }
          })
        );
      });

      select.value = value;
      return select;
    }

    function createProgrammeSelect(id, selected = "") {
      const select = createElement("select", {
        attrs: {
          id,
          required: true
        }
      });

      state.data.programmes.forEach(programme => {
        select.append(
          createElement("option", {
            text: `${programme.code} · ${localized(programme.title)}`,
            attrs: {
              value: programme.id
            }
          })
        );
      });

      select.value =
        selected ||
        state.data.programmes[0]?.id ||
        "";

      return select;
    }

    function createLecturerSelect(id, selected = "") {
      const select = createElement("select", {
        attrs: {
          id,
          required: true
        }
      });

      state.data.lecturers
        .filter(lecturer => lecturer.status === "active" || lecturer.id === selected)
        .forEach(lecturer => {
          select.append(
            createElement("option", {
              text: lecturer.name,
              attrs: {
                value: lecturer.id
              }
            })
          );
        });

      select.value =
        selected ||
        state.data.lecturers.find(item => item.status === "active")?.id ||
        "";

      return select;
    }

    function deleteRecord(collectionName, id, rerender) {
      if (!confirm(t("confirmDelete"))) {
        return;
      }

      state.data[collectionName] = state.data[collectionName].filter(
        item => item.id !== id
      );

      persistData();
      showToast(t("delete"), t("sampleDeleted"), "success");
      rerender();
    }

    function openModal({
      title,
      content,
      submitLabel = t("save"),
      onSubmit = null
    }) {
      $("#modal-title").textContent = title;
      $("#modal-body").replaceChildren(content);
      $("#modal-error").hidden = true;
      $("#modal-error").textContent = "";

      state.modalSubmit = onSubmit;
      $("#modal-submit").hidden = !onSubmit;
      $("#modal-submit").textContent = submitLabel;

      if (!$("#modal").open) {
        $("#modal").showModal();
      }
    }

    function closeModal() {
      if ($("#modal").open) {
        $("#modal").close();
      }

      state.modalSubmit = null;
      $("#modal-body").replaceChildren();
      $("#modal-error").hidden = true;
    }

    function showModalError(message) {
      $("#modal-error").hidden = false;
      $("#modal-error").textContent = message;
    }

    function renderNotifications() {
      const container = $("#notification-list");
      const unread = state.data.notifications.filter(item => !item.readAt).length;

      container.replaceChildren();

      $("#notification-count").textContent = formatNumber(unread);
      $("#notification-count").hidden = unread === 0;

      $("#notification-toggle").setAttribute(
        "aria-label",
        `${t("notifications")}: ${formatNumber(unread)}`
      );

      if (!state.data.notifications.length) {
        container.append(emptyState(t("noNotifications"), t("noData"), "♢"));
        return;
      }

      const list = createElement("ul", {
        className: "list"
      });

      state.data.notifications.forEach(notification => {
        const actions = createElement("div", {
          className: "inline",
          attrs: {
            style: "margin-top:.55rem;"
          }
        });

        if (!notification.readAt) {
          actions.append(
            makeButton(
              t("markRead"),
              () => {
                notification.readAt = new Date().toISOString();
                persistData();
                renderNotifications();
              },
              "btn secondary small"
            )
          );
        }

        actions.append(
          makeButton(
            t("remove"),
            () => {
              state.data.notifications = state.data.notifications.filter(
                item => item.id !== notification.id
              );

              persistData();
              renderNotifications();
              showToast(t("notifications"), t("sampleDeleted"), "success");
            },
            "btn danger small"
          )
        );

        list.append(
          createElement("li", {
            className: "list-item",
            children: [
              createElement("strong", {
                text: localized(notification.title)
              }),
              createElement("span", {
                text: localized(notification.body)
              }),
              createElement("time", {
                text: formatDateTime(notification.createdAt),
                attrs: {
                  datetime: notification.createdAt
                }
              }),
              actions
            ]
          })
        );
      });

      container.append(list);
    }

    function performGlobalSearch(query) {
      const search = normalize(query).toLocaleLowerCase(LOCALES[state.language]);
      const container = $("#search-results");

      if (search.length < 2) {
        closeSearch();
        return;
      }

      const results = [];

      state.data.programmes.forEach(programme => {
        if (
          [programme.code, localized(programme.title)]
            .join(" ")
            .toLocaleLowerCase(LOCALES[state.language])
            .includes(search)
        ) {
          results.push({
            route: "programmes",
            programmeId: programme.id,
            title: `${programme.code} · ${localized(programme.title)}`,
            subtitle: t("programmes")
          });
        }
      });

      state.data.courses.forEach(course => {
        if (
          [course.code, localized(course.title)]
            .join(" ")
            .toLocaleLowerCase(LOCALES[state.language])
            .includes(search)
        ) {
          results.push({
            route: "courses",
            programmeId: course.programmeId,
            title: `${course.code} · ${localized(course.title)}`,
            subtitle: lecturerById(course.lecturerId)?.name || ""
          });
        }
      });

      state.data.lecturers.forEach(lecturer => {
        if (
          [lecturer.name, lecturer.email]
            .join(" ")
            .toLocaleLowerCase(LOCALES[state.language])
            .includes(search)
        ) {
          results.push({
            route: "lecturers",
            title: lecturer.name,
            subtitle: lecturer.email
          });
        }
      });

      state.data.students.forEach(student => {
        if (
          [student.name, student.matric]
            .join(" ")
            .toLocaleLowerCase(LOCALES[state.language])
            .includes(search)
        ) {
          results.push({
            route: "students",
            programmeId: student.programmeId,
            title: student.name,
            subtitle: student.matric
          });
        }
      });

      container.replaceChildren();

      results.slice(0, 12).forEach(result => {
        container.append(
          createElement("button", {
            attrs: {
              type: "button"
            },
            children: [
              createElement("strong", {
                text: result.title
              }),
              createElement("small", {
                text: result.subtitle
              })
            ],
            events: {
              click: () => {
                if (result.programmeId) {
                  state.scopeProgrammeId = result.programmeId;
                  populateScopeSwitcher();
                }

                closeSearch();
                $("#global-search-input").value = "";
                navigate(result.route);
              }
            }
          })
        );
      });

      if (!results.length) {
        container.append(
          createElement("div", {
            className: "list-item",
            text: t("noMatches")
          })
        );
      }

      container.hidden = false;
    }

    function closeSearch() {
      $("#search-results").hidden = true;
      $("#search-results").replaceChildren();
    }

    function openSidebar() {
      $("#sidebar").dataset.open = "true";
      $("#sidebar-toggle").setAttribute("aria-expanded", "true");
      $("#sidebar-backdrop").dataset.open = "true";
      $("#sidebar-backdrop").setAttribute("aria-hidden", "false");
      document.body.dataset.scrollLock = "true";
    }

    function closeSidebar() {
      $("#sidebar").dataset.open = "false";
      $("#sidebar-toggle").setAttribute("aria-expanded", "false");
      $("#sidebar-backdrop").dataset.open = "false";
      $("#sidebar-backdrop").setAttribute("aria-hidden", "true");

      if ($("#notification-drawer").dataset.open !== "true") {
        document.body.dataset.scrollLock = "false";
      }
    }

    function openNotifications() {
      $("#notification-drawer").dataset.open = "true";
      $("#notification-drawer").setAttribute("aria-hidden", "false");
      $("#notification-toggle").setAttribute("aria-expanded", "true");
      $("#notification-backdrop").dataset.open = "true";
      $("#notification-backdrop").setAttribute("aria-hidden", "false");
      document.body.dataset.scrollLock = "true";
      $("#notification-close").focus();
    }

    function closeNotifications() {
      $("#notification-drawer").dataset.open = "false";
      $("#notification-drawer").setAttribute("aria-hidden", "true");
      $("#notification-toggle").setAttribute("aria-expanded", "false");
      $("#notification-backdrop").dataset.open = "false";
      $("#notification-backdrop").setAttribute("aria-hidden", "true");
      document.body.dataset.scrollLock = "false";
    }

    function closeProfileMenu() {
      $("#profile-menu").hidden = true;
      $("#profile-toggle").setAttribute("aria-expanded", "false");
    }

    function resetSampleData() {
      if (!confirm(t("resetConfirm"))) {
        return;
      }

      state.data = createInitialData();
      state.scopeProgrammeId = "";
      state.approvalSelection.clear();

      persistData();
      populateScopeSwitcher();
      renderIdentity();
      renderNotifications();
      renderRoute();

      showToast(t("resetSample"), t("resetComplete"), "success");
    }

    function bindEvents() {
      $("#sidebar-toggle").addEventListener("click", () => {
        if ($("#sidebar").dataset.open === "true") {
          closeSidebar();
        } else {
          openSidebar();
        }
      });

      $("#sidebar-backdrop").addEventListener("click", closeSidebar);

      $("#notification-toggle").addEventListener("click", openNotifications);
      $("#notification-close").addEventListener("click", closeNotifications);
      $("#notification-backdrop").addEventListener("click", closeNotifications);

      $("#profile-toggle").addEventListener("click", event => {
        event.stopPropagation();

        const menu = $("#profile-menu");
        menu.hidden = !menu.hidden;

        $("#profile-toggle").setAttribute(
          "aria-expanded",
          String(!menu.hidden)
        );
      });

      document.addEventListener("click", event => {
        if (
          !$("#profile-menu").hidden &&
          !$("#profile-menu").contains(event.target) &&
          !$("#profile-toggle").contains(event.target)
        ) {
          closeProfileMenu();
        }

        if (
          !$("#search-results").contains(event.target) &&
          !$(".global-search").contains(event.target)
        ) {
          closeSearch();
        }
      });

      $("#scope-switch").addEventListener("change", event => {
        state.scopeProgrammeId = event.target.value;

        try {
          localStorage.setItem(SCOPE_KEY, state.scopeProgrammeId);
        } catch {
          // Storage may be unavailable.
        }

        state.approvalSelection.clear();
        renderRoute();
        navigate(state.route);
      });

      $$("[data-language]", $("#language-switcher")).forEach(buttonNode => {
        buttonNode.addEventListener("click", () => {
          applyLanguage(buttonNode.dataset.language);
        });
      });

      $("#theme-toggle").addEventListener("click", () => {
        applyTheme(state.theme === "dark" ? "light" : "dark");
      });

      $("#global-search-input").addEventListener(
        "input",
        debounce(event => {
          performGlobalSearch(event.target.value);
        })
      );

      $("#modal-close").addEventListener("click", closeModal);
      $("#modal-cancel").addEventListener("click", closeModal);

      $("#modal-form").addEventListener("submit", async event => {
        event.preventDefault();

        if (!state.modalSubmit) {
          closeModal();
          return;
        }

        try {
          const shouldClose = await state.modalSubmit();

          if (shouldClose !== false) {
            closeModal();
          }
        } catch (error) {
          showModalError(error?.message || t("correctErrors"));
        }
      });

      $$("[data-profile-action]").forEach(buttonNode => {
        buttonNode.addEventListener("click", () => {
          closeProfileMenu();

          switch (buttonNode.dataset.profileAction) {
            case "print":
              print();
              break;
            case "help":
              navigate("help");
              break;
            case "reset":
              resetSampleData();
              break;
            case "signout":
              showToast(t("signOut"), t("signOutSample"), "info");
              break;
          }
        });
      });

      document.addEventListener("keydown", event => {
        const target = event.target;

        const editable =
          target instanceof HTMLInputElement ||
          target instanceof HTMLTextAreaElement ||
          target instanceof HTMLSelectElement ||
          target?.isContentEditable;

        if (event.key === "/" && !editable) {
          event.preventDefault();
          $("#global-search-input").focus();
        }

        if (event.key === "Escape") {
          closeSidebar();
          closeNotifications();
          closeProfileMenu();
          closeSearch();
        }
      });

      window.addEventListener("resize", () => {
        if (innerWidth > 1088) {
          closeSidebar();
        }
      });
    }

    function runSelfChecks() {
      const tests = [];

      function test(name, callback) {
        try {
          callback();
          tests.push({
            test: name,
            status: "PASS"
          });
        } catch (error) {
          tests.push({
            test: name,
            status: "FAIL",
            message: error.message
          });
        }
      }

      test("Every route has metadata", () => {
        ROUTES.forEach(([route]) => {
          if (!ROUTE_META[route]) {
            throw new Error(`Missing route metadata: ${route}`);
          }
        });
      });

      test("Every route label exists in three languages", () => {
        ["en", "fr", "ar"].forEach(language => {
          ROUTES.forEach(([, , labelKey]) => {
            if (!I18N[language][labelKey]) {
              throw new Error(`${language} missing ${labelKey}`);
            }
          });
        });
      });

      test("All course programmes exist", () => {
        state.data.courses.forEach(course => {
          if (!programmeById(course.programmeId)) {
            throw new Error(`Missing programme for ${course.code}`);
          }
        });
      });

      test("All course lecturers exist", () => {
        state.data.courses.forEach(course => {
          if (!lecturerById(course.lecturerId)) {
            throw new Error(`Missing lecturer for ${course.code}`);
          }
        });
      });

      test("Role remains Head of Department", () => {
        if (state.data.context.role !== "Head of Department") {
          throw new Error("Unexpected role scope.");
        }
      });

      console.table(tests);
    }

    function initialize() {
      state.data = loadData();

      loadPreferences();
      parseHash();
      bindEvents();

      renderNavigation();
      renderIdentity();
      populateScopeSwitcher();
      renderBreadcrumbs();
      renderPageMeta();
      renderNotifications();
      renderRoute();

      runSelfChecks();
    }

    initialize();
  </script>
</body>
</html>
