    function openApprovalAction(ids, nextStatus) {
      if (!ids.length) {
        showToast(t("validationFailed"), t("noData"), "warning");
        return;
      }

      openModal({
        title: () => formatStatus(nextStatus),
        submitLabel: () => formatStatus(nextStatus),

        build: () => {
          const commentInput = textareaControl(
            "approval-comment",
            ""
          );

          commentInput.minLength = 10;
          commentInput.maxLength = 2000;
          commentInput.required = true;

          return createElement("div", {
            className: "form-grid",
            children: [
              makeField(
                "comment",
                commentInput,
                t("reasonRequired"),
                true
              )
            ]
          });
        },

        onSubmit: () => {
          const comment = valueOf("approval-comment");

          if (comment.length < 10) {
            showModalError(t("reasonRequired"));
            return false;
          }

          ids.forEach(id => {
            const approval = state.data.approvals.find(
              item => item.id === id
            );

            if (approval) {
              approval.status = nextStatus;
              approval.comment = comment;

              addAudit(
                `approval_${nextStatus}`,
                "result_approval",
                approval.id,
                comment
              );
            }
          });

          state.approvalSelection.clear();

          addActivity(
            `${ids.length} faculty approval record(s) updated`
          );

          persistData();

          showToast(t("approvals"), t("sampleSaved"), "success");
          renderApprovals();

          return true;
        }
      });
    }

    function inputControl(id, type, value, attributes = {}) {
      return createElement("input", {
        attrs: {
          id,
          type,
          value,
          ...attributes
        }
      });
    }

    function textareaControl(id, value = "") {
      const textarea = createElement("textarea", {
        attrs: {
          id,
          maxlength: 5000
        }
      });

      textarea.value = value || "";

      return textarea;
    }

    function statusSelectControl(id, selected, statuses) {
      const select = createElement("select", {
        attrs: {
          id
        }
      });

      statuses.forEach(status => {
        select.append(
          createElement("option", {
            text: formatStatus(status),
            attrs: {
              value: status
            }
          })
        );
      });

      select.value = selected;

      return select;
    }

    function departmentSelectControl(id, selected = "") {
      const select = createElement("select", {
        attrs: {
          id,
          required: true
        }
      });

      state.data.departments.forEach(department => {
        select.append(
          createElement("option", {
            text: `${department.code} · ${localized(department.title)}`,
            attrs: {
              value: department.id
            }
          })
        );
      });

      select.value =
        selected ||
        state.data.departments[0]?.id ||
        "";

      return select;
    }

    function fillProgrammeSelect(select, departmentId, selected = "") {
      select.replaceChildren();

      state.data.programmes
        .filter(programme => programme.departmentId === departmentId)
        .forEach(programme => {
          select.append(
            createElement("option", {
              text: `${programme.code} · ${localized(programme.title)}`,
              attrs: {
                value: programme.id
              }
            })
          );
        });

      if (
        selected &&
        [...select.options].some(option => option.value === selected)
      ) {
        select.value = selected;
      }
    }

    function programmeSelectControl(id, selected = "", departmentId = "") {
      const select = createElement("select", {
        attrs: {
          id,
          required: true
        }
      });

      fillProgrammeSelect(select, departmentId, selected);

      return select;
    }

    function fillStaffSelect(select, departmentId, selected = "") {
      select.replaceChildren();

      state.data.staff
        .filter(member =>
          member.departmentId === departmentId &&
          (member.status === "active" || member.id === selected)
        )
        .forEach(member => {
          select.append(
            createElement("option", {
              text: member.name,
              attrs: {
                value: member.id
              }
            })
          );
        });

      if (
        selected &&
        [...select.options].some(option => option.value === selected)
      ) {
        select.value = selected;
      }
    }

    function valueOf(id) {
      return normalize($(`#${CSS.escape(id)}`)?.value);
    }

    function upsertRecord(collection, record) {
      const index = state.data[collection].findIndex(
        item => item.id === record.id
      );

      if (index >= 0) {
        state.data[collection][index] = record;
      } else {
        state.data[collection].push(record);
      }
    }

    function deleteRecord(collection, id, rerender) {
      if (!confirm(t("confirmDelete"))) {
        return;
      }

      state.data[collection] = state.data[collection].filter(
        item => item.id !== id
      );

      addAudit("delete", collection, id);
      persistData();

      showToast(t("delete"), t("sampleDeleted"), "success");
      rerender();
    }

    function deleteDepartment(department) {
      const linked =
        state.data.programmes.some(
          item => item.departmentId === department.id
        ) ||
        state.data.courses.some(
          item => item.departmentId === department.id
        ) ||
        state.data.staff.some(
          item => item.departmentId === department.id
        );

      if (linked) {
        showToast(t("validationFailed"), t("linkedRecord"), "danger");
        return;
      }

      deleteRecord("departments", department.id, renderDepartments);
    }

    function deleteProgramme(programme) {
      const linked =
        state.data.courses.some(
          item => item.programmeId === programme.id
        ) ||
        state.data.students.some(
          item => item.programmeId === programme.id
        );

      if (linked) {
        showToast(t("validationFailed"), t("linkedRecord"), "danger");
        return;
      }

      deleteRecord("programmes", programme.id, renderProgrammes);
    }

    function deleteCourse(course) {
      const linked =
        state.data.students.some(
          item => item.courseId === course.id
        ) ||
        state.data.approvals.some(
          item => item.courseId === course.id
        );

      if (linked) {
        showToast(t("validationFailed"), t("linkedRecord"), "danger");
        return;
      }

      deleteRecord("courses", course.id, renderCourses);
      populateCourseSwitcher();
    }

    function deleteStaff(member) {
      const linked =
        state.data.courses.some(
          item => item.lecturerId === member.id
        ) ||
        state.data.research.some(
          item => item.leadId === member.id
        ) ||
        state.data.approvals.some(
          item => item.lecturerId === member.id
        );

      if (linked) {
        showToast(t("validationFailed"), t("linkedRecord"), "danger");
        return;
      }

      deleteRecord("staff", member.id, renderStaff);
    }

    function tableHeader(key) {
      return createElement("th", {
        text: t(key),
        attrs: {
          scope: "col"
        }
      });
    }

    function makeTable(caption, headers, body) {
      return createElement("div", {
        className: "table-wrap",
        children: [
          createElement("table", {
            children: [
              createElement("caption", {
                text: caption
              }),
              createElement("thead", {
                children: [
                  createElement("tr", {
                    children: headers.map(tableHeader)
                  })
                ]
              }),
              body
            ]
          })
        ]
      });
    }

    function exportDepartments() {
      const rows = [["code", "department", "head", "status"]];

      scopedDepartments().forEach(department => {
        rows.push([
          department.code,
          localized(department.title),
          department.head,
          department.status
        ]);
      });

      downloadCsv("faculty-departments.csv", rows);
    }

    function exportProgrammes() {

        ["code", "programme", "department", "duration_years", "status"]
      ];

      scopedProgrammes().forEach(programme => {
        rows.push([
          programme.code,

          localized(
            departmentById(programme.departmentId)?.title
          ),
          programme.duration,
          programme.status
        ]);
      });

      downloadCsv("faculty-programmes.csv", rows);
    }

    function exportCourses() {
      const rows = [
        [
          "code",

          "department",
          "programme",

          "lecturer",
          "enrolment",

          ),

      downloadCsv("faculty-courses.csv", rows);
    }

    function exportStaff() {
      const rows = [
        [
          "name",
          "department",
          "email",
          "phone",
          "rank",
          "workload",
          "rating",
          "status"
        ]
      ];

      scopedStaff().forEach(member => {

            departmentById(member.departmentId)?.title
          ),
          member.email,
          member.phone,

          member.workload,
          member.rating,
          member.status
        ]);
      });

      downloadCsv("faculty-academic-staff.csv", rows);
    }

    function exportStudents() {
      const rows = [
        [
          "matric",
          "name",
          "department",
          "programme",
          "course",
          "level",
          "cgpa",
          "status"
        ]
      ];

      scopedStudents().forEach(student => {
        rows.push([
          student.matric,
          student.name,
          localized(
            departmentById(student.departmentId)?.title
          ),

          ),

    function snapshotModalValues() {
      const values = {};

      $$("input,select,textarea", $("#modal-body")).forEach(control => {
        if (!control.id) {
          return;
        }

        values[control.id] =
          control.type === "checkbox"
            ? control.checked
            : control.value;
      });

      return values;
    }

    function restoreModalValues(values) {
      for (const [id, value] of Object.entries(values)) {
        const control = $(`#${CSS.escape(id)}`, $("#modal-body"));

        if (!control) {
          continue;
        }

        if (control.type === "checkbox") {
          control.checked = Boolean(value);
        } else {
          control.value = value;
        }
      }
    }

    function openModal(configuration) {
      state.modal = configuration;
      renderModal(false);

      if (!$("#modal").open) {
        $("#modal").showModal();
      }
    }

    function renderModal(preserveValues) {
      if (!state.modal) {
        return;
      }

      const values = preserveValues
        ? snapshotModalValues()
        : null;

      $("#modal-title").textContent =
        typeof state.modal.title === "function"
          ? state.modal.title()
          : state.modal.title;

      $("#modal-submit").textContent =
        typeof state.modal.submitLabel === "function"
          ? state.modal.submitLabel()
          : state.modal.submitLabel || t("save");

      $("#modal-error").hidden = true;
      $("#modal-error").textContent = "";

      $("#modal-body").replaceChildren(
        state.modal.build()
      );

      if (values) {
        restoreModalValues(values);
      }
    }

    function closeModal() {
      if ($("#modal").open) {
        $("#modal").close();
      }

      state.modal = null;
      $("#modal-body").replaceChildren();
      $("#modal-error").hidden = true;
    }

    function showModalError(message) {
      $("#modal-error").hidden = false;
      $("#modal-error").textContent = message;
    }

    function renderNotifications() {
      const container = $("#notification-list");

      const unread = state.data.notifications.filter(
        item => !item.readAt
      ).length;

      container.replaceChildren();

      $("#notification-count").textContent = formatNumber(unread);
      $("#notification-count").hidden = unread === 0;

      $("#notification-toggle").setAttribute(
        "aria-label",
        `${t("notifications")}: ${formatNumber(unread)}`
      );

      if (!state.data.notifications.length) {
        container.append(
          emptyState(t("noNotifications"), t("noData"), "♢")
        );
        return;
      }

      const markAll = makeButton(
        t("markAllRead"),
        () => {
          const timestamp = new Date().toISOString();

          state.data.notifications.forEach(notification => {
            notification.readAt ||= timestamp;
          });

          persistData();
          renderNotifications();
        },
        "btn secondary"
      );

      container.append(markAll);

      const list = createElement("ul", {
        className: "list",
        attrs: {
          style: "margin-top:.75rem;"
        }
      });

      state.data.notifications.forEach(notification => {
        const actions = createElement("div", {
          className: "inline",
          attrs: {
            style: "margin-top:.55rem;"
          }
        });

        if (!notification.readAt) {
          actions.append(
            makeButton(
              t("markRead"),
              () => {
                notification.readAt = new Date().toISOString();
                persistData();
                renderNotifications();
              },
              "btn secondary small"
            )
          );
        }

        actions.append(
          makeButton(
            t("remove"),
            () => {
              state.data.notifications =
                state.data.notifications.filter(
                  item => item.id !== notification.id
                );

              persistData();
              renderNotifications();

              showToast(
                t("notifications"),
                t("sampleDeleted"),
                "success"
              );
            },
            "btn danger small"
          )
        );

        list.append(
          createElement("li", {
            className: "list-item",
            children: [
              createElement("strong", {
                text: localized(notification.title)
              }),
              createElement("span", {
                text: localized(notification.body)
              }),
              createElement("time", {
                text: formatDateTime(notification.createdAt),
                attrs: {
                  datetime: notification.createdAt
                }
              }),
              actions
            ]
          })
        );
      });

      container.append(list);
    }

    function performGlobalSearch(query) {
      const search =
        normalize(query).toLocaleLowerCase(LOCALES[state.language]);

      const container = $("#search-results");

      if (search.length < 2) {
        closeSearch();
        return;
      }

      const results = [];

      state.data.departments.forEach(department => {
        if (
          [department.code, localized(department.title), department.head]
            .join(" ")
            .toLocaleLowerCase(LOCALES[state.language])
            .includes(search)
        ) {
          results.push({
            route: "departments",
            title: `${department.code} · ${localized(department.title)}`,
            subtitle: department.head
          });
        }
      });

      state.data.programmes.forEach(programme => {
        if (
          [programme.code, localized(programme.title)]
            .join(" ")
            .toLocaleLowerCase(LOCALES[state.language])
            .includes(search)
        ) {
          results.push({
            route: "programmes",
            title: `${programme.code} · ${localized(programme.title)}`,
            subtitle: localized(
              departmentById(programme.departmentId)?.title
            )
          });
        }
      });

      state.data.courses.forEach(course => {
        if (
          [course.code, localized(course.title)]
            .join(" ")
            .toLocaleLowerCase(LOCALES[state.language])
            .includes(search)
        ) {
          results.push({
            route: "courses",
            courseId: course.id,
            title: `${course.code} · ${localized(course.title)}`,
            subtitle: staffById(course.lecturerId)?.name || ""
          });
        }
      });

      state.data.staff.forEach(member => {
        if (
          [member.name, member.email, member.rank]
            .join(" ")
            .toLocaleLowerCase(LOCALES[state.language])
            .includes(search)
        ) {
          results.push({
            route: "staff",
            title: member.name,
            subtitle: member.email
          });
        }
      });

      state.data.students.forEach(student => {
        if (
          [student.name, student.matric]
            .join(" ")
            .toLocaleLowerCase(LOCALES[state.language])
            .includes(search)
        ) {
          results.push({
            route: "students",
            courseId: student.courseId,
            title: student.name,
            subtitle: student.matric
          });
        }
      });

      container.replaceChildren();

      results.slice(0, 12).forEach(result => {
        container.append(
          createElement("button", {
            attrs: {
              type: "button"
            },
            children: [
              createElement("strong", {
                text: result.title
              }),
              createElement("small", {
                text: result.subtitle
              })
            ],
            events: {
              click: () => {
                if (result.courseId) {
                  state.activeCourseId = result.courseId;
                  persistCourseScope();
                  populateCourseSwitcher();
                }

                closeSearch();
                $("#global-search-input").value = "";
                navigate(result.route);
              }
            }
          })
        );
      });

      if (!results.length) {
        container.append(
          createElement("div", {
            className: "list-item",
            text: t("noMatches")
          })
        );
      }

      container.hidden = false;
    }

    function persistCourseScope() {
      try {
        localStorage.setItem(COURSE_KEY, state.activeCourseId);
      } catch {
        // Storage may be unavailable.
      }
    }

    function closeSearch() {
      $("#search-results").hidden = true;
      $("#search-results").replaceChildren();
    }

    function openSidebar() {
      $("#sidebar").dataset.open = "true";
      $("#sidebar-toggle").setAttribute("aria-expanded", "true");
      $("#sidebar-backdrop").dataset.open = "true";
      $("#sidebar-backdrop").setAttribute("aria-hidden", "false");
      document.body.dataset.scrollLock = "true";
    }

    function closeSidebar() {
      $("#sidebar").dataset.open = "false";
      $("#sidebar-toggle").setAttribute("aria-expanded", "false");
      $("#sidebar-backdrop").dataset.open = "false";
      $("#sidebar-backdrop").setAttribute("aria-hidden", "true");

      if ($("#notification-drawer").dataset.open !== "true") {
        document.body.dataset.scrollLock = "false";
      }
    }

    function openNotifications() {
      $("#notification-drawer").dataset.open = "true";
      $("#notification-drawer").setAttribute("aria-hidden", "false");
      $("#notification-toggle").setAttribute("aria-expanded", "true");
      $("#notification-backdrop").dataset.open = "true";
      $("#notification-backdrop").setAttribute("aria-hidden", "false");
      document.body.dataset.scrollLock = "true";
      $("#notification-close").focus();
    }

    function closeNotifications() {
      $("#notification-drawer").dataset.open = "false";
      $("#notification-drawer").setAttribute("aria-hidden", "true");
      $("#notification-toggle").setAttribute("aria-expanded", "false");
      $("#notification-backdrop").dataset.open = "false";
      $("#notification-backdrop").setAttribute("aria-hidden", "true");
      document.body.dataset.scrollLock = "false";
    }

    function closeProfileMenu() {
      $("#profile-menu").hidden = true;
      $("#profile-toggle").setAttribute("aria-expanded", "false");
    }

    function resetSampleData() {
      if (!confirm(t("resetConfirm"))) {
        return;
      }

      state.data = createInitialData();
      state.activeCourseId = "";
      state.approvalSelection.clear();

      persistData();
      persistCourseScope();

      populateCourseSwitcher();
      renderIdentity();
      renderNotifications();
      renderRoute();

      showToast(t("resetSample"), t("resetComplete"), "success");
    }

    function bindEvents() {
      $("#sidebar-toggle").addEventListener("click", () => {
        if ($("#sidebar").dataset.open === "true") {
          closeSidebar();
        } else {
          openSidebar();
        }
      });

      $("#sidebar-backdrop").addEventListener("click", closeSidebar);

      $("#notification-toggle").addEventListener(
        "click",
        openNotifications
      );

      $("#notification-close").addEventListener(
        "click",
        closeNotifications
      );

      $("#notification-backdrop").addEventListener(
        "click",
        closeNotifications
      );

      $("#profile-toggle").addEventListener("click", event => {
        event.stopPropagation();

        const menu = $("#profile-menu");
        menu.hidden = !menu.hidden;

        $("#profile-toggle").setAttribute(
          "aria-expanded",
          String(!menu.hidden)
        );
      });

      document.addEventListener("click", event => {
        if (
          !$("#profile-menu").hidden &&
          !$("#profile-menu").contains(event.target) &&
          !$("#profile-toggle").contains(event.target)
        ) {
          closeProfileMenu();
        }

        if (
          !$("#search-results").contains(event.target) &&
          !$(".global-search").contains(event.target)
        ) {
          closeSearch();
        }
      });

      $("#course-switch").addEventListener("change", event => {
        state.activeCourseId = event.target.value;
        state.approvalSelection.clear();

        persistCourseScope();

        renderBreadcrumbs();
        renderRoute();
        navigate(state.route);
      });

      $$("[data-language]", $("#language-switcher")).forEach(buttonNode => {
        buttonNode.addEventListener("click", () => {
          applyLanguage(buttonNode.dataset.language);
        });
      });

      $("#theme-toggle").addEventListener("click", () => {
        applyTheme(
          state.theme === "dark"
            ? "light"
            : "dark"
        );
      });

      $("#global-search-input").addEventListener(
        "input",
        debounce(event => {
          performGlobalSearch(event.target.value);
        })
      );

      $("#modal-close").addEventListener("click", closeModal);
      $("#modal-cancel").addEventListener("click", closeModal);

      $("#modal-form").addEventListener("submit", async event => {
        event.preventDefault();

        if (!state.modal?.onSubmit) {
          closeModal();
          return;
        }

        try {
          const shouldClose = await state.modal.onSubmit();

          if (shouldClose !== false) {
            closeModal();
          }
        } catch (error) {
          showModalError(
            error?.message ||
            t("correctErrors")
          );
        }
      });

      $$("[data-profile-action]").forEach(buttonNode => {
        buttonNode.addEventListener("click", () => {
          closeProfileMenu();

          switch (buttonNode.dataset.profileAction) {
            case "print":
              print();
              break;

            case "help":
              navigate("help");
              break;

            case "reset":
              resetSampleData();
              break;

            case "signout":
              showToast(
                t("signOut"),
                t("signOutSample"),
                "info"
              );
              break;
          }
        });
      });

      document.addEventListener("keydown", event => {
        const target = event.target;

        const editable =
          target instanceof HTMLInputElement ||
          target instanceof HTMLTextAreaElement ||
          target instanceof HTMLSelectElement ||
          target?.isContentEditable;

        if (event.key === "/" && !editable) {
          event.preventDefault();
          $("#global-search-input").focus();
        }

        if (event.key === "Escape") {
          closeSidebar();
          closeNotifications();
          closeProfileMenu();
          closeSearch();

          if ($("#modal").open) {
            closeModal();
          }
        }
      });

      window.addEventListener("resize", () => {
        if (innerWidth > 1104) {
          closeSidebar();
        }
      });
    }

    function runSelfChecks() {
      const tests = [];

      function test(name, callback) {
        try {
          callback();

          tests.push({
            test: name,
            status: "PASS"
          });
        } catch (error) {
          tests.push({
            test: name,
            status: "FAIL",
            message: error.message
          });
        }
      }

      test("Every route has metadata", () => {
        ROUTES.forEach(([route]) => {
          if (!ROUTE_META[route]) {
            throw new Error(`Missing route metadata: ${route}`);
          }
        });
      });

      test("Every route label exists in three languages", () => {
        ["en", "fr", "ar"].forEach(language => {
          ROUTES.forEach(([, , labelKey]) => {
            if (!I18N[language][labelKey]) {
              throw new Error(`${language} missing ${labelKey}`);
            }
          });
        });
      });

      test("Every course has a valid department", () => {
        state.data.courses.forEach(course => {
          if (!departmentById(course.departmentId)) {
            throw new Error(`Missing department for ${course.code}`);
          }
        });
      });

      test("Every course has a valid programme", () => {
        state.data.courses.forEach(course => {
          if (!programmeById(course.programmeId)) {
            throw new Error(`Missing programme for ${course.code}`);
          }
        });
      });

      test("Every course has a valid lecturer", () => {
        state.data.courses.forEach(course => {
          if (!staffById(course.lecturerId)) {
            throw new Error(`Missing lecturer for ${course.code}`);
          }
        });
      });

      test("Role remains Dean of the Faculty", () => {
        if (state.data.context.role !== "Dean of the Faculty") {
          throw new Error("Unexpected role scope.");
        }
      });

      console.table(tests);
    }

    function initialize() {
      state.data = loadData();

      loadPreferences();
      parseHash();
      bindEvents();

      renderNavigation();
      renderIdentity();
      populateCourseSwitcher();
      renderBreadcrumbs();
      renderPageMeta();
      renderNotifications();
      renderRoute();

      runSelfChecks();
    }

    initialize();
  </script>
</body>
</html>
