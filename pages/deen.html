<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="utf-8">

>

  <title>Dean of the Faculty | YAJIB University</title>

  <!--
    YAJIB FACULTY DEAN DASHBOARD
    ============================

    This standalone version uses isolated browser sample data.

    Production security requirements:
    - Verify the Dean role on the server.
    - Scope every query by institution_id and faculty_id.
    - Keep database Row Level Security enabled.
    - Use audited RPCs or authenticated Edge Functions for approvals.
    - Never expose service-role keys, private storage keys, or secrets here.
    - Do not trust role names, record IDs, or approval states from the browser.
  -->

  <style>
    :root {
      --gold: #ffd700;
      --gold-soft: #fff3a0;
      --gold-dark: #8d7100;
      --crimson: #dc143c;
      --crimson-dark: #a50e2e;
      --silver: #c0c0c0;

      --navy-950: #050b16;
      --navy-900: #071426;
      --navy-850: #10213b;
      --navy-800: #172e50;
      --navy-700: #29476f;

      --bg: #f1f4f8;
      --surface: #ffffff;
      --surface-soft: #f7f9fc;
      --surface-strong: #e8edf4;
      --glass: rgb(255 255 255 / 88%);

      --text: #141a24;
      --text-soft: #596577;
      --text-muted: #7c8798;
      --border: #d7dee8;

      --success: #087443;
      --warning: #8a5100;
      --danger: #b20e31;
      --info: #0763ad;
      --focus: #0064c8;

      --sidebar-width: 18.6rem;
      --header-height: 4.9rem;
      --content-width: 110rem;

      --radius-sm: .64rem;
      --radius-md: .94rem;
      --radius-lg: 1.28rem;
      --radius-xl: 1.78rem;

      --shadow-xs: 0 1px 4px rgb(15 23 42 / 8%);
      --shadow-sm: 0 8px 24px rgb(15 23 42 / 9%);
      --shadow-md: 0 20px 52px rgb(15 23 42 / 16%);
      --shadow-lg: 0 30px 90px rgb(0 0 0 / 36%);

      --transition: 180ms cubic-bezier(.2, .8, .2, 1);
    }

    html[data-theme="dark"] {
      --bg: #070b12;
      --surface: #111923;
      --surface-soft: #18212e;
      --surface-strong: #263243;
      --glass: rgb(17 25 35 / 89%);

      --text: #f7f8fb;
      --text-soft: #c2cad6;
      --text-muted: #929dae;
      --border: #303c4d;

      --success: #62dda5;
      --warning: #ffd080;
      --danger: #ff809c;
      --info: #82c8ff;
      --focus: #8bc7ff;

      --shadow-xs: 0 1px 4px rgb(0 0 0 / 35%);
      --shadow-sm: 0 8px 24px rgb(0 0 0 / 38%);
      --shadow-md: 0 20px 52px rgb(0 0 0 / 52%);
      --shadow-lg: 0 30px 90px rgb(0 0 0 / 70%);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-width: 20rem;
      min-height: 100%;
      scroll-behavior: smooth;
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 98% 0, rgb(255 215 0 / 14%), transparent 28rem),
        radial-gradient(circle at 0 100%, rgb(220 20 60 / 8%), transparent 25rem),
        var(--bg);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        "Noto Sans Arabic",
        sans-serif;
      line-height: 1.5;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    body[data-scroll-lock="true"] {
      overflow: hidden;
    }

    button,
    input,
    select,
    textarea {
      color: inherit;
      font: inherit;
    }

    button,
    select,
    input[type="checkbox"] {
      cursor: pointer;
    }

    button:disabled,
    input:disabled,
    select:disabled,
    textarea:disabled {
      cursor: not-allowed;
      opacity: .55;
    }

    [hidden] {
      display: none !important;
    }

    :focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    ::selection {
      color: #111;
      background: var(--gold);
    }

    .sr-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    .skip-link {
      position: fixed;
      z-index: 5000;
      inset-block-start: .7rem;
      inset-inline-start: .7rem;
      padding: .7rem 1rem;
      color: #111;
      background: var(--gold);
      border: 2px solid #111;
      border-radius: var(--radius-sm);
      font-weight: 900;
      transform: translateY(-160%);
      transition: transform var(--transition);
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    .sidebar {
      position: fixed;
      z-index: 900;
      inset-block: 0;
      inset-inline-start: 0;
      width: var(--sidebar-width);
      display: flex;
      flex-direction: column;
      overflow: auto;
      color: #fff;
      background:
        radial-gradient(circle at 12% 0, rgb(255 215 0 / 15%), transparent 17rem),
        linear-gradient(180deg, var(--navy-950), var(--navy-900) 58%, #10192a);
      border-inline-end: 1px solid rgb(255 255 255 / 9%);
      box-shadow: 18px 0 48px rgb(3 7 18 / 14%);
      transition: transform var(--transition);
    }

    .brand {
      display: flex;
      min-height: var(--header-height);
      align-items: center;
      gap: .85rem;
      padding: .9rem 1rem;
      border-block-end: 1px solid rgb(255 255 255 / 10%);
    }

    .brand-mark {
      position: relative;
      display: grid;
      width: 3rem;
      height: 3rem;
      place-items: center;
      flex: 0 0 auto;
      color: #111;
      background: linear-gradient(145deg, var(--gold-soft), var(--gold));
      border-radius: .92rem;
      box-shadow:
        inset 0 -4px 0 rgb(0 0 0 / 13%),
        0 11px 30px rgb(255 215 0 / 22%);
      font-size: 1.22rem;
      font-weight: 950;
    }

    .brand-mark::after {
      position: absolute;
      width: .62rem;
      height: .62rem;
      inset-block-start: -.14rem;
      inset-inline-end: -.14rem;
      content: "";
      background: var(--crimson);
      border: 2px solid var(--navy-950);
      border-radius: 50%;
    }

    .brand-copy strong,
    .brand-copy span {
      display: block;
    }

    .brand-copy strong {
      font-size: 1.08rem;
      letter-spacing: -.025em;
    }

    .brand-copy span {
      color: #bec8d8;
      font-size: .75rem;
    }

    .sidebar-label {
      padding: 1rem 1.05rem .35rem;
      color: #8491a7;
      font-size: .67rem;
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .sidebar-nav {
      display: grid;
      gap: .18rem;
      padding: .2rem .7rem .9rem;
    }

    .sidebar-nav button {
      position: relative;
      display: flex;
      width: 100%;
      min-height: 2.8rem;
      align-items: center;
      gap: .72rem;
      padding: .62rem .75rem;
      overflow: hidden;
      color: #b9c3d3;
      text-align: start;
      background: transparent;
      border: 1px solid transparent;
      border-radius: .72rem;
      transition:
        color var(--transition),
        background var(--transition),
        border-color var(--transition),
        transform var(--transition);
    }

    .sidebar-nav button::before {
      position: absolute;
      width: 3px;
      inset-block: .55rem;
      inset-inline-start: 0;
      content: "";
      background: var(--gold);
      border-radius: 999px;
      opacity: 0;
      transform: scaleY(.2);
      transition: var(--transition);
    }

    .sidebar-nav button:hover {
      color: #fff;
      background: rgb(255 255 255 / 7%);
      transform: translateX(2px);
    }

    [dir="rtl"] .sidebar-nav button:hover {
      transform: translateX(-2px);
    }

    .sidebar-nav button[aria-current="page"] {
      color: #fff;
      background:
        linear-gradient(
          90deg,
          rgb(255 215 0 / 15%),
          rgb(255 255 255 / 5%)
        );
      border-color: rgb(255 215 0 / 18%);
    }

    .sidebar-nav button[aria-current="page"]::before {
      opacity: 1;
      transform: scaleY(1);
    }

    .nav-icon {
      display: grid;
      width: 1.7rem;
      height: 1.7rem;
      place-items: center;
      flex: 0 0 auto;
      color: var(--gold);
      background: rgb(255 255 255 / 6%);
      border-radius: .46rem;
      font-size: .9rem;
    }

    .sidebar-footer {
      margin-block-start: auto;
      padding: 1rem;
      color: #9ca8ba;
      border-block-start: 1px solid rgb(255 255 255 / 9%);
      font-size: .74rem;
    }

    .sidebar-footer strong,
    .sidebar-footer span {
      display: block;
    }

    .sidebar-footer strong {
      color: #e9edf4;
    }

    .workspace {
      min-height: 100vh;
      margin-inline-start: var(--sidebar-width);
    }

    .sample-banner {
      display: flex;
      min-height: 2.7rem;
      align-items: center;
      justify-content: center;
      gap: .65rem;
      padding: .55rem 1rem;
      color: #1c1700;
      background:
        repeating-linear-gradient(
          -45deg,
          var(--gold),
          var(--gold) 11px,
          #ffe75b 11px,
          #ffe75b 22px
        );
      border-block-end: 2px solid #735d00;
      font-size: .8rem;
      font-weight: 950;
      text-align: center;
    }

    .topbar {
      position: sticky;
      z-index: 700;
      inset-block-start: 0;
      display: grid;
      grid-template-columns: minmax(12rem, 1fr) minmax(17rem, 33rem) auto;
      align-items: center;
      gap: .85rem;
      min-height: var(--header-height);
      padding: .65rem clamp(.75rem, 2vw, 1.45rem);
      background: var(--glass);
      border-block-end: 1px solid var(--border);
      box-shadow: var(--shadow-xs);
      backdrop-filter: blur(18px) saturate(150%);
    }

    .topbar-start,
    .topbar-actions,
    .breadcrumbs,
    .inline,
    .toolbar,
    .status-line {
      display: flex;
      align-items: center;
      gap: .55rem;
    }

    .topbar-start {
      min-width: 0;
    }

    .breadcrumbs {
      min-width: 0;
      flex-wrap: wrap;
      color: var(--text-soft);
      font-size: .8rem;
    }

    .breadcrumbs button {
      max-width: 16rem;
      padding: .15rem;
      overflow: hidden;
      color: inherit;
      text-overflow: ellipsis;
      white-space: nowrap;
      background: transparent;
      border: 0;
    }

    .breadcrumbs button:hover {
      color: var(--text);
      text-decoration: underline;
    }

    .global-search {
      position: relative;
      display: flex;
      align-items: center;
    }

    .global-search-symbol {
      position: absolute;
      inset-inline-start: .86rem;
      color: var(--text-muted);
      pointer-events: none;
    }

    .global-search input {
      width: 100%;
      min-height: 2.78rem;
      padding: .62rem 3rem .62rem 2.45rem;
      color: var(--text);
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 999px;
    }

    [dir="rtl"] .global-search input {
      padding: .62rem 2.45rem .62rem 3rem;
    }

    .global-search kbd {
      position: absolute;
      inset-inline-end: .75rem;
      padding: .1rem .36rem;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: .34rem;
      font-size: .66rem;
    }

    .search-results {
      position: absolute;
      z-index: 1300;
      inset-block-start: calc(100% + .45rem);
      inset-inline: 0;
      max-height: 25rem;
      overflow: auto;
      padding: .45rem;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: .82rem;
      box-shadow: var(--shadow-md);
    }

    .search-results button {
      display: grid;
      width: 100%;
      gap: .1rem;
      padding: .66rem;
      color: var(--text);
      text-align: start;
      background: transparent;
      border: 0;
      border-radius: .55rem;
    }

    .search-results button:hover {
      background: var(--surface-soft);
    }

    .search-results small {
      color: var(--text-muted);
    }

    .topbar-actions {
      justify-content: flex-end;
    }

    .icon-button,
    .profile-button {
      display: inline-grid;
      min-width: 2.75rem;
      min-height: 2.75rem;
      place-items: center;
      padding: .46rem;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: .72rem;
      box-shadow: var(--shadow-xs);
      transition: var(--transition);
    }

    .icon-button:hover,
    .profile-button:hover {
      background: var(--surface-strong);
      border-color: var(--gold-dark);
      transform: translateY(-1px);
    }

    .profile-button {
      grid-auto-flow: column;
      gap: .45rem;
      padding-inline: .42rem .72rem;
    }

    .avatar {
      display: grid;
      width: 2.12rem;
      height: 2.12rem;
      place-items: center;
      flex: 0 0 auto;
      color: #111;
      background: linear-gradient(145deg, var(--gold-soft), var(--gold));
      border-radius: 50%;
      box-shadow: inset 0 -2px 0 rgb(0 0 0 / 12%);
      font-size: .7rem;
      font-weight: 950;
    }

    .notification-button {
      position: relative;
    }

    .notification-count {
      position: absolute;
      display: grid;
      min-width: 1.18rem;
      height: 1.18rem;
      place-items: center;
      inset-block-start: -.27rem;
      inset-inline-end: -.27rem;
      padding-inline: .2rem;
      color: #fff;
      background: var(--crimson);
      border: 2px solid var(--surface);
      border-radius: 999px;
      font-size: .58rem;
      font-weight: 950;
    }

    .compact-select {
      min-height: 2.75rem;
      max-width: 17rem;
      padding: .5rem .7rem;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: .72rem;
      box-shadow: var(--shadow-xs);
    }

    .language-switcher {
      display: flex;
      padding: .2rem;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: .72rem;
      box-shadow: var(--shadow-xs);
    }

    .language-switcher button {
      min-width: 2.45rem;
      min-height: 2.25rem;
      padding: .3rem .45rem;
      color: var(--text-soft);
      background: transparent;
      border: 0;
      border-radius: .5rem;
      font-size: .72rem;
      font-weight: 900;
    }

    .language-switcher button:hover {
      color: var(--text);
      background: var(--surface-strong);
    }

    .language-switcher button[aria-pressed="true"] {
      color: #111;
      background: var(--gold);
      box-shadow: inset 0 -2px 0 rgb(0 0 0 / 10%);
    }

    .content {
      width: min(100%, var(--content-width));
      margin-inline: auto;
      padding: clamp(1rem, 2vw, 1.75rem);
    }

    .page-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-block-end: 1rem;
    }

    .page-heading h1,
    .page-heading p {
      margin: 0;
    }

    .page-heading h1 {
      font-size: clamp(1.65rem, 3vw, 2.45rem);
      line-height: 1.15;
      letter-spacing: -.04em;
    }

    .page-heading p {
      max-width: 60rem;
      margin-block-start: .4rem;
      color: var(--text-soft);
    }

    .eyebrow {
      display: block;
      margin-block-end: .25rem;
      color: var(--crimson);
      font-size: .72rem;
      font-weight: 950;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .page-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: .55rem;
    }

    .hero {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(14rem, .55fr);
      gap: 1rem;
      overflow: hidden;
      padding: clamp(1.35rem, 3vw, 2.2rem);
      color: #fff;
      background:
        linear-gradient(120deg, rgb(220 20 60 / 74%), transparent 48%),
        radial-gradient(circle at 90% 8%, rgb(255 215 0 / 22%), transparent 17rem),
        linear-gradient(145deg, #060d18, #1b3152);
      border: 1px solid rgb(255 255 255 / 8%);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-md);
    }

    .hero h2,
    .hero p {
      position: relative;
      z-index: 1;
      margin: 0;
    }

    .hero h2 {
      font-size: clamp(1.5rem, 3vw, 2.4rem);
      line-height: 1.17;
    }

    .hero p {
      max-width: 50rem;
      margin-block-start: .55rem;
      color: #e5eaf2;
    }

    .hero-card {
      position: relative;
      z-index: 1;
      align-self: center;
      padding: 1rem;
      color: #161300;
      background: linear-gradient(145deg, var(--gold-soft), var(--gold));
      border-radius: var(--radius-md);
      box-shadow:
        inset 0 -4px 0 rgb(0 0 0 / 12%),
        0 14px 32px rgb(0 0 0 / 20%);
    }

    .hero-card strong,
    .hero-card span {
      display: block;
    }

    .hero-card span {
      margin-block-start: .2rem;
      font-size: .78rem;
    }

    .grid {
      display: grid;
      gap: 1rem;
    }

    .grid.two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .grid.three {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .grid.four {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1rem;
      margin-block: 1rem;
    }

    .card,
    .panel,
    .kpi,
    .empty-state {
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
    }

    .panel,
    .card {
      padding: 1rem;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .8rem;
      margin-block-end: .85rem;
    }

    .panel-header h2,
    .panel-header h3 {
      margin: 0;
      font-size: 1.08rem;
    }

    .kpi {
      position: relative;
      min-height: 8.45rem;
      overflow: hidden;
      padding: 1rem;
      transition:
        transform var(--transition),
        box-shadow var(--transition),
        border-color var(--transition);
    }

    .kpi:hover {
      border-color: color-mix(in srgb, var(--gold-dark) 55%, var(--border));
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }

    .kpi::before {
      position: absolute;
      height: 3px;
      inset-block-start: 0;
      inset-inline: 0;
      content: "";
      background: linear-gradient(90deg, var(--gold), var(--crimson));
    }

    .kpi::after {
      position: absolute;
      width: 5.5rem;
      height: 5.5rem;
      inset-inline-end: -2.2rem;
      inset-block-end: -2.9rem;
      content: "";
      background: var(--gold);
      border-radius: 50%;
      opacity: .15;
    }

    .kpi[data-tone="danger"]::after {
      background: var(--crimson);
    }

    .kpi[data-tone="silver"]::after {
      background: var(--silver);
    }

    .kpi-label,
    .kpi-value,
    .kpi-note {
      position: relative;
      z-index: 1;
      display: block;
    }

    .kpi-label {
      min-height: 2.5rem;
      color: var(--text-soft);
      font-size: .8rem;
      font-weight: 850;
    }

    .kpi-value {
      margin-block-start: .35rem;
      font-size: clamp(1.55rem, 3vw, 2.25rem);
      font-variant-numeric: tabular-nums;
      font-weight: 950;
      line-height: 1;
    }

    .kpi-note {
      margin-block-start: .5rem;
      color: var(--text-muted);
      font-size: .72rem;
    }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: .75rem;
    }

    .quick-action,
    .entity-card {
      position: relative;
      padding: .9rem;
      overflow: hidden;
      color: var(--text);
      text-align: start;
      background: linear-gradient(145deg, var(--surface-soft), var(--surface));
      border: 1px solid var(--border);
      border-radius: .8rem;
      transition: var(--transition);
    }

    .quick-action {
      min-height: 6.6rem;
    }

    .quick-action::after,
    .entity-card::after {
      position: absolute;
      width: 3.5rem;
      height: 3.5rem;
      inset-block-end: -2rem;
      inset-inline-end: -1.2rem;
      content: "";
      background: var(--gold);
      border-radius: 50%;
      opacity: .12;
    }

    .quick-action:hover,
    .entity-card:hover {
      border-color: var(--gold-dark);
      box-shadow: var(--shadow-sm);
      transform: translateY(-2px);
    }

    .quick-action strong,
    .quick-action span,
    .entity-card strong,
    .entity-card span {
      display: block;
    }

    .quick-action span,
    .entity-card span {
      margin-block-start: .32rem;
      color: var(--text-soft);
      font-size: .78rem;
    }

    .toolbar {
      flex-wrap: wrap;
      align-items: end;
      margin-block-end: 1rem;
      padding: .85rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
    }

    .field {
      display: grid;
      gap: .34rem;
      min-width: 0;
    }

    .field.grow {
      min-width: min(100%, 18rem);
      flex: 1 1 18rem;
    }

    .field label {
      color: var(--text-soft);
      font-size: .76rem;
      font-weight: 850;
    }

    .field input,
    .field select,
    .field textarea,
    .table-select {
      width: 100%;
      min-height: 2.72rem;
      padding: .62rem .72rem;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: .6rem;
    }

    .field textarea {
      min-height: 7.5rem;
      resize: vertical;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus,
    .table-select:focus {
      border-color: var(--focus);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 18%, transparent);
      outline: none;
    }

    .field input[aria-invalid="true"],
    .field select[aria-invalid="true"],
    .field textarea[aria-invalid="true"] {
      border-color: var(--danger);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--danger) 17%, transparent);
    }

    .field-help {
      color: var(--text-muted);
      font-size: .72rem;
    }

    .btn {
      display: inline-flex;
      min-height: 2.65rem;
      align-items: center;
      justify-content: center;
      gap: .42rem;
      padding: .58rem .88rem;
      color: #181300;
      background: linear-gradient(145deg, var(--gold-soft), var(--gold));
      border: 1px solid var(--gold-dark);
      border-radius: .64rem;
      box-shadow:
        inset 0 -2px 0 rgb(0 0 0 / 10%),
        0 3px 9px rgb(255 215 0 / 12%);
      font-weight: 880;
      text-decoration: none;
      transition: var(--transition);
    }

    .btn:hover {
      background: var(--gold);
      box-shadow:
        inset 0 -2px 0 rgb(0 0 0 / 12%),
        0 7px 18px rgb(255 215 0 / 19%);
      transform: translateY(-1px);
    }

    .btn.secondary {
      color: var(--text);
      background: var(--surface);
      border-color: var(--border);
      box-shadow: var(--shadow-xs);
    }

    .btn.secondary:hover {
      background: var(--surface-strong);
      border-color: var(--gold-dark);
    }

    .btn.danger {
      color: #fff;
      background: linear-gradient(145deg, #ef3158, var(--crimson));
      border-color: var(--crimson-dark);
    }

    .btn.success {
      color: #fff;
      background: #087443;
      border-color: #075e37;
    }

    .btn.small {
      min-height: 2.15rem;
      padding: .37rem .58rem;
      font-size: .77rem;
    }

    .badge {
      display: inline-flex;
      min-height: 1.65rem;
      align-items: center;
      justify-content: center;
      padding: .18rem .5rem;
      color: var(--text);
      background: var(--surface-strong);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: .68rem;
      font-weight: 880;
      line-height: 1.15;
    }

    .badge.success {
      color: var(--success);
      background: color-mix(in srgb, var(--success) 9%, var(--surface));
      border-color: color-mix(in srgb, var(--success) 34%, var(--border));
    }

    .badge.warning {
      color: var(--warning);
      background: color-mix(in srgb, var(--warning) 9%, var(--surface));
      border-color: color-mix(in srgb, var(--warning) 34%, var(--border));
    }

    .badge.danger {
      color: var(--danger);
      background: color-mix(in srgb, var(--danger) 9%, var(--surface));
      border-color: color-mix(in srgb, var(--danger) 34%, var(--border));
    }

    .badge.info {
      color: var(--info);
      background: color-mix(in srgb, var(--info) 9%, var(--surface));
      border-color: color-mix(in srgb, var(--info) 34%, var(--border));
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: .42rem;
      margin-block-start: .65rem;
      color: var(--text-soft);
      font-size: .76rem;
    }

    .meta-row span {
      padding: .23rem .42rem;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: .36rem;
    }

    progress {
      width: 100%;
      height: .68rem;
      margin-block-start: .7rem;
      accent-color: var(--gold-dark);
    }

    .table-wrap {
      width: 100%;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: .78rem;
      box-shadow: var(--shadow-xs);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      font-size: .83rem;
    }

    caption {
      padding: .78rem;
      color: var(--text-soft);
      text-align: start;
      font-weight: 780;
    }

    th,
    td {
      padding: .7rem;
      text-align: start;
      vertical-align: middle;
      border-block-end: 1px solid var(--border);
    }

    th {
      color: var(--text);
      background: var(--surface-soft);
      font-size: .7rem;
      letter-spacing: .045em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    tbody tr:hover {
      background: color-mix(in srgb, var(--gold) 6%, var(--surface));
    }

    tbody tr:last-child td {
      border-block-end: 0;
    }

    .person-cell {
      display: flex;
      min-width: 13rem;
      align-items: center;
      gap: .65rem;
    }

    .person-cell strong,
    .person-cell span {
      display: block;
    }

    .person-cell span {
      color: var(--text-muted);
      font-size: .72rem;
    }

    .list {
      display: grid;
      gap: .65rem;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .list-item {
      padding: .78rem;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: .66rem;
    }

    .list-item strong,
    .list-item span,
    .list-item p,
    .list-item time {
      display: block;
    }

    .list-item span,
    .list-item p,
    .list-item time {
      margin: .22rem 0 0;
      color: var(--text-soft);
      font-size: .77rem;
    }

    .chart {
      display: grid;
      gap: .65rem;
    }

    .chart-row {
      display: grid;
      grid-template-columns: minmax(6rem, .8fr) minmax(8rem, 3fr) auto;
      align-items: center;
      gap: .62rem;
    }

    .chart-track {
      height: 1.08rem;
      overflow: hidden;
      background: var(--surface-strong);
      border-radius: 999px;
    }

    .chart-bar {
      height: 100%;
      min-width: 2px;
      background: linear-gradient(90deg, var(--crimson), var(--gold));
      border-radius: 999px;
    }

    .chart-label,
    .chart-value {
      font-size: .76rem;
    }

    .chart-value {
      font-variant-numeric: tabular-nums;
      font-weight: 880;
    }

    .empty-state {
      display: grid;
      min-height: 13rem;
      place-items: center;
      padding: 2rem;
      text-align: center;
    }

    .empty-state > div {
      max-width: 40rem;
    }

    .empty-state h2,
    .empty-state p {
      margin: .42rem 0 0;
    }

    .empty-state p {
      color: var(--text-soft);
    }

    .state-icon {
      font-size: 2.15rem;
    }

    .validation-summary {
      padding: .75rem;
      margin-block-end: .8rem;
      color: var(--danger);
      background: color-mix(in srgb, var(--danger) 8%, var(--surface));
      border: 1px solid color-mix(in srgb, var(--danger) 35%, var(--border));
      border-radius: .66rem;
      font-size: .82rem;
      font-weight: 780;
    }

    .backdrop {
      position: fixed;
      z-index: 1080;
      inset: 0;
      background: rgb(2 6 15 / 68%);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition);
      backdrop-filter: blur(3px);
    }

    .backdrop[data-open="true"] {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer {
      position: fixed;
      z-index: 1100;
      inset-block: 0;
      inset-inline-end: 0;
      width: min(94vw, 29rem);
      display: flex;
      flex-direction: column;
      padding: 1rem;
      color: var(--text);
      background: var(--surface);
      border-inline-start: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      transform: translateX(105%);
      transition: transform var(--transition);
    }

    [dir="rtl"] .drawer {
      transform: translateX(-105%);
    }

    .drawer[data-open="true"] {
      transform: translateX(0);
    }

    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .8rem;
      padding-block-end: .8rem;
      border-block-end: 1px solid var(--border);
    }

    .drawer-header h2 {
      margin: 0;
      font-size: 1.18rem;
    }

    .drawer-body {
      overflow: auto;
      padding-block: .85rem;
    }

    .profile-menu {
      position: fixed;
      z-index: 1050;
      inset-block-start: calc(var(--header-height) - .05rem);
      inset-inline-end: 1rem;
      width: min(92vw, 21rem);
      padding: .55rem;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: .82rem;
      box-shadow: var(--shadow-md);
    }

    .profile-summary {
      padding: .7rem;
      border-block-end: 1px solid var(--border);
    }

    .profile-summary strong,
    .profile-summary span {
      display: block;
    }

    .profile-summary span {
      color: var(--text-soft);
      font-size: .76rem;
    }

    .profile-menu button {
      width: 100%;
      min-height: 2.5rem;
      padding: .52rem .65rem;
      color: var(--text);
      text-align: start;
      background: transparent;
      border: 0;
      border-radius: .52rem;
    }

    .profile-menu button:hover {
      background: var(--surface-soft);
    }

    dialog {
      width: min(calc(100% - 1.5rem), 52rem);
      max-height: min(93vh, 60rem);
      padding: 0;
      overflow: hidden;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
    }

    dialog::backdrop {
      background: rgb(2 6 15 / 70%);
      backdrop-filter: blur(5px);
    }

    .dialog-shell {
      display: flex;
      max-height: min(93vh, 60rem);
      flex-direction: column;
    }

    .dialog-header,
    .dialog-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .8rem;
      padding: 1rem;
    }

    .dialog-header {
      color: #fff;
      background:
        linear-gradient(120deg, rgb(220 20 60 / 67%), transparent 55%),
        linear-gradient(145deg, #080e19, #1a2f50);
      border-block-end: 1px solid var(--border);
    }

    .dialog-header h2 {
      margin: 0;
      font-size: 1.17rem;
    }

    .dialog-header .icon-button {
      color: #fff;
      background: rgb(255 255 255 / 8%);
      border-color: rgb(255 255 255 / 17%);
    }

    .dialog-body {
      overflow: auto;
      padding: 1rem;
    }

    .dialog-footer {
      justify-content: flex-end;
      background: var(--surface-soft);
      border-block-start: 1px solid var(--border);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: .85rem;
    }

    .form-grid .full {
      grid-column: 1 / -1;
    }

    .toast-region {
      position: fixed;
      z-index: 2500;
      inset-block-end: max(1rem, env(safe-area-inset-bottom));
      inset-inline-end: max(1rem, env(safe-area-inset-right));
      display: grid;
      width: min(calc(100% - 2rem), 25rem);
      gap: .62rem;
      pointer-events: none;
    }

    .toast {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: start;
      gap: .65rem;
      padding: .82rem;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-inline-start: .36rem solid var(--info);
      border-radius: .75rem;
      box-shadow: var(--shadow-md);
      pointer-events: auto;
    }

    .toast[data-tone="success"] {
      border-inline-start-color: var(--success);
    }

    .toast[data-tone="warning"] {
      border-inline-start-color: var(--warning);
    }

    .toast[data-tone="danger"] {
      border-inline-start-color: var(--danger);
    }

    .toast strong,
    .toast span {
      display: block;
    }

    .toast span {
      margin-block-start: .1rem;
      color: var(--text-soft);
      font-size: .76rem;
    }

    .toast button {
      padding: .1rem;
      color: var(--text-soft);
      background: transparent;
      border: 0;
    }

    details {
      padding: .8rem;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: .65rem;
    }

    details + details {
      margin-block-start: .65rem;
    }

    summary {
      cursor: pointer;
      font-weight: 850;
    }

    .mobile-only {
      display: none;
    }

    @media (max-width: 86rem) {
      .kpi-grid,
      .grid.four {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .grid.three {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .profile-name {
        display: none;
      }
    }

    @media (max-width: 69rem) {
      :root {
        --header-height: 7.9rem;
      }

      .sidebar {
        transform: translateX(-105%);
        box-shadow: var(--shadow-lg);
      }

      [dir="rtl"] .sidebar {
        transform: translateX(105%);
      }

      .sidebar[data-open="true"] {
        transform: translateX(0);
      }

      .workspace {
        margin-inline-start: 0;
      }

      .topbar {
        grid-template-columns: minmax(10rem, 1fr) auto;
      }

      .global-search {
        grid-column: 1 / -1;
        grid-row: 2;
      }

      .mobile-only {
        display: inline-grid;
      }

      .grid.two {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 52rem) {
      .content {
        padding: .85rem;
      }

      .page-heading {
        align-items: stretch;
        flex-direction: column;
      }

      .page-actions {
        justify-content: flex-start;
      }

      .hero,
      .kpi-grid,
      .grid.two,
      .grid.three,
      .grid.four,
      .quick-grid,
      .form-grid {
        grid-template-columns: 1fr;
      }

      .toolbar > * {
        width: 100%;
      }

      .toolbar .btn {
        width: auto;
        flex: 1 1 9rem;
      }

      #course-switch {
        display: none;
      }

      .topbar-actions {
        gap: .28rem;
      }

      .language-switcher button {
        min-width: 2.1rem;
      }
    }

    @media (max-width: 29rem) {
      .language-switcher {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
      }
    }

    @media print {
      @page {
        margin: 1.2cm;
      }

      :root {
        color-scheme: light;
        --bg: #fff;
        --surface: #fff;
        --surface-soft: #fff;
        --surface-strong: #eee;
        --text: #000;
        --text-soft: #333;
        --text-muted: #444;
        --border: #999;
      }

      body {
        background: #fff;
        font-size: 10pt;
      }

      .sidebar,
      .topbar,
      .sample-banner,
      .backdrop,
      .drawer,
      .profile-menu,
      .toast-region,
      .page-actions,
      .toolbar,
      .btn,
      .icon-button,
      .profile-button {
        display: none !important;
      }

      .workspace {
        margin: 0;
      }

      .content {
        width: 100%;
        max-width: none;
        padding: 0;
      }

      .panel,
      .card,
      .kpi,
      .table-wrap {
        break-inside: avoid;
        box-shadow: none;
      }

      .hero {
        color: #000;
        background: #fff;
        border: 2px solid #000;
      }

      .hero p {
        color: #222;
      }
    }
  </style>
</head>

<body>
  <a class="skip-link" href="#main-content" data-i18n="skip">
    Skip to main content
  </a>

  <div id="sidebar-backdrop" class="backdrop" data-open="false" aria-hidden="true"></div>

  <aside id="sidebar" class="sidebar" data-open="false" aria-label="Primary navigation">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">Y</div>

      <div class="brand-copy">
        <strong>YAJIB University</strong>
        <span data-i18n="portalName">Faculty Dean Portal</span>
      </div>
    </div>

    <div class="sidebar-label" data-i18n="workspace">Workspace</div>
    <nav id="sidebar-nav" class="sidebar-nav"></nav>

    <div class="sidebar-footer">
      <strong data-i18n="secureWorkspace">Secure faculty workspace</strong>
      <span id="sidebar-scope"></span>
    </div>
  </aside>

  <div class="workspace">
    <div class="sample-banner" role="status">
      <span aria-hidden="true">⚠</span>
      <span data-i18n="sampleNotice">
        SAMPLE WORKSPACE — Changes are stored only in this browser.
      </span>
    </div>

    <header class="topbar">
      <div class="topbar-start">
        <button
          id="sidebar-toggle"
          class="icon-button mobile-only"
          type="button"
          aria-controls="sidebar"
          aria-expanded="false"
          aria-label="Open navigation"
        >
          ☰
        </button>

        <nav id="breadcrumbs" class="breadcrumbs" aria-label="Breadcrumb"></nav>
      </div>

      <div class="global-search">
        <span class="global-search-symbol" aria-hidden="true">⌕</span>

        <label class="sr-only" for="global-search-input" data-i18n="search">
          Search
        </label>

        <input
          id="global-search-input"
          type="search"
          autocomplete="off"
          data-i18n-placeholder="searchPlaceholder"
          placeholder="Search departments, programmes, courses, staff, or students"
        >

        <kbd aria-hidden="true">/</kbd>
        <div id="search-results" class="search-results" hidden></div>
      </div>

      <div class="topbar-actions">
        <label class="sr-only" for="course-switch" data-i18n="courseScope">
          Course scope
        </label>

        <select id="course-switch" class="compact-select"></select>

        <div id="language-switcher" class="language-switcher" aria-label="Language">
          <button type="button" data-language="en" aria-pressed="true" aria-label="English">
            EN
          </button>

          <button type="button" data-language="fr" aria-pressed="false" aria-label="Français">
            FR
          </button>

          <button type="button" data-language="ar" aria-pressed="false" aria-label="العربية">
            AR
          </button>
        </div>

        <button id="theme-toggle" class="icon-button" type="button" aria-label="Switch theme">
          <span id="theme-icon" aria-hidden="true">◐</span>
        </button>

        <button
          id="notification-toggle"
          class="icon-button notification-button"
          type="button"
          aria-controls="notification-drawer"
          aria-expanded="false"
          aria-label="Notifications"
        >
          <span aria-hidden="true">♢</span>
          <span id="notification-count" class="notification-count" aria-hidden="true">0</span>
        </button>

        <button
          id="profile-toggle"
          class="profile-button"
          type="button"
          aria-controls="profile-menu"
          aria-expanded="false"
        >
          <span id="header-avatar" class="avatar" aria-hidden="true">DF</span>
          <span id="header-name" class="profile-name">Dean of Faculty</span>
          <span aria-hidden="true">▾</span>
        </button>
      </div>
    </header>

    <div id="profile-menu" class="profile-menu" role="menu" hidden>
      <div class="profile-summary">
        <strong id="profile-name">Dean</strong>
        <span id="profile-role">Dean of the Faculty</span>
        <span id="profile-faculty">Faculty</span>
      </div>

      <button type="button" role="menuitem" data-profile-action="print" data-i18n="print">
        Print
      </button>

      <button type="button" role="menuitem" data-profile-action="help" data-i18n="help">
        Help
      </button>

      <button type="button" role="menuitem" data-profile-action="reset" data-i18n="resetSample">
        Reset sample data
      </button>

      <button type="button" role="menuitem" data-profile-action="signout" data-i18n="signOut">
        Sign out
      </button>
    </div>

    <main id="main-content" class="content" tabindex="-1">
      <header class="page-heading">
        <div>
          <span id="page-eyebrow" class="eyebrow">Dean of the Faculty</span>
          <h1 id="page-title">Dashboard</h1>
          <p id="page-subtitle"></p>
        </div>

        <div id="page-actions" class="page-actions"></div>
      </header>

      <section id="view" aria-live="polite"></section>
    </main>
  </div>

  <div id="notification-backdrop" class="backdrop" data-open="false" aria-hidden="true"></div>

  <aside
    id="notification-drawer"
    class="drawer"
    data-open="false"
    aria-hidden="true"
    aria-labelledby="notification-title"
  >
    <div class="drawer-header">
      <h2 id="notification-title" data-i18n="notifications">Notifications</h2>

      <button
        id="notification-close"
        class="icon-button"
        type="button"
        data-i18n-aria-label="close"
        aria-label="Close"
      >
        ×
      </button>
    </div>

    function t(key) {
      return I18N[state.language]?.[key] ?? I18N.en[key] ?? key;
    }

    function localized(value) {
      if (value && typeof value === "object" && !Array.isArray(value)) {
        return value[state.language] ?? value.en ?? Object.values(value)[0] ?? "";
      }

      return value == null ? "" : String(value);
    }

    function normalize(value) {
      return String(value ?? "").trim();
    }

    function makeLocalized(value) {
      return {
        en: value,
        fr: value,
        ar: value
      };
    }

    function initials(name = "") {
      return normalize(name)
        .split(/\s+/)
        .slice(0, 2)
        .map(part => part[0]?.toUpperCase() || "")
        .join("") || "DF";
    }

    function formatNumber(value, options = {}) {
      const numeric = Number(value);

      return Number.isFinite(numeric)
        ? new Intl.NumberFormat(LOCALES[state.language], options).format(numeric)
        : "—";
    }

    function formatDate(value) {
      const date = new Date(value);

      return Number.isNaN(date.getTime())
        ? "—"
        : new Intl.DateTimeFormat(LOCALES[state.language], {
            dateStyle: "medium"
          }).format(date);
    }

    function formatDateTime(value) {
      const date = new Date(value);

      return Number.isNaN(date.getTime())
        ? "—"
        : new Intl.DateTimeFormat(LOCALES[state.language], {
            dateStyle: "medium",
            timeStyle: "short"
          }).format(date);
    }

    function statusTranslationKey(value) {
      return normalize(value)
        .replace(/[-_\s]+(.)?/g, (_, character) =>
          character ? character.toUpperCase() : ""
        )
        .replace(/^./, character => character.toLowerCase());
    }

    function formatStatus(value) {
      const key = statusTranslationKey(value);
      return I18N.en[key] ? t(key) : normalize(value);
    }

    function statusTone(value) {
      const status = normalize(value).toLowerCase();

      if (
        [
          "active",
          "approved",
          "completed",
          "good",
          "available",
          "full"
        ].includes(status)
      ) {
        return "success";
      }

      if (
        [
          "rejected",
          "inactive",
          "at_risk",
          "unavailable",
          "cancelled"
        ].includes(status)
      ) {
        return "danger";
      }

      if (
        [
          "pending",
          "draft",
          "returned",
          "probation",
          "in_progress",
          "scheduled"
        ].includes(status)
      ) {
        return "warning";
      }

      return "info";
    }

    function createElement(tag, options = {}) {
      const node = document.createElement(tag);

      if (options.className) {
        node.className = options.className;
      }

      if (options.text != null) {
        node.textContent = String(options.text);
      }

      for (const [name, value] of Object.entries(options.attrs || {})) {
        if (value == null || value === false) {
          continue;
        }

        node.setAttribute(name, value === true ? "" : String(value));
      }

      for (const [name, value] of Object.entries(options.dataset || {})) {
        node.dataset[name] = String(value);
      }

      for (const [name, handler] of Object.entries(options.events || {})) {
        node.addEventListener(name, handler);
      }

      node.append(...(options.children || []).filter(Boolean));

      return node;
    }

    function makeButton(label, handler, className = "btn", attrs = {}) {
      return createElement("button", {
        className,
        text: label,
        attrs: {
          type: "button",
          ...attrs
        },
        events: {
          click: handler
        }
      });
    }

    function makeField(labelKey, control, help = "", full = false) {
      const wrapper = createElement("div", {

      if (help) {

      return wrapper;
    }

    function debounce(callback, delay = 250) {
      let timeout;

      return (...args) => {
        clearTimeout(timeout);
        timeout = setTimeout(() => callback(...args), delay);
      };
    }

    function showToast(title, message, tone = "info", duration = 4500) {
      const toast = createElement("div", {
        className: "toast",
        dataset: {
          tone
        },
        attrs: {
          role: tone === "danger" ? "alert" : "status"
        }
      });

      toast.append(
        createElement("span", {
          text:
            tone === "success"
              ? "✓"
              : tone === "danger"
                ? "!"
                : tone === "warning"
                  ? "⚠"
                  : "ⓘ",
          attrs: {
            "aria-hidden": "true"
          }
        }),

        createElement("div", {
          children: [
            createElement("strong", {
              text: title
            }),
            createElement("span", {
              text: message
            })
          ]
        }),

        makeButton("×", () => toast.remove(), "", {
          "aria-label": t("close")
        })
      );

      $("#toast-region").append(toast);
      setTimeout(() => toast.remove(), duration);
    }

    function csvCell(value) {
      return `"${String(value ?? "").replaceAll('"', '""')}"`;
    }

    function downloadCsv(filename, rows) {
      const source = rows
        .map(row => row.map(csvCell).join(","))
        .join("\r\n");

      const blob = new Blob([source], {
        type: "text/csv;charset=utf-8"
      });

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download = filename;

      document.body.append(link);
      link.click();
      link.remove();

      URL.revokeObjectURL(url);
    }

      state.data.audit = state.data.audit.slice(0, 100);
    }

    function addActivity(message) {
      state.data.activity.unshift({
        title: makeLocalized(message),
        createdAt: new Date().toISOString()
      });

      state.data.activity = state.data.activity.slice(0, 20);
    }

    function addNotification(title, body) {
      state.data.notifications.unshift({
        id: `notification-${crypto.randomUUID()}`,
        title: makeLocalized(title),
        body: makeLocalized(body),
        createdAt: new Date().toISOString(),
        readAt: null
      });
    }

    function detectLanguage() {
      try {
        const stored = localStorage.getItem(LANGUAGE_KEY);

        if (I18N[stored]) {
          return stored;
        }
      } catch {
        // Storage may be unavailable.
      }

      const browserLanguage =
        navigator.languages?.[0] ||
        navigator.language ||
        "en";

      if (browserLanguage.toLowerCase().startsWith("ar")) {
        return "ar";
      }

      if (browserLanguage.toLowerCase().startsWith("fr")) {
        return "fr";
      }

      return "en";
    }

    function translateStaticUi() {
      $$("[data-i18n]").forEach(node => {
        node.textContent = t(node.dataset.i18n);
      });

      $$("[data-i18n-placeholder]").forEach(node => {
        node.placeholder = t(node.dataset.i18nPlaceholder);
      });

      $$("[data-i18n-aria-label]").forEach(node => {
        node.setAttribute("aria-label", t(node.dataset.i18nAriaLabel));
      });
    }

    function applyLanguage(language, rerender = true) {
      state.language = I18N[language] ? language : "en";

      try {
        localStorage.setItem(LANGUAGE_KEY, state.language);
      } catch {
        // Storage may be unavailable.
      }

      document.documentElement.lang = state.language;
      document.documentElement.dir = state.language === "ar" ? "rtl" : "ltr";

      $$("[data-language]", $("#language-switcher")).forEach(buttonNode => {
        buttonNode.setAttribute(
          "aria-pressed",
          String(buttonNode.dataset.language === state.language)
        );
      });

      translateStaticUi();
      renderNavigation();
      renderIdentity();
      renderBreadcrumbs();
      renderPageMeta();
      populateCourseSwitcher();
      renderNotifications();

      if ($("#modal").open && state.modal) {
        renderModal(true);
      }

      if (rerender) {
        renderRoute();
      }
    }

    function applyTheme(theme) {
      state.theme = theme === "dark" ? "dark" : "light";

      try {
        localStorage.setItem(THEME_KEY, state.theme);
      } catch {
        // Storage may be unavailable.
      }

      document.documentElement.dataset.theme = state.theme;
      $("#theme-icon").textContent = state.theme === "dark" ? "☀" : "◐";
    }

    function loadPreferences() {
      let theme = "";

      try {
        theme = localStorage.getItem(THEME_KEY) || "";
        state.activeCourseId = localStorage.getItem(COURSE_KEY) || "";
      } catch {
        theme = "";
      }

      if (theme !== "light" && theme !== "dark") {
        theme = matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
      }

      applyTheme(theme);
      applyLanguage(detectLanguage(), false);
    }

    function renderNavigation() {
      const navigation = $("#sidebar-nav");
      navigation.replaceChildren();

      ROUTES.forEach(([route, icon, labelKey]) => {
        navigation.append(
          createElement("button", {
            attrs: {
              type: "button",
              "aria-current": state.route === route ? "page" : "false"
            },
            children: [
              createElement("span", {
                className: "nav-icon",
                text: icon,
                attrs: {
                  "aria-hidden": "true"
                }
              }),
              createElement("span", {
                text: t(labelKey)
              })
            ],
            events: {
              click: () => navigate(route)
            }
          })
        );
      });
    }

    function renderIdentity() {
      const context = state.data.context;

      $("#header-name").textContent = context.name;
      $("#header-avatar").textContent = initials(context.name);
      $("#profile-name").textContent = context.name;
      $("#profile-role").textContent = t("deanOfFaculty");
      $("#profile-faculty").textContent = context.faculty;
      $("#sidebar-scope").textContent =
        `${context.faculty} · ${context.academicSession}`;
    }

    function populateCourseSwitcher() {
      const select = $("#course-switch");
      select.replaceChildren();

      select.append(
        createElement("option", {
          text: t("allCourses"),
          attrs: {
            value: ""
          }
        })
      );

      state.data.courses.forEach(course => {
        select.append(
          createElement("option", {
            text: `${course.code} · ${localized(course.title)}`,
            attrs: {
              value: course.id
            }
          })
        );
      });

      if (
        state.activeCourseId &&
        !state.data.courses.some(item => item.id === state.activeCourseId)
      ) {
        state.activeCourseId = "";
      }

      select.value = state.activeCourseId;
    }

    function renderBreadcrumbs() {
      const container = $("#breadcrumbs");
      container.replaceChildren();

      container.append(
        createElement("button", {
          text: t("dashboard"),
          attrs: {
            type: "button"
          },
          events: {
            click: () => navigate("dashboard")
          }
        })
      );

      if (state.route !== "dashboard") {
        container.append(
          createElement("span", {
            text: "/",
            attrs: {
              "aria-hidden": "true"
            }
          }),
          createElement("span", {
            text: t(ROUTE_META[state.route][0]),
            attrs: {
              "aria-current": "page"
            }
          })
        );
      }

      if (state.activeCourseId) {
        const course = courseById(state.activeCourseId);

        container.append(
          createElement("span", {
            text: "/",
            attrs: {
              "aria-hidden": "true"
            }
          }),
          createElement("span", {
            text: course?.code || "—"
          })
        );
      }
    }

    function renderPageMeta() {
      const [titleKey, subtitleKey] = ROUTE_META[state.route];

      $("#page-eyebrow").textContent = t("deanOfFaculty");
      $("#page-title").textContent = t(titleKey);
      $("#page-subtitle").textContent = t(subtitleKey);

      document.title = `${t(titleKey)} · YAJIB ${t("portalName")}`;
    }

    function navigate(route) {
      if (!ROUTE_META[route]) {
        return;
      }

      state.route = route;

      closeSidebar();
      closeSearch();

      renderNavigation();
      renderBreadcrumbs();
      renderPageMeta();
      renderRoute();

      const hash = new URLSearchParams({
        view: route
      });

      if (state.activeCourseId) {
        hash.set("course", state.activeCourseId);
      }

      history.replaceState(null, "", `#${hash.toString()}`);

      $("#main-content").focus({
        preventScroll: true
      });

      scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    function parseHash() {
      const params = new URLSearchParams(location.hash.replace(/^#/, ""));

      if (ROUTE_META[params.get("view")]) {
        state.route = params.get("view");
      }

      const courseId = params.get("course");

      if (state.data.courses.some(item => item.id === courseId)) {
        state.activeCourseId = courseId;
      }
    }

    function scopedCourses() {
      return state.data.courses.filter(course =>
        courseInScope(course.id)
      );
    }

    function scopedDepartments() {
      if (!state.activeCourseId) {
        return state.data.departments;
      }

      const course = courseById(state.activeCourseId);

      return state.data.departments.filter(
        department => department.id === course?.departmentId
      );
    }

    function scopedProgrammes() {
      if (!state.activeCourseId) {
        return state.data.programmes;
      }

      const course = courseById(state.activeCourseId);

      return state.data.programmes.filter(
        programme => programme.id === course?.programmeId
      );
    }

    function scopedStaff() {
      if (!state.activeCourseId) {
        return state.data.staff;
      }

      const course = courseById(state.activeCourseId);

      return state.data.staff.filter(
        staff => staff.id === course?.lecturerId
      );
    }

    function scopedStudents() {
      return state.data.students.filter(student =>
        courseInScope(student.courseId)
      );
    }

    function scopedApprovals() {
      return state.data.approvals.filter(approval =>
        courseInScope(approval.courseId)
      );
    }

    function renderRoute() {
      $("#page-actions").replaceChildren();

      switch (state.route) {
        case "dashboard":
          renderDashboard();
          break;
        case "departments":
          renderDepartments();
          break;
        case "programmes":
          renderProgrammes();
          break;
        case "courses":
          renderCourses();
          break;
        case "staff":
          renderStaff();
          break;
        case "students":
          renderStudents();
          break;
        case "approvals":
          renderApprovals();
          break;
        case "research":
          renderResearch();
          break;
        case "meetings":
          renderMeetings();
          break;
        case "analytics":
          renderAnalytics();
          break;
        case "help":
          renderHelp();
          break;
        default:
          navigate("dashboard");
      }
    }

    function renderDashboard() {
      const departments = scopedDepartments();
      const programmes = scopedProgrammes();
      const courses = scopedCourses();
      const staff = scopedStaff();
      const students = scopedStudents();
      const approvals = scopedApprovals();

      const averageGpa = students.length
        ? students.reduce((sum, student) => sum + Number(student.cgpa || 0), 0) /
          students.length
        : 0;

      const pending = approvals.filter(item => item.status === "pending").length;

      const activeResearch = state.data.research.filter(
        item => item.status === "in_progress"
      ).length;

      const hero = createElement("section", {
        className: "hero",
        children: [
          createElement("div", {
            children: [
              createElement("h2", {
                text: `${t("welcome")}, ${state.data.context.name}`
              }),
              createElement("p", {
                text: t("dashboardSubtitle")
              })
            ]
          }),
          createElement("div", {
            className: "hero-card",
            children: [
              createElement("strong", {
                text:
                  `${state.data.context.academicSession} · ` +
                  `${state.data.context.semester}`
              }),
              createElement("span", {
                text: state.data.context.faculty
              })
            ]
          })
        ]
      });

      const kpis = createElement("div", {
        className: "kpi-grid",
        children: [
          makeStat(formatNumber(departments.length), t("totalDepartments")),
          makeStat(formatNumber(programmes.length), t("totalProgrammes"), "silver"),
          makeStat(formatNumber(courses.length), t("totalCourses")),
          makeStat(formatNumber(staff.length), t("totalStaff"), "silver"),
          makeStat(formatNumber(students.length), t("totalStudents")),
          makeStat(
            formatNumber(averageGpa, {
              minimumFractionDigits: 2,
              maximumFractionDigits: 2
            }),
            t("averageGpa")
          ),
          makeStat(formatNumber(pending), t("pendingApprovals"), "danger"),
          makeStat(formatNumber(activeResearch), t("activeResearch"))
        ]
      });

      const quickPanel = createElement("section", {
        className: "panel",
        children: [
          createElement("div", {
            className: "panel-header",
            children: [
              createElement("h2", {
                text: t("quickActions")
              })
            ]
          }),
          createElement("div", {
            className: "quick-grid",
            children: [
              quickAction(t("addDepartment"), t("departmentsSubtitle"), "departments", openDepartmentEditor),
              quickAction(t("addProgramme"), t("programmesSubtitle"), "programmes", openProgrammeEditor),
              quickAction(t("addCourse"), t("coursesSubtitle"), "courses", openCourseEditor),
              quickAction(t("addStaff"), t("staffSubtitle"), "staff", openStaffEditor),
              quickAction(t("addStudent"), t("studentsSubtitle"), "students", openStudentEditor),
              quickAction(t("addResearch"), t("researchSubtitle"), "research", openResearchEditor)
            ]
          })
        ]
      });

      const activityList = createElement("ul", {
        className: "list"
      });

      state.data.activity.slice(0, 8).forEach(activity => {
        activityList.append(
          createElement("li", {
            className: "list-item",
            children: [
              createElement("strong", {
                text: localized(activity.title)
              }),
              createElement("time", {
                text: formatDateTime(activity.createdAt),
                attrs: {
                  datetime: activity.createdAt
                }
              })
            ]
          })
        );
      });

      const announcementList = createElement("ul", {
        className: "list"
      });

      state.data.announcements.forEach(announcement => {
        announcementList.append(
          createElement("li", {
            className: "list-item",
            children: [
              createElement("strong", {
                text: localized(announcement.title)
              }),
              createElement("p", {
                text: localized(announcement.message)
              }),
              createElement("span", {
                text: announcement.audience
              }),
              createElement("div", {
                className: "inline",
                attrs: {
                  style: "margin-top:.55rem;"
                },
                children: [
                  makeButton(
                    t("edit"),
                    () => openAnnouncementEditor(announcement),
                    "btn secondary small"
                  ),
                  makeButton(
                    t("delete"),
                    () => deleteRecord(
                      "announcements",
                      announcement.id,
                      renderDashboard
                    ),
                    "btn danger small"
                  )
                ]
              })
            ]
          })
        );
      });

      $("#page-actions").append(
        makeButton(t("addAnnouncement"), () => openAnnouncementEditor())
      );

      $("#view").replaceChildren(
        hero,
        kpis,
        createElement("div", {
          className: "grid two",
          children: [
            quickPanel,
            createElement("section", {
              className: "panel",
              children: [
                createElement("div", {
                  className: "panel-header",
                  children: [
                    createElement("h2", {
                      text: t("recentActivity")
                    })
                  ]
                }),
                activityList
              ]
            })
          ]
        }),
        createElement("section", {
          className: "panel",
          attrs: {
            style: "margin-top:1rem;"
          },
          children: [
            createElement("div", {
              className: "panel-header",
              children: [
                createElement("h2", {
                  text: t("announcements")
                })
              ]
            }),
            announcementList
          ]
        })
      );
    }

    function quickAction(title, description, route, callback) {
      return createElement("button", {
        className: "quick-action",
        attrs: {
          type: "button"
        },
        children: [
          createElement("strong", {
            text: title
          }),
          createElement("span", {
            text: description
          })
        ],
        events: {
          click: () => {
            navigate(route);
            callback?.();
          }
        }
      });
    }

    function makeSearchToolbar(filterKey, placeholderKey, rerender, includeStatus = true) {
      const searchInput = createElement("input", {
        attrs: {
          id: `${filterKey}-search`,
          type: "search",
          value: state.filters[filterKey],
          placeholder: t(placeholderKey)
        }
      });

      searchInput.addEventListener(
        "input",
        debounce(event => {
          state.filters[filterKey] = normalize(event.target.value);
          rerender();
        })
      );

      const controls = [
        makeField(placeholderKey, searchInput)
      ];

      if (includeStatus) {
        const statusSelect = createElement("select", {
          attrs: {
            id: `${filterKey}-status`
          }
        });

        [
          ["", t("allStatuses")],
          ["active", t("active")],
          ["inactive", t("inactive")],
          ["draft", t("draft")],
          ["pending", t("pending")],
          ["approved", t("approved")],
          ["rejected", t("rejected")],
          ["returned", t("returned")],
          ["completed", t("completed")],
          ["in_progress", t("inProgress")],
          ["scheduled", t("scheduled")],
          ["cancelled", t("cancelled")]
        ].forEach(([value, label]) => {
          statusSelect.append(
            createElement("option", {
              text: label,
              attrs: {
                value
              }
            })
          );
        });

        statusSelect.value = state.filters.status;

        statusSelect.addEventListener("change", event => {
          state.filters.status = event.target.value;
          rerender();
        });

        controls.push(makeField("status", statusSelect));
      }

      controls.push(
        makeButton(
          t("resetFilters"),
          () => {
            state.filters[filterKey] = "";
            state.filters.status = "";
            renderRoute();
          },
          "btn secondary"
        )
      );

      return createElement("div", {
        className: "toolbar",
        children: controls
      });
    }

      $("#page-actions").append(
        makeButton(t("addDepartment"), () => openDepartmentEditor()),
        makeButton(t("exportCsv"), exportDepartments, "btn secondary")
      );

      $("#view").replaceChildren(
        makeSearchToolbar(
          "departments",
          "searchDepartments",
          renderDepartmentResults
        ),
        createElement("div", {
          attrs: {
            id: "department-results"
          }
        })
      );

      renderDepartmentResults();
    }

    function renderDepartmentResults() {
      const container = $("#department-results");

      if (!container) {
        return;
      }

      const search =
        state.filters.departments.toLocaleLowerCase(LOCALES[state.language]);

      const departments = scopedDepartments().filter(department => {
        const searchable = [
          department.code,
          localized(department.title),
          department.head
        ]
          .join(" ")
          .toLocaleLowerCase(LOCALES[state.language]);

        return (
          (!search || searchable.includes(search)) &&
          (!state.filters.status || department.status === state.filters.status)
        );
      });

      container.replaceChildren();

      if (!departments.length) {
        container.append(emptyState(t("noMatches"), t("noMatchesBody"), "▦"));
        return;

        className: "grid three"

        const programmes = state.data.programmes.filter(
          item => item.departmentId === department.id
        );

        const courses = state.data.courses.filter(
          item => item.departmentId === department.id
        );

        const students = state.data.students.filter(
          item => item.departmentId === department.id
        );

        grid.append(
          createElement("article", {
            className: "entity-card",

              createElement("span", {

                  }),
                  createElement("span", {
                    text: `${t("students")}: ${formatNumber(students.length)}`
                  })
                ]

              createElement("div", {
                className: "status-line",
                attrs: {
                  style: "margin-top:.75rem;"
                },
                children: [
                  makeBadge(department.status),

                  ),
                  makeButton(
                    t("delete"),
                    () => deleteDepartment(department),

                  )
                ]
              })
            ]
          })
        );
      });

      container.append(grid);

      const approvals = scopedApprovals().filter(approval => {
        const course = courseById(approval.courseId);
        const lecturer = staffById(approval.lecturerId);
        const department = departmentById(approval.departmentId);

        const searchable = [
          course?.code,
          localized(course?.title),
          lecturer?.name,
          localized(department?.title),
          localized(approval.anomalies),
          approval.status
        ]
          .join(" ")
          .toLocaleLowerCase(LOCALES[state.language]);

        );
      });

        container.append(emptyState(t("noMatches"), t("noMatchesBody"), "✓"));
        return;
      }

      const selectAll = createElement("input", {
        attrs: {
          type: "checkbox",

      selectAll.checked =
        approvals.length > 0 &&

          state.approvalSelection.has(approval.id)

      selectAll.addEventListener("change", () => {

    function chartPanel(title, items) {
      const maximum = Math.max(
        1,
        ...items.map(item => Number(item.count || 0))
      );

      const chart = createElement("div", {
        className: "chart",
        attrs: {
          role: "img",
          "aria-label": title
        }
      });

      items.forEach(item => {
        const width = Math.max(
          0,
          Math.min(100, Number(item.count || 0) / maximum * 100)
        );

        chart.append(
          createElement("div", {
            className: "chart-row",
            children: [
              createElement("span", {
                className: "chart-label",
                text: item.label
              }),
              createElement("div", {
                className: "chart-track",
                children: [
                  createElement("div", {
                    className: "chart-bar",
                    attrs: {
                      style: `width:${width}%`
                    }
                  })
                ]
              }),
              createElement("strong", {
                className: "chart-value",
                text: formatNumber(item.count)
              })
            ]
          })
        );
      });

      return createElement("section", {
        className: "panel",
        children: [
          createElement("div", {
            className: "panel-header",
            children: [
              createElement("h2", {
                text: title
              })
            ]
          }),
          chart
        ]
      });
    }

    function openDepartmentEditor(existing = null) {
      openModal({
        title: () =>
          existing
            ? `${t("edit")} · ${t("department")}`
            : t("addDepartment"),
        submitLabel: () => existing ? t("update") : t("create"),

        build: () => {
          const codeInput = inputControl(
            "department-code",
            "text",
            existing?.code || "",
            {
              maxlength: 12,
              required: true
            }
          );

          const titleInput = inputControl(
            "department-title",
            "text",
            localized(existing?.title),
            {
              maxlength: 180,
              required: true
            }
          );

          const headInput = inputControl(
            "department-head",
            "text",
            existing?.head || "",
            {
              maxlength: 180,
              required: true
            }
          );

          const statusSelect = statusSelectControl(
            "department-status",
            existing?.status || "active",
            ["active", "inactive"]
          );

          return createElement("div", {
            className: "form-grid",
            children: [
              makeField("code", codeInput),
              makeField("status", statusSelect),
              makeField("title", titleInput, "", true),
              makeField("headOfDepartment", headInput, "", true)
            ]
          });
        },

        onSubmit: () => {
          const code = valueOf("department-code").toUpperCase();
          const title = valueOf("department-title");
          const head = valueOf("department-head");
          const status = valueOf("department-status");

          if (!code || !title || !head) {
            showModalError(t("correctErrors"));
            return false;
          }

          const record = {
            id: existing?.id || `department-${crypto.randomUUID()}`,
            code,
            title: makeLocalized(title),
            head,
            status
          };

          upsertRecord("departments", record);
          addAudit(existing ? "update" : "create", "department", record.id);
          addActivity(`${record.code} department updated`);

          persistData();
          populateCourseSwitcher();

          showToast(t("departments"), t("sampleSaved"), "success");
          renderDepartments();

          return true;
        }
      });
    }
