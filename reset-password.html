<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' https://*.supabase.co wss://*.supabase.co; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"><title>Reset Password | YAJIB Nexus</title><script src="./runtime-config.js"></script>
<style>:root{--navy:#061a33;--gold:#d9ad45;--paper:#f3f6fa;--card:#fff;--ink:#13253a;--muted:#66768a;--line:#dce4ed;--danger:#b42318;--success:#067647}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:1rem;background:radial-gradient(circle at 80% 10%,#174f79,transparent 35%),var(--navy);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}main{width:min(480px,100%);background:var(--card);border-radius:22px;padding:1.7rem;box-shadow:0 25px 70px rgba(0,0,0,.35)}.brand{display:flex;align-items:center;gap:.7rem;margin-bottom:1.4rem}.crest{width:45px;height:45px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(145deg,#f2d073,var(--gold));font-weight:900}.brand strong{display:block}.brand small{color:var(--muted)}h1{margin:.4rem 0;font-size:1.7rem}p{color:var(--muted)}label{display:block;font-weight:750;font-size:.84rem;margin:.9rem 0 .35rem}.input{position:relative}.input input{width:100%;height:49px;border:1px solid var(--line);border-radius:11px;padding:0 .8rem;background:var(--paper);color:var(--ink)}.input button{position:absolute;right:5px;top:5px;height:39px;border:0;background:transparent;color:var(--muted);cursor:pointer}.btn{width:100%;height:46px;border:0;border-radius:11px;background:linear-gradient(135deg,#f2d073,var(--gold));color:#07182a;font-weight:850;margin-top:1.1rem;cursor:pointer}.btn:disabled{opacity:.65}.message{display:none;padding:.7rem;border-radius:9px;margin:.8rem 0}.message.show{display:block}.error{background:#fef3f2;color:var(--danger)}.success{background:#ecfdf3;color:var(--success)}a{display:block;text-align:center;margin-top:1rem;color:#1769a3;font-weight:700;text-decoration:none}:focus-visible{outline:3px solid #4e8ef7;outline-offset:2px}</style></head>
<body><main><div class="brand"><span class="crest">YN</span><span><strong>YAJIB NEXUS</strong><small>Secure account recovery</small></span></div><h1>Choose a new password</h1><p>Use at least 12 characters with uppercase, lowercase, a number and a symbol.</p><div id="message" class="message" role="alert" aria-live="polite"></div><form id="form" novalidate><label for="password">New password</label><div class="input"><input id="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><button type="button" data-show="password">Show</button></div><label for="confirm">Confirm new password</label><div class="input"><input id="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><button type="button" data-show="confirm">Show</button></div><button class="btn" id="submit" type="submit">Update password securely</button></form><a href="./index.html">Return to sign in</a></main>
<script type="module">const $=s=>document.querySelector(s),msg=$("#message"),btn=$("#submit");let supabase;function show(text,type="error"){msg.textContent=text;msg.className=`message ${type} show`}function strong(v){return v.length>=12&&v.length<=128&&/[a-z]/.test(v)&&/[A-Z]/.test(v)&&/\d/.test(v)&&/[^A-Za-z0-9]/.test(v)}async function init(){try{const c=window.__YAJIB_CONFIG__||{};if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(c.supabaseUrl||"")||!(c.supabaseAnonKey||"").startsWith("eyJ"))throw new Error("config");const {createClient}=await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");supabase=createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{detectSessionInUrl:true,persistSession:true,storageKey:"yajib-nexus-auth"}});const {data}=await supabase.auth.getSession();if(!data.session){show("This reset link is invalid or has expired. Request a new link.");btn.disabled=true}}catch{show("Account recovery is not configured or is temporarily unavailable.");btn.disabled=true}}document.querySelectorAll("[data-show]").forEach(b=>b.addEventListener("click",()=>{const i=$("#"+b.dataset.show);i.type=i.type==="password"?"text":"password";b.textContent=i.type==="password"?"Show":"Hide"}));$("#form").addEventListener("submit",async e=>{e.preventDefault();const p=$("#password").value,c=$("#confirm").value;if(!strong(p))return show("Password does not meet the security requirements.");if(p!==c)return show("The passwords do not match.");btn.disabled=true;btn.textContent="Updating…";try{const {error}=await supabase.auth.updateUser({password:p});if(error)throw error;show("Password updated. You may now sign in.","success");await supabase.auth.signOut();setTimeout(()=>location.replace("./index.html?reset=success"),1600)}catch{show("Password could not be updated. Request a fresh reset link.");btn.disabled=false;btn.textContent="Update password securely"}});init();</script></body></html>
